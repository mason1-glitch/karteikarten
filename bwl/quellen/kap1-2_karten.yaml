  - typ: klausurfrage
    w: W12
    folien: [43, 45, 46]
    deckt: [f45.haftung, f46.haftung, f43.juristisch]
    frage: |-
      **Wiederholungsfrage:** Wodurch unterscheiden sich Personengesellschaften und Kapitalgesellschaften hinsichtlich der Haftung?
    antwort: |-
      **Personengesellschaften** (und Einzelunternehmen): Die Haftung trifft die **Gesellschafter selbst**
      - Einzelunternehmen: uneingeschränkt mit Betriebs- und Privatvermögen
      - OHG: alle Gesellschafter uneingeschränkt als Gesamtschuldner (§ 128)
      - KG: Komplementäre uneingeschränkt, Kommanditisten eingeschränkt

      **Kapitalgesellschaften** sind juristische Personen: Die **Gesellschaft haftet uneingeschränkt**, die **Gesellschafter/Aktionäre nur eingeschränkt** (AG, GmbH; SE: uneingeschränkt für Gesellschaft).

      Außerdem: Kapitalgesellschaften haben ein **Mindesteigenkapital** (GmbH 25.000 €, AG 50.000 €, SE 120.000 €), Personengesellschaften keine Vorschrift.

  - typ: anwendung
    folien: [45, 46]
    deckt: [f46.haftung, f46.kapital]
    frage: |-
      Drei Ingenieure gründen ein Unternehmen. Sie wollen **nicht mit dem Privatvermögen haften**, eine **Nachschusspflicht ausschließen** und haben zusammen **40.000 € Eigenkapital**. Welche Rechtsform passt laut den Tabellen?
    antwort: |-
      **GmbH**: Gesellschafter haften eingeschränkt, Mindesteigenkapital 25.000 € ≤ 40.000 € ✓.
      - AG (50.000 €), SE (120.000 €): zu wenig Kapital
      - OHG, KG (Komplementär), Einzelunternehmen: unbeschränkte Haftung
      - eG: ggf. Nachschusspflicht

  - typ: anwendung
    folien: [46]
    deckt: [f46.finanzierung]
    frage: |-
      Ein Unternehmen will **viel Eigenkapital von vielen Anlegern über die Börse** einwerben; das Startkapital beträgt **80.000 €**. Welche Rechtsform mit den besten Finanzierungsmöglichkeiten laut Tabelle kann es mit diesem Startkapital gründen?
    antwort: |-
      **AG** – „hervorragend“: kleine EK-Anteile, Handel an Börse, Kapitalmarktzugang für FF; Mindesteigenkapital 50.000 € ✓.
      (SE: Finanzierung „wie AG“, aber Mindesteigenkapital 120.000 € > 80.000 €.)

  - typ: anwendung
    folien: [43, 45]
    deckt: [f45.haftung, f43.personen]
    frage: |-
      Eine Gründerin will **allein** gründen und allein entscheiden, hat **kein Startkapital** und nimmt in Kauf, notfalls auch **privat zu haften**. Welche Rechtsform?
    antwort: |-
      **Einzelunternehmen** – eine Person, Leitung beim Eigentümer, kein Mindesteigenkapital, Haftung uneingeschränkt mit Betriebs- und Privatvermögen.

  - typ: anwendung
    folien: [45]
    deckt: [f45.haftung, f45.finanzierung]
    frage: |-
      Ein Investor will einer Personengesellschaft **Kapital geben**, aber **nur eingeschränkt haften** und **nicht mitleiten**. Welche Rechtsform laut Tabelle der Personengesellschaften – und welche Rolle?
    antwort: |-
      **KG** als **Kommanditist** (Teilhafter): eingeschränkte Haftung, keine Leitung, beschränkte Kontrollrechte. Genau deshalb finanziert sich die KG besser als EU und OHG.

  - typ: anwendung
    folien: [45]
    deckt: [f45.haftung, f45.leitung]
    frage: |-
      Zwei Partner wollen **gemeinsam führen**, haften beide **voll**, haben **kein Mindestkapital** und wollen **keine Publizitätspflicht**. Welche Rechtsform laut Tabelle der Personengesellschaften?
    antwort: |-
      **OHG** – Leitung durch alle oder einzelne Gesellschafter (§ 114), uneingeschränkte Haftung aller Gesellschafter als Gesamtschuldner (§ 128), kein Mindesteigenkapital, Publizität nicht erforderlich (außer Großunternehmen).

  - typ: anwendung
    folien: [46]
    deckt: [f46.finanzierung, f46.haftung]
    frage: |-
      Viele Landwirte wollen sich mit **kleinen Anteilen** zusammenschließen; Mitglieder sollen **ein- und austreten** können, und es gibt **kein Mindestkapital**. Welche Rechtsform?
    antwort: |-
      **Genossenschaft (eG)** – kleine Stückelung, Austrittsrecht (Nachteil: schwankende EK-Basis), keine Vorschrift zum Mindesteigenkapital; Mitglieder haften eingeschränkt, ggf. Nachschusspflicht.

  # ---------------------------------------------------------------- Ziele F. 47–50
  - typ: skizze
    folien: [47]
    deckt: [f47.skizze, f47.formal, f47.sach]
    frage: |-
      Skizziere die **Pyramide der Unternehmensziele** (Ebenen, Rangfolge, Merkmale je Ebene).
    antwort: |-
      {{bild:kap2_zielpyramide|Zielpyramide}}

      - Spitze: **1. Formalziele (Erfolgsziele)** – übergeordnet; richten sich am unmittelbaren Erfolg aus; Ausgangspunkt ökonomisches Prinzip; Gewinn, Produktivität, Wirtschaftlichkeit, Rentabilität
      - Basis: **2. Sachziele** – richten sich an den Formalzielen aus; konkretes Handeln in den Funktionen; tragen zur Steuerung des Unternehmens bei

  - typ: maske
    folien: [47]
    deckt: [f47.formal]
    frage: |-
      Was kennzeichnet **Formalziele (Erfolgsziele)**? (vier Punkte – verdeckt)

      {{bild:kap2_zielpyramide-ohne-formalziele-merkmale|Zielpyramide, Merkmale der Formalziele verdeckt}}
    antwort: |-
      - „Stellen übergeordnete Ziele dar, an denen sich Unternehmen ausrichten“
      - „Richten sich am unmittelbaren Erfolg der betrieblichen Tätigkeit aus“
      - „Ausgangspunkt ist stets das ökonomische Prinzip“
      - „Klassische Formalziele: Gewinn, Produktivität, Wirtschaftlichkeit, Rentabilität“

