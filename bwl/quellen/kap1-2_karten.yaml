      - Bergbau und Gewinnung von Steinen und Erden
      - **Verarbeitendes Gewerbe**
      - Energie- und Wasserversorgung
      - Baugewerbe

  - typ: anwendung
    folien: [39]
    deckt: [f39.zuordnung]
    frage: |-
      Zu welchem **Bereich** und welchem **Wirtschaftszweig** gehört: Ein **Werkzeugmaschinenhersteller**.
    antwort: |-
      **Produzierendes Gewerbe** – verarbeitendes Gewerbe.

  - typ: anwendung
    folien: [39]
    deckt: [f39.zuordnung]
    frage: |-
      Zu welchem **Bereich** und welchem **Wirtschaftszweig** gehört: Eine **Sparkasse**.
    antwort: |-
      **Dienstleistungsbereich** – Kredit- und Versicherungsgewerbe.

      *Falle: Banken (und Handel) nicht zum produzierenden Gewerbe zählen.*

  - typ: anwendung
    folien: [39]
    deckt: [f39.zuordnung]
    frage: |-
      Zu welchem **Bereich** und welchem **Wirtschaftszweig** gehört: Ein **Autohaus mit Werkstatt**.
    antwort: |-
      **Dienstleistungsbereich** – Handel; Instandhaltung und Reparatur von Kraftfahrzeugen und Gebrauchsgütern.

  - typ: anwendung
    folien: [39]
    deckt: [f39.zuordnung]
    frage: |-
      Zu welchem **Bereich** und welchem **Wirtschaftszweig** gehört: **Stadtwerke**, die Strom und Wasser liefern.
    antwort: |-
      **Produzierendes Gewerbe** – Energie- und Wasserversorgung.

  - typ: aufzaehlung
    folien: [40]
    deckt: [f40.arten]
    frage: |-
      Welche vier **Größenklassen** von Unternehmen unterscheidet das Skript?
    antwort: |-
      Kleinstunternehmen · kleine · mittlere · große Unternehmen

  - typ: aufzaehlung
    folien: [40]
    deckt: [f40.massstaebe]
    frage: |-
      Nenne die drei **Größenmaßstäbe** für die Einteilung nach Größe.
    antwort: |-
      **Bilanzsumme** · **Umsatzerlöse** · **Beschäftigtenzahl**

  - typ: klausurfrage
    w: W10
    folien: [41]
    deckt: [f41.zweck, f41.kleinst, f41.klein, f41.mittel, f41.gross, f41.logik]
    frage: |-
      **Wiederholungsfrage:** Was versteht man unter kleinen und mittleren Unternehmen? (Umsatz, Anzahl Mitarbeiter)
    antwort: |-
      Quantitative Abgrenzung der **Europäischen Union** (für Förderprogramme):

      | | Beschäftigte | | Umsatz | | Bilanzsumme |
      |---|---|---|---|---|---|
      | Kleinst | < 10 | und | bis 2 Mio. € | oder | bis 2 Mio. € |
      | Klein | 10–49 | und | bis 10 Mio. € | oder | bis 10 Mio. € |
      | Mittel | 50–249 | und | bis 50 Mio. € | oder | bis **43** Mio. € |
      | Groß | > 249 | und | > 50 Mio. € | oder | > 43 Mio. € |

      Lesart: Beschäftigte **und** (Umsatz **oder** Bilanzsumme) – *abgeleitet (Lernzettel), die Folie schreibt nur „und … oder“ ohne Klammern.*

      {{bild:kap2_kmu-abgrenzung|KMU-Abgrenzung der EU}}

  - typ: fakt
    folien: [41]
    deckt: [f41.kleinst]
    frage: |-
      EU-Grenzwerte für **Kleinstunternehmen**?
    antwort: |-
      **< 10** Beschäftigte **und** Umsatz **bis 2 Mio. €** **oder** Bilanzsumme **bis 2 Mio. €**

  - typ: fakt
    folien: [41]
    deckt: [f41.klein]
    frage: |-
      EU-Grenzwerte für **kleine Unternehmen**?
    antwort: |-
      **10–49** Beschäftigte **und** Umsatz **bis 10 Mio. €** **oder** Bilanzsumme **bis 10 Mio. €**

  - typ: fakt
    folien: [41]
    deckt: [f41.mittel]
    frage: |-
      EU-Grenzwerte für **mittlere Unternehmen**?
    antwort: |-
      **50–249** Beschäftigte **und** Umsatz **bis 50 Mio. €** **oder** Bilanzsumme **bis 43 Mio. €**

  - typ: fakt
    folien: [41]
    deckt: [f41.gross]
    frage: |-
      Welche Werte stehen auf der Folie für **Großunternehmen**?
    antwort: |-
      **> 249** Beschäftigte **und** Umsatz **> 50 Mio. €** **oder** Bilanzsumme **> 43 Mio. €**

      (Logisch ungenau – siehe Unstimmigkeits-Karte zu F. 41.)

  - typ: verwechslung
    folien: [41]
    deckt: [f41.mittel]
    frage: |-
      Mittlere Unternehmen: Ist die Bilanzsummen-Grenze **50** oder **43** Mio. €?
    antwort: |-
      **43 Mio. €** (Bilanzsumme). 50 Mio. € ist die **Umsatz**grenze.

  - typ: falle
    folien: [41]
    deckt: [f41.logik]
    frage: |-
      Wie sind Beschäftigte, Umsatz und Bilanzsumme in der KMU-Abgrenzung verknüpft?
    antwort: |-
      **Beschäftigte UND (Umsatz ODER Bilanzsumme).**
      Die Beschäftigtenzahl muss immer passen; von den beiden Geldgrenzen **genügt eine**.

      *Lesart laut Lernzettel – die Folie schreibt nur „und … oder“ ohne Klammern. Falle: verlangen, dass Umsatz und Bilanzsumme beide unter der Grenze liegen.*

  - typ: fakt
    folien: [41]
    deckt: [f41.zweck]
    frage: |-
      Wer grenzt kleine und mittlere Unternehmen **quantitativ** ab – und wofür wird die Abgrenzung genutzt?
    antwort: |-
      Die **Europäische Union** – für **Förderprogramme**.

  - typ: maske
    folien: [41]
    deckt: [f41.kleinst, f41.klein, f41.mittel, f41.gross]
    frage: |-
      KMU-Abgrenzung: Welche **Beschäftigtenzahlen** sind verdeckt?

      {{bild:kap2_kmu-abgrenzung-ohne-beschaeftigte|KMU-Tabelle, Beschäftigte verdeckt}}
    antwort: |-
      Kleinst **< 10** · Klein **10–49** · Mittel **50–249** · Groß **> 249**

      {{bild:kap2_kmu-abgrenzung|KMU-Abgrenzung}}

  - typ: maske
    folien: [41]
    deckt: [f41.kleinst, f41.klein, f41.mittel, f41.gross]
    frage: |-
      KMU-Abgrenzung: Welche **Umsatz-** und **Bilanzsummen-Grenzen** sind verdeckt?

      {{bild:kap2_kmu-abgrenzung-ohne-geldgrenzen|KMU-Tabelle, Umsatz und Bilanzsumme verdeckt}}
    antwort: |-
      | | Umsatz | Bilanzsumme |
      |---|---|---|
      | Kleinst | bis 2 Mio. € | bis 2 Mio. € |
      | Klein | bis 10 Mio. € | bis 10 Mio. € |
      | Mittel | bis 50 Mio. € | bis **43** Mio. € |
      | Groß | > 50 Mio. € | > 43 Mio. € |

      {{bild:kap2_kmu-abgrenzung|KMU-Abgrenzung}}

  - typ: anwendung
    folien: [41]
    deckt: [f41.kleinst, f41.logik]
    rechnung: {art: kmu, beschaeftigte: 9, umsatz: 2.5, bilanzsumme: 1.8, ergebnis: "Kleinstunternehmen"}
    frage: |-
      Größenklasse nach EU? **9 Beschäftigte**, Umsatz **2,5 Mio. €**, Bilanzsumme **1,8 Mio. €**.
    antwort: |-
      **Kleinstunternehmen**: 9 < 10 ✓ und Bilanzsumme 1,8 ≤ 2 Mio. € ✓ – dass der Umsatz über 2 Mio. € liegt, schadet nicht (eine Geldgrenze genügt).

  - typ: anwendung
    folien: [41]
    deckt: [f41.klein, f41.logik]
    rechnung: {art: kmu, beschaeftigte: 10, umsatz: 1.2, bilanzsumme: 0.9, ergebnis: "kleines Unternehmen"}
    frage: |-
      Größenklasse nach EU? **10 Beschäftigte**, Umsatz **1,2 Mio. €**, Bilanzsumme **0,9 Mio. €**.
    antwort: |-
      **kleines Unternehmen**: Kleinst verlangt **< 10** Beschäftigte – 10 gehört schon zu 10–49 ✓; Umsatz ≤ 10 Mio. € ✓.

  - typ: anwendung
    folien: [41]
    deckt: [f41.klein, f41.logik]
    rechnung: {art: kmu, beschaeftigte: 8, umsatz: 3, bilanzsumme: 2.5, ergebnis: "kleines Unternehmen"}
    frage: |-
      Größenklasse nach EU? **8 Beschäftigte**, Umsatz **3 Mio. €**, Bilanzsumme **2,5 Mio. €**.
    antwort: |-
      **kleines Unternehmen**: 8 < 10 ✓, aber Umsatz **und** Bilanzsumme > 2 Mio. € ✗ → kein Kleinstunternehmen.
      Wörtlich passt 8 in keine Folienzeile (klein = 10–49). *Lesart abgeleitet, nicht in Skript oder Lernzettel:* Beschäftigtenspannen als Obergrenzen lesen (klein = unter 50) → 8 < 50 ✓ und Umsatz 3 ≤ 10 Mio. € ✓ → klein.

  - typ: anwendung
    folien: [41]
    deckt: [f41.klein, f41.logik]
    rechnung: {art: kmu, beschaeftigte: 49, umsatz: 11, bilanzsumme: 9.5, ergebnis: "kleines Unternehmen"}
    frage: |-
      Größenklasse nach EU? **49 Beschäftigte**, Umsatz **11 Mio. €**, Bilanzsumme **9,5 Mio. €**.
    antwort: |-
      **kleines Unternehmen**: 49 in 10–49 ✓; Umsatz > 10 Mio. € ✗, aber Bilanzsumme 9,5 ≤ 10 Mio. € ✓ – eine Geldgrenze genügt.

  - typ: anwendung
    folien: [41]
    deckt: [f41.mittel, f41.logik]
    rechnung: {art: kmu, beschaeftigte: 230, umsatz: 48, bilanzsumme: 51, ergebnis: "mittleres Unternehmen"}
    frage: |-
      Größenklasse nach EU? **230 Beschäftigte**, Umsatz **48 Mio. €**, Bilanzsumme **51 Mio. €**.
    antwort: |-
      **mittleres Unternehmen**: 230 in 50–249 ✓ und Umsatz 48 ≤ 50 Mio. € ✓ (Bilanzsumme > 43 Mio. € ist egal).

  - typ: anwendung
    folien: [41]
    deckt: [f41.gross, f41.logik]
    rechnung: {art: kmu, beschaeftigte: 400, umsatz: 30, bilanzsumme: 25, ergebnis: "Großunternehmen"}
    frage: |-
      Größenklasse nach EU? **400 Beschäftigte**, Umsatz **30 Mio. €**, Bilanzsumme **25 Mio. €**.
    antwort: |-
      **Großunternehmen**: 400 > 249 – die Beschäftigtenzahl passt in keine KMU-Zeile, egal wie klein Umsatz und Bilanzsumme sind.
      Die Folienzeile „Großunternehmen > 249 und > 50 Mio. € oder > 43 Mio. €“ passt wörtlich nicht (30 und 25 Mio. € liegen darunter) – maßgeblich ist, dass keine KMU-Zeile passt (siehe Unstimmigkeit F. 41).

  - typ: anwendung
    folien: [41]
    deckt: [f41.gross, f41.unst]
    rechnung: {art: kmu, beschaeftigte: 140, umsatz: 70, bilanzsumme: 60, ergebnis: "Großunternehmen"}
    frage: |-
      Größenklasse nach EU? **140 Beschäftigte**, Umsatz **70 Mio. €**, Bilanzsumme **60 Mio. €**.
    antwort: |-
      **Großunternehmen** (kein KMU): 140 in 50–249 ✓, aber Umsatz > 50 **und** Bilanzsumme > 43 Mio. € ✗ → die Zeile „mittel“ passt nicht.
      Die Folienzeile „Großunternehmen > 249 und …“ passt wörtlich auch nicht. Vorgehen: erst die KMU-Zeilen prüfen – passt keine, ist es groß (Lernzettel). *Eigene Ergänzung, nicht in Skript oder Lernzettel:* von Kleinst aufwärts prüfen und die Beschäftigtenspannen als Obergrenzen lesen (klein = unter 50, mittel = unter 250).

  - typ: unstimmigkeit
    folien: [41]
    deckt: [f41.unst]
    frage: |-
      Was ist an der Zeile **„Großunternehmen: > 249 und > 50 Mio. € oder > 43 Mio. €“** logisch ungenau – und wie gehst du in der Klausur vor?
    antwort: |-
      Die Zeile übernimmt einfach das Muster „und … oder“. Groß ist aber, wer die KMU-Bedingung **verletzt**:
      **> 249 Beschäftigte ODER (Umsatz > 50 Mio. € UND Bilanzsumme > 43 Mio. €).**
      Beispiel: 300 Beschäftigte, 20 Mio. € Umsatz, 15 Mio. € Bilanzsumme passen in keine Folienzeile, sind aber groß.

      **Klausur:** Tabelle wie auf der Folie wiedergeben. Beim Einordnen erst die KMU-Zeilen prüfen – passt keine, ist es ein Großunternehmen (Lernzettel). *Eigene Ergänzung:* von Kleinst aufwärts prüfen, Beschäftigtenspannen als Obergrenzen lesen (klein = unter 50, mittel = unter 250).

  - typ: fakt
    folien: [41]
    deckt: [f41.mittelstand]
    frage: |-
      Sind kleine und mittlere Unternehmen auch mittelständisch?
    antwort: |-
      „Kleine und mittlere Unternehmen sind auch überwiegend mittelständisch!“ – überwiegend, nicht automatisch; die Begriffe meinen Verschiedenes (siehe F. 42).

  - typ: klausurfrage
    w: W11
    folien: [42]
    deckt: [f42.kriterien, f42.gross]
    frage: |-
      **Wiederholungsfrage:** Wodurch sind mittelständische Unternehmen gekennzeichnet?
    antwort: |-
      Qualitative Abgrenzung – Kriterien:
      - „Einheit von Eigentum, Haftung und Führung“
      - „Konzernunabhängigkeit des Unternehmens“
      - „weitgehende Verantwortlichkeit des Unternehmers für unternehmensrelevante Entscheidungen“

      Mittelständische Unternehmen können auch **groß** sein (> 500 MA, > 100 Mio. € Umsatz), z. B. Krone Group, Miele & Cie. KG, TRUMPF GmbH + Co. KG.

  - typ: luecke
    folien: [42]
    deckt: [f42.kriterien]
    frage: |-
      Mittelstand – qualitative Kriterien: **?** · Konzernunabhängigkeit des Unternehmens · weitgehende Verantwortlichkeit des Unternehmers für unternehmensrelevante Entscheidungen
    antwort: |-
      **Einheit von Eigentum, Haftung und Führung**

  - typ: luecke
    folien: [42]
    deckt: [f42.kriterien]
    frage: |-
      Mittelstand – qualitative Kriterien: Einheit von Eigentum, Haftung und Führung · **?** · weitgehende Verantwortlichkeit des Unternehmers für unternehmensrelevante Entscheidungen
    antwort: |-
      **Konzernunabhängigkeit des Unternehmens**

  - typ: luecke
    folien: [42]
    deckt: [f42.kriterien]
    frage: |-
      Mittelstand – qualitative Kriterien: Einheit von Eigentum, Haftung und Führung · Konzernunabhängigkeit des Unternehmens · **?**
    antwort: |-
      **Weitgehende Verantwortlichkeit des Unternehmers für unternehmensrelevante Entscheidungen**

  - typ: rueckwaerts
    folien: [42]
    deckt: [f42.kriterien]
    frage: |-
      Welche Unternehmen sind durch **Einheit von Eigentum, Haftung und Führung** und **Konzernunabhängigkeit** gekennzeichnet?
    antwort: |-
      **Mittelständische Unternehmen** (qualitative Abgrenzung).

  - typ: verwechslung
    folien: [41, 42]
    deckt: [f42.unterschied]
    frage: |-
      Was ist der Unterschied zwischen **kleinen/mittleren** und **mittelständischen** Unternehmen?
    antwort: |-
      | KMU | mittelständisch |
      |---|---|
      | **quantitativ** (Beschäftigte, Umsatz, Bilanzsumme) | **qualitativ** (Eigentum, Haftung, Führung in einer Hand; konzernunabhängig) |
      | EU-Abgrenzung, Förderprogramme | Kriterien F. 42 |
      | höchstens 249 Beschäftigte | kann auch **groß** sein |

  - typ: fakt
    folien: [42]
    deckt: [f42.gross]
    frage: |-
      Mit welchen Richtwerten zeigt das Skript, dass auch **mittelständische** Unternehmen groß sein können?
    antwort: |-
      **> 500 MA, > 100 Mio. € Umsatz** („Aber: mittelständische Unternehmen können auch groß sein!“)

  - typ: aufzaehlung
    folien: [42]
    deckt: [f42.gross]
    frage: |-
      Nenne die drei Beispiele des Skripts für **große mittelständische** Unternehmen.
    antwort: |-
      - Krone Group (ca. 6.500 MA, ca. 2,4 Mrd. € Umsatz)
      - Miele & Cie. KG (ca. 23.500 MA, ca. 5,0 Mrd. €)
      - TRUMPF GmbH + Co. KG (ca. 19.000 MA, ca. 5,2 Mrd. €)

  - typ: unstimmigkeit
    folien: [41, 42]
    deckt: [f42.unst]
    frage: |-
      F. 42 nennt für „groß“ **> 500 MA und > 100 Mio. € Umsatz**, F. 41 aber **> 249 und > 50 Mio. €**. Welche Werte gelten in der Klausur?
    antwort: |-
      Für **KMU/Größenklassen** immer die **EU-Werte von F. 41**.
      F. 42 will nur zeigen, dass Mittelständler weit über den EU-Grenzen liegen können – die Zahlen dort sind keine zweite Größendefinition.

  - typ: anwendung
    folien: [41, 42]
    deckt: [f42.unterschied]
    frage: |-
      Ein Werk mit **120 Beschäftigten** und **20 Mio. € Umsatz** ist die Tochter eines Konzerns und wird von einem angestellten Manager geführt. KMU? Mittelständisch?
    antwort: |-
      - **KMU: ja** – mittleres Unternehmen (50–249 Beschäftigte, Umsatz ≤ 50 Mio. €).
      - **Mittelständisch: nein** – nicht konzernunabhängig, keine Einheit von Eigentum, Haftung und Führung.

  - typ: anwendung
    folien: [41, 42]
    deckt: [f42.unterschied, f42.gross]
    frage: |-
      **Miele & Cie. KG** (ca. 23.500 MA, ca. 5,0 Mrd. € Umsatz): KMU? Mittelständisch?
    antwort: |-
      - **KMU: nein** – weit über 249 Beschäftigten → Großunternehmen.
      - **Mittelständisch: ja** – Beispiel des Skripts für ein großes mittelständisches Unternehmen.

  - typ: aufzaehlung
    folien: [43]
    deckt: [f43.gruppen]
    frage: |-
      In welche **vier Gruppen** teilt das Skript die Rechtsformen privater Betriebe ein?
    antwort: |-
      1. Einzelunternehmen
      2. Personengesellschaften
      3. Kapitalgesellschaften
      4. Genossenschaften (eG)

  - typ: aufzaehlung
    folien: [43]
    deckt: [f43.gruppen]
    frage: |-
      Welche **Personengesellschaften** nennt das Skript?
    antwort: |-
      - Gesellschaft bürgerlichen Rechts (**GbR**)
      - Offene Handelsgesellschaft (**OHG**)
      - Kommanditgesellschaft (**KG**)
      - Stille Gesellschaft

  - typ: aufzaehlung
    folien: [43]
    deckt: [f43.gruppen]
    frage: |-
      Welche **Kapitalgesellschaften** nennt das Skript?
    antwort: |-
      - Aktiengesellschaft (**AG**)
      - Europäische Gesellschaft (**SE**)
      - Kommanditgesellschaft auf Aktien (**KGaA**)
      - Gesellschaft mit beschränkter Haftung (**GmbH**)

  - typ: fakt
    folien: [43]
    deckt: [f43.personen]
    frage: |-
      Wie viele Personen braucht ein **Einzelunternehmen**, wie viele eine **Personengesellschaft** mindestens?
    antwort: |-
      - Einzelunternehmen: **eine Person** als Einzelunternehmer
      - Personengesellschaft: **min. zwei Personen** (natürliche und/oder juristische Person)

  - typ: definition
    folien: [43]
    deckt: [f43.juristisch]
    frage: |-
      Welche Rechtsformen sind **juristische Personen** – und was bedeutet das?
    antwort: |-
      **Kapitalgesellschaften und Genossenschaften**: „Sind juristische Personen, d.h. sie sind selbst Träger von Rechten und Pflichten“

  - typ: falle
    folien: [43]
    deckt: [f43.juristisch]
    frage: |-
      Richtig oder falsch: „Die OHG ist eine juristische Person.“
    antwort: |-
      **Falsch.** Nur **Kapitalgesellschaften und Genossenschaften** sind juristische Personen (selbst Träger von Rechten und Pflichten). Die OHG ist eine Personengesellschaft.

  - typ: definition
    folien: [44]
    deckt: [f44.gegenstand]
    frage: |-
      Was ist **Gegenstand der Wahl der Rechtsform**? (Innen- und Außenverhältnis)
    antwort: |-
      „die Regelung der Rechtsbeziehungen zwischen den Gesellschaftern eines Unternehmens (Innenverhältnis) und den Rechtsbeziehungen zwischen dem Unternehmen und seinen externen Stakeholdern (Außenverhältnis)“

  - typ: fakt
    folien: [44]
    deckt: [f44.strategisch]
    frage: |-
      Woran orientiert sich die Wahl der Rechtsform?
    antwort: |-
      An den **Zielen eines Unternehmens**.

  - typ: fakt
    folien: [44]
    deckt: [f44.strategisch]
    frage: |-
      Welche Art von Entscheidung ist die Wahl der Rechtsform?
    antwort: |-
      Eine **strategisch relevante Entscheidung**.

  - typ: aufzaehlung
    folien: [44]
    deckt: [f44.kriterien]
    frage: |-
      Nenne die **sechs Auswahlkriterien** für die Rechtsformwahl.
    antwort: |-
      1. Leitungs- und Kontrollbefugnis
      2. Haftungsumfang der Eigenkapitalgeber
      3. Gewinn-/Verlustbeteiligung
      4. Finanzierungsmöglichkeiten
      5. Publizität und Prüfung
      6. Mitbestimmung der Arbeitnehmer

