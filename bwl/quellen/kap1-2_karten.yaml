    antwort: |-
      | Kriterium | Beispiele |
      |---|---|
      | **Branche / Wirtschaftszweig** | Industrie, Handel, Verkehr, Banken |
      | **Größe** | kleine, mittlere, große Unternehmen |
      | **Rechtsform** | GbR, OHG, KG, GmbH, AG, SE, Ltd, eG |

  - typ: luecke
    folien: [38]
    deckt: [f38.kriterien]
    frage: |-
      Typologie-Kriterium **Branche / Wirtschaftszweig**: Welche vier Beispiele nennt das Skript?
    antwort: |-
      Industrie, Handel, Verkehr, Banken

  - typ: rueckwaerts
    folien: [38]
