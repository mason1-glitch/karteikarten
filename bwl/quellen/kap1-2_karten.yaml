    frage: |-
      **Wiederholungsfrage:** Was ist wirtschaften?
    antwort: |-
      **Definition:** „Wirtschaften ist der von Wirtschaftseinheiten gezielt und wirtschaftlich durchgeführte Einsatz knapper Mittel zum Zwecke der Bedürfnisbefriedigung“

      **Kurz:** Wirtschaften bedeutet, anhand von Zielen Entscheidungen über knappe Ressourcen zu treffen.

      **Warum nötig:** Die vorhandenen Güter reichen nie zur Deckung aller Bedarfe aus (knappe Güter) – Konflikt zwischen Knappheit und tendenziell unbegrenzten Bedürfnissen.

