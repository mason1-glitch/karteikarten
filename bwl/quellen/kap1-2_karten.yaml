  # ---------------------------------------------------------------- Rechenkarten (neue Zahlen)
  - typ: rechnen
    folien: [7]
    deckt: [f07.effizienz]
    rechnung:
      - {art: effizienz, erfolg: 65000, aufwand: 50000, ergebnis: "1,3"}
      - {art: effizienz, erfolg: 96000, aufwand: 80000, ergebnis: "1,2"}
    frage: |-
      Effizienz zweier Vorrichtungen: **A** – Aufwand 50.000 €, Erfolg 65.000 €; **B** – Aufwand 80.000 €, Erfolg 96.000 €. Welche ist effizienter, welche bringt mehr absoluten Erfolg?
    antwort: |-
      Effizienz = Erfolg / Aufwand
      - A: 65.000 € / 50.000 € = **1,3**
      - B: 96.000 € / 80.000 € = **1,2**

      **A ist effizienter**; **B** bringt den größeren absoluten Erfolg (96.000 € > 65.000 €).

  - typ: rechnen
    folien: [48]
    deckt: [f48.produktivitaet]
    rechnung: {art: produktivitaet, output: 2400, input: 600, ergebnis: "4 Gehäuse je Maschinenstunde"}
    frage: |-
      Eine Fräserei fertigt **2.400 Gehäuse in 600 Maschinenstunden**. Produktivität?
    antwort: |-
      Produktivität = Output / Input = 2.400 Gehäuse / 600 h = **4 Gehäuse je Maschinenstunde**

  - typ: rechnen
    folien: [48]
    deckt: [f48.produktivitaet]
    rechnung: {art: aenderung_prozent, alt: 3.2, neu: 4, ergebnis: "25 %"}
    frage: |-
