  - typ: fakt
    folien: [45]
    deckt: [f45.haftung]
    frage: |-
      Haftung in der **KG**?
    antwort: |-
      **Uneingeschränkt für Komplementäre; eingeschränkt für Kommanditisten.**

  - typ: verwechslung
    folien: [45]
    deckt: [f45.haftung, f45.leitung]
    frage: |-
      KG: **Komplementär** vs. **Kommanditist** – Leitung, Kontrolle, Haftung?
    antwort: |-
      | | Komplementär | Kommanditist |
      |---|---|---|
      | Leitung | ja (§ 164) | nein |
      | Kontrolle | volle Kontrollrechte | beschränkte (§ 166) |
      | Haftung | uneingeschränkt (Vollhafter) | eingeschränkt (Teilhafter) |

  - typ: falle
    folien: [45]
    deckt: [f45.haftung]
    frage: |-
      Richtig oder falsch: „In der KG haften alle Gesellschafter uneingeschränkt.“
    antwort: |-
      **Falsch.** Nur die **Komplementäre** haften uneingeschränkt; **Kommanditisten** haften eingeschränkt. (Alle uneingeschränkt: OHG.)

  - typ: fakt
    folien: [45]
    deckt: [f45.leitung]
    frage: |-
      **OHG**: Wer hat die Leitungsrechte, wer die Kontrollrechte?
    antwort: |-
      - Leitung: **alle oder ein(-zelne) Gesellschafter** (§ 114)
      - Kontrolle: **alle Gesellschafter** (§ 118)

  - typ: fakt
    folien: [45]
    deckt: [f45.leitung]
    frage: |-
      **Einzelunternehmen**: Wer leitet, wer kontrolliert, wer bekommt Gewinn und Verlust?
    antwort: |-
      In allen drei Fällen der **Eigentümer**.

  - typ: fakt
    folien: [45]
    deckt: [f45.kapital]
    frage: |-
