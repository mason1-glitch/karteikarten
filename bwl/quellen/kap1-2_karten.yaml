    antwort: |-
      1. Strukturen und Prozesse einzelner Betriebe **untersuchen**
      2. dabei **Regel- und Gesetzmäßigkeiten** erkennen
      3. **Empfehlungen** für zielorientierte, wirtschaftliche Verhaltensweisen ableiten

      *Deutung (Lernzettel): untersuchen = beschreibend, Empfehlungen ableiten = entscheidungsorientiert.*

  - typ: verwechslung
