    antwort: |-
      „Betriebswirtschaftslehre ist eine beschreibende und entscheidungsorientierte Teildisziplin der Wirtschaftswissenschaften, die – in Umkehrung zur Volkswirtschaftslehre“
      - „die Strukturen und Prozesse einzelner Betriebe … untersucht“
      - „und aufgrund der dabei erkannten Regel- und Gesetzmäßigkeiten“
      - „Empfehlungen für zielorientierte, wirtschaftliche Verhaltensweisen ableitet.“

  - typ: rueckwaerts
    folien: [18]
    deckt: [f18.def]
    frage: |-
      Welche Disziplin ist gemeint? „… eine beschreibende und entscheidungsorientierte Teildisziplin der Wirtschaftswissenschaften, die – in Umkehrung zur [ ? ] – die Strukturen und Prozesse einzelner [ ? ] … untersucht …“
    antwort: |-
      **Betriebswirtschaftslehre** (BWL) – in Umkehrung zur **Volkswirtschaftslehre**; untersucht einzelne **Betriebe**.

  - typ: fakt
    folien: [18]
    deckt: [f18.def]
    frage: |-
