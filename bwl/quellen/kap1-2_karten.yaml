# Karteikarten BWL Kapitel 1 (Einleitung) und 2 (Grundlagen)
# Quelle: Vorlesungsskript „Grundlagen der Betriebswirtschaft für Ingenieure“ (Frenzel/Haats/Poll), WiSe 2026/27,
# Folien 6–51; Klausurfallen und Unstimmigkeiten zusätzlich aus Lernzettel_BWL_Kap1-2.
# Bauen:   python3 werkzeuge/karten.py bauen bwl/quellen/kap1-2_karten.yaml
# Prüfen:  python3 werkzeuge/karten.py pruefen bwl/quellen/kap1-2_karten.yaml --skript <pdf> --urls
fach: bwl
csv: bwl/karten/kap1-2_einleitung-grundlagen.csv
matrix: bwl/quellen/kap1-2_abdeckung.md
titel: "BWL Kapitel 1–2: Einleitung und Grundlagen"
ocr_folien: [36, 41, 44, 45, 46, 48, 49]

annahmen:
  - "Klausur laut F. 2: 90 Minuten, ohne Hilfsmittel, nur Taschenrechner – deshalb Wortlaut-, Skizzen- und Rechenkarten."
  - "Planspiel-Folien (F. 12–13) gelten als Kontext für das Planspiel, nicht als Klausurstoff."
  - "Rechenkarten setzen wie der Lernzettel Erlöse = Ertrag und Kosten = Aufwand; die genaue Abgrenzung folgt in Kap. 6."
  - "Ø Kapital = (Anfangs- + Endbestand) / 2 steht nicht im Skript; die einzige Karte, die es nutzt, ist als Ergänzung markiert."
  - "Lange Aufzählungen (6 Punkte) werden in Lückenkarten mit je zwei fehlenden Punkten zerlegt, kurze (bis 4) mit je einem."

ausgelassen:
  - {folien: "1–5", grund: "Titel, Organisatorisches, Terminplan, Fahrplan, Literatur"}
  - {folien: "10", grund: "Lernziele der Lehrveranstaltung (kein prüfbarer Fachinhalt)"}
  - {folien: "12–13", grund: "Planspiel Factory: Ausgangslage und Spielbrett (Annahme: nicht klausurrelevant)"}
  - {folien: "14–16, 23–24, 26, 32, 37", grund: "Ablaufplan, Kapiteltitel und Gliederung"}
  - {folien: "17, 25", grund: "identisch mit F. 11 (Bezugsrahmen) – dort abgedeckt"}
  - {folien: "22, 51", grund: "Wiederholungsfragen – als eigene Musterantwort-Karten abgedeckt"}

inhalte:
