  # ---------------------------------------------------------------- Rechtsformen-Tabellen F. 45/46
  - typ: fakt
    folien: [45]
    deckt: [f45.haftung]
    frage: |-
      Haftung im **Einzelunternehmen**?
    antwort: |-
      **Uneingeschränkt** (mit Betriebs- **und Privatvermögen**).

  - typ: fakt
    folien: [45]
    deckt: [f45.haftung]
    frage: |-
      Haftung in der **OHG**?
    antwort: |-
