    antwort: |-
      Wirtschaftlichkeit = Ertrag / Aufwand = 4,2 Mio. € / 3,5 Mio. € = **1,2** (ohne Einheit)
      → Je 1 € Aufwand entstehen 1,20 € Ertrag.

  - typ: rechnen
    folien: [48]
    deckt: [f48.wirtschaftlichkeit]
    rechnung: {art: wirtschaftlichkeit, ertrag: 1.8, aufwand: 2.0, ergebnis: "0,9"}
    frage: |-
      Ertrag **1,8 Mio. €**, Aufwand **2,0 Mio. €**. Wirtschaftlichkeit – und was bedeutet das Ergebnis?
    antwort: |-
      1,8 / 2,0 = **0,9** → Der Aufwand ist größer als der Ertrag.

      *Ergänzung (abgeleitet, nicht im Skript): Ein Wert unter 1 heißt, der Betrieb arbeitet unwirtschaftlich.*

  - typ: rechnen
    folien: [48]
    deckt: [f48.gewinn]
    rechnung: {art: gewinn, erloese: 4.2, kosten: 3.5, ergebnis: "0,7 Mio. €"}
    frage: |-
      Erlöse **4,2 Mio. €**, Kosten **3,5 Mio. €**. Gewinn?
    antwort: |-
      Gewinn = Erlöse − Kosten = 4,2 Mio. € − 3,5 Mio. € = **0,7 Mio. €**

  - typ: rechnen
    folien: [48]
    deckt: [f48.gewinn]
    rechnung: {art: gewinn, erloese: 2.1, kosten: 2.4, ergebnis: "−0,3 Mio. €"}
    frage: |-
      Erlöse **2,1 Mio. €**, Kosten **2,4 Mio. €**. Gewinn?
    antwort: |-
      2,1 Mio. € − 2,4 Mio. € = **−0,3 Mio. €** → ein **Verlust** von 0,3 Mio. €.

  - typ: rechnen
    folien: [48]
    deckt: [f48.rentabilitaet]
    rechnung: {art: rentabilitaet, gewinn: 0.7, kapital: 5.0, ergebnis: "14 %"}
    frage: |-
      Gewinn **0,7 Mio. €**, durchschnittliches Kapital **5,0 Mio. €**. Rentabilität?
    antwort: |-
      Rentabilität = Gewinn / Ø Kapital = 0,7 / 5,0 = 0,14 = **14 %**

  - typ: rechnen
    folien: [48]
    deckt: [f48.rentabilitaet]
    rechnung:
      - {art: rentabilitaet, gewinn: 0.45, kapital_anfang: 2.8, kapital_ende: 3.2, ergebnis: "15 %"}
      - {art: rentabilitaet, gewinn: 0.45, kapital: 3.2, ergebnis: "14,1 %"}
    frage: |-
      Gewinn **0,45 Mio. €**; Kapital zu Jahresbeginn **2,8 Mio. €**, am Jahresende **3,2 Mio. €**. Rentabilität?
    antwort: |-
      Ø Kapital = (2,8 + 3,2) / 2 = 3,0 Mio. €
      Rentabilität = 0,45 / 3,0 = **15 %**

      *Falle:* mit dem Endkapital gerechnet wären es nur 14,1 % – laut Formel durch das **Ø Kapital** teilen.
      Ergänzung: Die Mittelwert-Formel für Ø Kapital steht nicht im Skript (Lernzettel).

  - typ: rechnen
    folien: [49]
    deckt: [f49.vergleiche]
    rechnung:
      - {art: prozentpunkte, alt: 10, neu: 12, ergebnis: "2 Prozentpunkte"}
      - {art: aenderung_prozent, alt: 10, neu: 12, ergebnis: "20 %"}
    frage: |-
      Die Rentabilität steigt von **10 %** auf **12 %**. Um wie viele **Prozentpunkte** und um wie viel **Prozent**?
    antwort: |-
      - 12 % − 10 % = **2 Prozentpunkte**
      - 2 / 10 = **20 %** mehr (relativ)

      *Falle:* „+2 %“ schreiben.
      *Ergänzung: Die Unterscheidung Prozentpunkte/Prozent steht nicht im Skript (Rechenhilfe für die Vergleiche auf F. 49).*

