      - als **Erfolgsgröße des ganzen Unternehmens** → Formalziel (F. 47/48)
      - als **konkrete Vorgabe für die Produktion** (z. B. Stück je Stunde in der Montage) → Sachziel (F. 50)

      Hinweis: „Effizienz“ (F. 7: Erfolg / Aufwand) steht auf F. 50 ebenfalls unter den Zielen der Produktion, ist auf F. 47/48 aber kein Formalziel.

  - typ: klausurfrage
    w: W13
    folien: [47, 50]
    deckt: [f47.formal, f47.sach, f50.beispiele]
    frage: |-
      **Wiederholungsfrage:** Welche zwei Zielkategorien unterscheidet man in der BWL grundsätzlich? Beschreiben Sie diese kurz und nennen Sie Beispiele.
    antwort: |-
      **1. Formalziele (Erfolgsziele)**
      - übergeordnete Ziele, an denen sich Unternehmen ausrichten
      - richten sich am unmittelbaren Erfolg der betrieblichen Tätigkeit aus
      - Ausgangspunkt ist stets das ökonomische Prinzip
      - Beispiele: **Gewinn, Produktivität, Wirtschaftlichkeit, Rentabilität**

      **2. Sachziele**
      - richten sich an den Formalzielen aus
      - beziehen sich auf das konkrete Handeln in den Funktionen
      - tragen zur Steuerung des Unternehmens bei
      - Beispiele: Umsatz, Bekanntheit (Marketing) · Prozesse vereinfachen, Kosten senken (Beschaffung) · Effizienz (Produktion) · neue Produkte (F&E)
