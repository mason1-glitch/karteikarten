      3. **Finanzielles Gleichgewicht / Liquidität**

  # =====================================================================  2.1 Prinzipien und Märkte
  - typ: fakt
    folien: [27]
    deckt: [f27.grundproblem]
    frage: |-
      Was ist das **Grundproblem der Wirtschaft**, und warum muss man deshalb wirtschaften?
    antwort: |-
      **Bedarfsdeckung:** Die vorhandenen Güter reichen **nie** zur Deckung aller Bedarfe aus – es sind knappe Güter. Daher muss man wirtschaften.

  - typ: definition
    folien: [27]
    deckt: [f27.def]
    frage: |-
      Definiere **Wirtschaften** (ausführliche Definition).
    antwort: |-
      „Wirtschaften ist der von Wirtschaftseinheiten gezielt und wirtschaftlich durchgeführte Einsatz knapper Mittel zum Zwecke der Bedürfnisbefriedigung“

  - typ: rueckwaerts
    folien: [27]
    deckt: [f27.def]
    frage: |-
      Welcher Begriff: der von Wirtschaftseinheiten gezielt und wirtschaftlich durchgeführte Einsatz knapper Mittel zum Zwecke der Bedürfnisbefriedigung?
    antwort: |-
      **Wirtschaften**

  - typ: luecke
    folien: [27]
    deckt: [f27.def]
    frage: |-
      Wirtschaften ist der **? (wer)** gezielt und wirtschaftlich durchgeführte Einsatz knapper Mittel zum Zwecke der Bedürfnisbefriedigung.
    antwort: |-
      **von Wirtschaftseinheiten**

  - typ: luecke
    folien: [27]
    deckt: [f27.def]
    frage: |-
      Wirtschaften ist der von Wirtschaftseinheiten **? (wie)** durchgeführte Einsatz knapper Mittel zum Zwecke der Bedürfnisbefriedigung.
    antwort: |-
      **gezielt und wirtschaftlich**

  - typ: luecke
    folien: [27]
    deckt: [f27.def]
    frage: |-
      Wirtschaften ist der von Wirtschaftseinheiten gezielt und wirtschaftlich durchgeführte **? (was)** zum Zwecke der Bedürfnisbefriedigung.
    antwort: |-
      **Einsatz knapper Mittel**

  - typ: luecke
    folien: [27]
    deckt: [f27.def]
    frage: |-
      Wirtschaften ist der von Wirtschaftseinheiten gezielt und wirtschaftlich durchgeführte Einsatz knapper Mittel **? (wozu)**.
    antwort: |-
      **zum Zwecke der Bedürfnisbefriedigung**

  - typ: definition
    folien: [27]
    deckt: [f27.kurz]
    frage: |-
      Wirtschaften „kurz und knapp“ – in einem Satz?
    antwort: |-
      „Wirtschaften bedeutet, anhand von Zielen Entscheidungen über knappe Ressourcen zu treffen“

  - typ: definition
    folien: [27]
    deckt: [f27.wirtschaft]
    frage: |-
      Was umfasst **Wirtschaft** (Definition auf der Folie „Grundproblem der Wirtschaft“)?
    antwort: |-
      „Wirtschaft umfasst alle Institutionen und Prozesse, die direkt oder indirekt der Befriedigung menschlicher Bedürfnisse nach knappen Gütern dienen“

  - typ: verwechslung
    folien: [27]
    deckt: [f27.def, f27.wirtschaft]
    frage: |-
      **Wirtschaften** vs. **Wirtschaft** – was ist was?
    antwort: |-
      | Begriff | bezeichnet |
      |---|---|
      | **Wirtschaften** | die Tätigkeit: Einsatz knapper Mittel zur Bedürfnisbefriedigung (Entscheidungen über knappe Ressourcen) |
      | **Wirtschaft** | alle Institutionen und Prozesse, die der Befriedigung menschlicher Bedürfnisse nach knappen Gütern dienen |

  - typ: fakt
    folien: [28]
    deckt: [f28.vernunft]
    frage: |-
      Welchem allgemeinen **Vernunftprinzip** unterliegen wirtschaftliche Entscheidungen?
    antwort: |-
      Dem **ökonomischen Prinzip** (Wirtschaftlichkeitsprinzip).

  - typ: definition
    folien: [28]
    deckt: [f28.def]
    frage: |-
      Was verlangt das **ökonomische Prinzip**?
    antwort: |-
      „Das ökonomische Prinzip (Wirtschaftlichkeitsprinzip) verlangt, das Verhältnis aus Produktionsergebnis (Output, Ertrag) und Produktionseinsatz (Input, Aufwand) zu optimieren.“

  - typ: verwechslung
    folien: [19, 28]
    deckt: [f28.def]
    frage: |-
      Sind ökonomisches Prinzip und Wirtschaftlichkeitsprinzip zwei verschiedene Prinzipien?
    antwort: |-
      **Nein – dasselbe.** F. 28 setzt beide gleich: „ökonomische Prinzip (Wirtschaftlichkeitsprinzip)“.
      F. 19 nennt das Wirtschaftlichkeitsprinzip als Kennzeichen von Betrieben.

  - typ: definition
    folien: [28]
    deckt: [f28.max]
    frage: |-
      Formuliere das **Maximumprinzip** (Wortlaut).
    antwort: |-
      „Bei einem gegebenen Faktoreinsatz (Input; Aufwand) ist eine größtmögliche Gütermenge (Output; Ertrag) zu erwirtschaften, d.h. der Ertrag soll maximiert werden.“

  - typ: definition
    folien: [28]
    deckt: [f28.min]
    frage: |-
      Formuliere das **Minimumprinzip** (Wortlaut).
    antwort: |-
      „Eine gegebene Gütermenge (Output; Ertrag) ist mit einem geringstmöglichen Faktoreinsatz (Input; Aufwand) zu erwirtschaften, d.h. der Aufwand soll minimiert werden.“

  - typ: definition
    folien: [28]
    deckt: [f28.opt]
    frage: |-
      Formuliere das **Optimumprinzip** (Wortlaut) mit dem Zusatz, den die Folie darunter nennt.
    antwort: |-
      „Es ist ein möglichst günstiges Verhältnis zwischen Gütermenge (Output; Ertrag) und Faktoreinsatz (Input; Aufwand) zu erwirtschaften, d.h. die Differenz zw. Aufwand und Ertrag ist zu maximieren“

      Zusatz: „Optimumprinzip: Optimierungsproblem mit lauter Unbekannten, Gewinnmaximierung“

  - typ: rueckwaerts
    folien: [28]
    deckt: [f28.max]
    frage: |-
      Welche Ausprägung des ökonomischen Prinzips: Bei **gegebenem Faktoreinsatz** soll eine **größtmögliche Gütermenge** erwirtschaftet werden?
    antwort: |-
      **Maximumprinzip** – der Ertrag soll maximiert werden.

  - typ: rueckwaerts
    folien: [28]
    deckt: [f28.min]
    frage: |-
      Welche Ausprägung des ökonomischen Prinzips: Eine **gegebene Gütermenge** soll mit **geringstmöglichem Faktoreinsatz** erwirtschaftet werden?
    antwort: |-
      **Minimumprinzip** – der Aufwand soll minimiert werden.

  - typ: rueckwaerts
    folien: [28]
    deckt: [f28.opt]
    frage: |-
      Welche Ausprägung des ökonomischen Prinzips nennt das Skript ein „Optimierungsproblem mit lauter Unbekannten“?
    antwort: |-
      **Optimumprinzip** (Gewinnmaximierung) – weder Input noch Output ist vorgegeben.

  - typ: verwechslung
    folien: [28]
    deckt: [f28.max, f28.min, f28.opt]
    frage: |-
      Maximum-, Minimum-, Optimumprinzip: Was ist jeweils **gegeben**, was wird **optimiert**?
    antwort: |-
      | Prinzip | gegeben | Ziel |
      |---|---|---|
      | Maximum | Input (Faktoreinsatz, Aufwand) | Output/Ertrag maximieren |
      | Minimum | Output (Gütermenge, Ertrag) | Input/Aufwand minimieren |
      | Optimum | nichts | günstigstes Verhältnis; Gewinnmaximierung |

  - typ: falle
    folien: [28]
    deckt: [f28.falle]
    frage: |-
      Warum ist „mit minimalem Aufwand einen maximalen Ertrag erzielen“ **keine** Ausprägung des ökonomischen Prinzips?
    antwort: |-
      Beides zugleich ist keine Ausprägung: Entweder ist **eine Größe gegeben** (Maximum- bzw. Minimumprinzip) **oder** das Verhältnis wird optimiert (Optimumprinzip).

      *Klausurfalle laut Lernzettel.* Ergänzung (eigene Begründung): Minimaler Aufwand wäre null – dann entstünde kein Ertrag.

  - typ: unstimmigkeit
    folien: [28, 48]
    deckt: [f28.unst]
    frage: |-
      Was ist am Wortlaut des **Optimumprinzips** widersprüchlich – und wie antwortest du in der Klausur?
    antwort: |-
      - Die Folie spricht erst vom **Verhältnis** (Ertrag ÷ Aufwand), dann von der **Differenz** (Ertrag − Aufwand) – das sind verschiedene Größen.
      - „die Differenz zw. Aufwand und Ertrag ist zu maximieren“ – wörtlich genommen hieße das Aufwand − Ertrag, also den Verlust maximieren.
      - Gemeint ist **Ertrag − Aufwand = Gewinn** (passt zu „Gewinnmaximierung“).

      **Klausur:** Wortlaut nennen und „Gewinnmaximierung“ dazusagen.

  - typ: anwendung
    folien: [28]
    deckt: [f28.max]
    frage: |-
      Welche Ausprägung des ökonomischen Prinzips? Eine Spedition will mit ihren **12 vorhandenen Lkw** im Monat **so viele Tonnen wie möglich** transportieren.
    antwort: |-
      **Maximumprinzip** – Input (12 Lkw) ist gegeben, Output (Transportmenge) wird maximiert.

  - typ: anwendung
    folien: [28]
    deckt: [f28.min]
    frage: |-
      Welche Ausprägung des ökonomischen Prinzips? Ein Auftrag über **500 Wellen** soll mit **möglichst wenig Maschinenstunden** gefertigt werden.
    antwort: |-
      **Minimumprinzip** – Output (500 Wellen) ist gegeben, Input (Maschinenstunden) wird minimiert.

  - typ: anwendung
    folien: [28]
    deckt: [f28.opt]
    frage: |-
      Welche Ausprägung des ökonomischen Prinzips? Eine Bäckerei legt **Backmenge und Personaleinsatz** so fest, dass **Ertrag − Aufwand am größten** wird.
    antwort: |-
      **Optimumprinzip** – weder Input noch Output ist vorgegeben; Ziel ist die Gewinnmaximierung.

  - typ: anwendung
    folien: [28]
    deckt: [f28.min]
    frage: |-
      Welche Ausprägung des ökonomischen Prinzips? Für die geplante Jahresproduktion von **10.000 Gehäusen** soll der **Stromverbrauch so gering wie möglich** sein.
    antwort: |-
      **Minimumprinzip** – Output (10.000 Gehäuse) ist gegeben, Input (Strom) wird minimiert.

  - typ: anwendung
    folien: [28]
    deckt: [f28.max]
    frage: |-
      Welche Ausprägung des ökonomischen Prinzips? Du willst mit deinen **20 Lernstunden pro Woche möglichst viel Stoff** schaffen.
    antwort: |-
      **Maximumprinzip** – Input (20 Stunden) ist gegeben, Output (Stoff) wird maximiert.

  - typ: klausurfrage
    w: W03
    folien: [28]
    deckt: [f28.def, f28.max, f28.min, f28.opt]
    frage: |-
      **Wiederholungsfrage:** Was versteht man unter dem ökonomischen Prinzip? Erläutern Sie die drei Ausprägungen.
    antwort: |-
      Allgemeines Vernunftprinzip: „Das ökonomische Prinzip (Wirtschaftlichkeitsprinzip) verlangt, das Verhältnis aus Produktionsergebnis (Output, Ertrag) und Produktionseinsatz (Input, Aufwand) zu optimieren.“

      - **Maximumprinzip:** gegebener Faktoreinsatz (Input) → größtmögliche Gütermenge (Output); der Ertrag soll maximiert werden.
      - **Minimumprinzip:** gegebene Gütermenge (Output) → geringstmöglicher Faktoreinsatz (Input); der Aufwand soll minimiert werden.
      - **Optimumprinzip:** möglichst günstiges Verhältnis von Output und Input, nichts ist vorgegeben („Optimierungsproblem mit lauter Unbekannten“); Differenz Ertrag − Aufwand maximieren = **Gewinnmaximierung**.

  - typ: definition
    folien: [29]
    deckt: [f29.bildung]
    frage: |-
      Wodurch bilden sich **Märkte**?
    antwort: |-
      „Märkte bilden sich durch das Zusammentreffen von Angebot und Nachfrage.“

  - typ: definition
    folien: [29]
    deckt: [f29.vwl]
    frage: |-
      Woraus besteht ein Markt **im volkswirtschaftswissenschaftlichen Sinn**?
    antwort: |-
      „aus Gruppen potenzieller Käufer und Verkäufer einer bestimmten Ware oder Dienstleistung“

  - typ: definition
    folien: [29]
    deckt: [f29.ort]
    frage: |-
      Ergänze: „Der Markt ist der **?** Ort des Tausches.“
    antwort: |-
      **abstrakte**

      *Deutung (Lernzettel): Ein Markt muss kein Platz sein – die Bilder der Folie zeigen Wochenmarkt, Börse und eBay.*

  - typ: aufzaehlung
    folien: [30]
    deckt: [f30.akteure]
    frage: |-
      Wer tritt am Markt als **Nachfrager**, wer als **Anbieter** auf?
    antwort: |-
      - **Nachfrage:** Konsumenten **und andere Unternehmen**
      - **Angebot:** Unternehmen

      *Falle: nicht nur Konsumenten als Nachfrager nennen.*

  - typ: fakt
    folien: [30]
    deckt: [f30.preis]
    frage: |-
      Worüber erfolgt die Koordination zwischen Angebot und Nachfrage – und worüber funktioniert dieses wiederum?
    antwort: |-
      Über den **Markt** – und der Markt funktioniert über den **Preis**.

  - typ: klausurfrage
    w: W04
    folien: [29, 30]
    deckt: [f29.bildung, f29.vwl, f29.ort, f30.preis]
    frage: |-
      **Wiederholungsfrage:** Was ist ein Markt?
    antwort: |-
      - „Märkte bilden sich durch das Zusammentreffen von Angebot und Nachfrage.“
      - Im volkswirtschaftswissenschaftlichen Sinn besteht ein Markt „aus Gruppen potenzieller Käufer und Verkäufer einer bestimmten Ware oder Dienstleistung“.
      - „Der Markt ist der abstrakte Ort des Tausches.“
      - Die Koordination von Angebot und Nachfrage erfolgt über den Markt, der Markt funktioniert über den **Preis**.

  - typ: definition
    folien: [31]
    deckt: [f31.elastizitaet]
    frage: |-
      Was misst die **Preiselastizität**?
    antwort: |-
      „die Reaktion der Nachfrage auf Preisänderungen“

  - typ: fakt
    folien: [31]
    deckt: [f31.preis]
    frage: |-
      Was bestimmt laut Grundprinzip (vereinfacht im vollkommenen Markt) den **Preis**?
    antwort: |-
      „Das Verhältnis von Angebot und Nachfrage bestimmt den Preis.“

  - typ: anwendung
    folien: [31]
    deckt: [f31.nachfrage]
    frage: |-
      Der Preis eines Produkts **sinkt**. Was passiert laut Skript mit der **verkauften (nachgefragten) Menge** – und wie verläuft daher die Nachfragefunktion?
    antwort: |-
      „Es würde mehr verkauft, wenn der Preis geringer wäre.“ → Die **Nachfragefunktion fällt** (Preis runter, Menge rauf).

  - typ: anwendung
    folien: [31]
    deckt: [f31.angebot]
    frage: |-
      Der Preis eines Produkts **steigt**. Was passiert laut Skript mit der **angebotenen Menge** – und wie verläuft daher die Angebotsfunktion?
    antwort: |-
      „Es würde mehr angeboten, wenn der Preis höher wäre.“ → Die **Angebotsfunktion steigt**.

  - typ: definition
    folien: [31]
    deckt: [f31.gleichgewicht]
    frage: |-
      Was ist das **Marktgleichgewicht**?
    antwort: |-
      „Schnittpunkt der Angebots- und Nachfragefunktion ist das Marktgleichgewicht.“

  - typ: skizze
    folien: [31]
    deckt: [f31.skizze, f31.gleichgewicht]
    frage: |-
      Skizziere die **Bildung des Marktgleichgewichts** aus Angebots- und Nachfragefunktion (mit Achsen).
    antwort: |-
      {{bild:kap2_marktgleichgewicht|Marktgleichgewicht}}

      - senkrecht **Preis (P)**, waagerecht **Menge (x)**
      - **Angebotsfunktion steigend**, **Nachfragefunktion fallend**
      - Schnittpunkt = **Marktgleichgewicht**, darunter auf der x-Achse die **Gleichgewichtsmenge**

  - typ: maske
    folien: [31]
    deckt: [f31.skizze, f31.angebot]
    frage: |-
      Marktdiagramm: Wie heißt die **steigende** Gerade?

      {{bild:kap2_marktgleichgewicht-ohne-funktionen|Marktdiagramm, Funktionsnamen verdeckt}}
    antwort: |-
      **Angebotsfunktion** – höherer Preis → mehr angeboten.

      {{bild:kap2_marktgleichgewicht|Marktgleichgewicht}}

  - typ: maske
    folien: [31]
    deckt: [f31.skizze, f31.nachfrage]
    frage: |-
      Marktdiagramm: Wie heißt die **fallende** Gerade?

      {{bild:kap2_marktgleichgewicht-ohne-funktionen|Marktdiagramm, Funktionsnamen verdeckt}}
    antwort: |-
      **Nachfragefunktion** – geringerer Preis → mehr verkauft.

      {{bild:kap2_marktgleichgewicht|Marktgleichgewicht}}

  - typ: maske
    folien: [31]
    deckt: [f31.skizze]
    frage: |-
      Wie sind die beiden Achsen beschriftet?

      {{bild:kap2_marktgleichgewicht-ohne-achsen|Marktdiagramm, Achsen verdeckt}}
    antwort: |-
      - senkrecht: **Preis (P)**
      - waagerecht: **Menge (x)**

      *Falle: Achsen vertauschen.*

  - typ: maske
    folien: [31]
    deckt: [f31.skizze, f31.gleichgewicht]
    frage: |-
      Was markiert der Punkt unter dem Schnittpunkt auf der Mengenachse?

      {{bild:kap2_marktgleichgewicht-ohne-gleichgewichtsmenge|Marktdiagramm, Beschriftung der x-Achse verdeckt}}
    antwort: |-
      Die **Gleichgewichtsmenge** – die Menge im Marktgleichgewicht (Schnittpunkt von Angebots- und Nachfragefunktion).

      {{bild:kap2_marktgleichgewicht|Marktgleichgewicht}}

  - typ: klausurfrage
    w: W05
    folien: [31]
    deckt: [f31.preis, f31.nachfrage, f31.angebot, f31.gleichgewicht]
    frage: |-
      **Wiederholungsfrage:** Wodurch wird der Marktpreis eines Produktes bestimmt?
    antwort: |-
      Grundprinzip (vereinfacht im vollkommenen Markt): „Das Verhältnis von Angebot und Nachfrage bestimmt den Preis.“
      - „Es würde mehr verkauft, wenn der Preis geringer wäre.“ → Nachfragefunktion fällt.
      - „Es würde mehr angeboten, wenn der Preis höher wäre.“ → Angebotsfunktion steigt.
      - Der Preis stellt sich im **Schnittpunkt** beider Funktionen ein – dem **Marktgleichgewicht**.

      Am besten mit Skizze: P senkrecht, x waagerecht, Gleichgewichtsmenge markieren.

  # =====================================================================  2.2 Prozesse und Stakeholder
  - typ: definition
    folien: [33]
    deckt: [f33.def]
    frage: |-
      Was geschieht im **Transformationsprozess** (bzw. bei der Wertschöpfung)?
    antwort: |-
      „Der Betrieb wandelt einen Input in einen Output um.“

  - typ: rueckwaerts
    folien: [33]
    deckt: [f33.def]
    frage: |-
      Wie heißt laut Folienüberschrift der Prozess, in dem der Betrieb einen **Input in einen Output** umwandelt? (zwei Bezeichnungen)
    antwort: |-
      **Transformationsprozess** bzw. **Wertschöpfung**

      Im Schaubild auch: „Transformationsprozess / Produktion“.

  - typ: aufzaehlung
    folien: [33]
    deckt: [f33.input]
    frage: |-
      Welche vier **Inputs** (Produktionsfaktoren) nennt das Skript für den Transformationsprozess?
    antwort: |-
      - Arbeitsleistungen
      - Potenzialfaktoren
      - Repetierfaktoren
      - Informationen

  - typ: luecke
    folien: [33]
    deckt: [f33.input]
    frage: |-
      Input des Transformationsprozesses: **?** · Potenzialfaktoren · Repetierfaktoren · Informationen
    antwort: |-
      **Arbeitsleistungen**

  - typ: luecke
    folien: [33]
    deckt: [f33.input]
    frage: |-
      Input des Transformationsprozesses: Arbeitsleistungen · **?** · Repetierfaktoren · Informationen
    antwort: |-
      **Potenzialfaktoren**

  - typ: luecke
    folien: [33]
    deckt: [f33.input]
    frage: |-
      Input des Transformationsprozesses: Arbeitsleistungen · Potenzialfaktoren · **?** · Informationen
    antwort: |-
      **Repetierfaktoren**

  - typ: luecke
    folien: [33]
    deckt: [f33.input]
    frage: |-
      Input des Transformationsprozesses: Arbeitsleistungen · Potenzialfaktoren · Repetierfaktoren · **?**
    antwort: |-
      **Informationen**

  - typ: fakt
    folien: [33]
    deckt: [f33.output]
    frage: |-
      Was entsteht als **Output** des Transformationsprozesses?
    antwort: |-
      **Halb- und Fertigfabrikate** – also **Güter** (Sach-/Dienstleistung).

  - typ: fakt
    folien: [33]
    deckt: [f33.geld]
    frage: |-
      Was steht in der **untersten Zeile** des Input-Output-Schaubilds, unter Input bzw. Output?
    antwort: |-
      **Kosten → Leistung**

      *Deutung (Lernzettel, vgl. F. 34): dieselbe Umwandlung in Geldgrößen.*

  - typ: skizze
    folien: [33]
    deckt: [f33.skizze, f33.input, f33.output, f33.geld]
    frage: |-
      Skizziere den **Input-Output-Prozess** mit den drei Oberbegriffen und der untersten Zeile.
    antwort: |-
      {{bild:kap2_transformationsprozess|Transformationsprozess}}

      Input → Transformationsprozess/Produktion → Output
      **Produktionsfaktoren → Wertschöpfung → Güter**
      **Kosten → Leistung**

  - typ: maske
    folien: [33]
    deckt: [f33.input, f33.skizze]
    frage: |-
      Oberbegriff für den Input – was steht im verdeckten Feld?

      {{bild:kap2_transformationsprozess-ohne-produktionsfaktoren|Input-Output-Prozess, Feld verdeckt}}
    antwort: |-
      **Produktionsfaktoren**

      {{bild:kap2_transformationsprozess|Transformationsprozess}}

  - typ: maske
    folien: [33]
    deckt: [f33.def, f33.skizze]
    frage: |-
      Oberbegriff unter dem Transformationsprozess (mittlere Spalte) – was steht im verdeckten Feld?

      {{bild:kap2_transformationsprozess-ohne-wertschoepfung|Input-Output-Prozess, Feld verdeckt}}
    antwort: |-
      **Wertschöpfung**

      {{bild:kap2_transformationsprozess|Transformationsprozess}}

  - typ: maske
    folien: [33]
    deckt: [f33.output, f33.skizze]
    frage: |-
      Oberbegriff für den Output – was steht im verdeckten Feld?

      {{bild:kap2_transformationsprozess-ohne-gueter|Input-Output-Prozess, Feld verdeckt}}
    antwort: |-
      **Güter** – Sach-/Dienstleistung

      {{bild:kap2_transformationsprozess|Transformationsprozess}}

  - typ: maske
    folien: [33]
    deckt: [f33.geld, f33.skizze]
    frage: |-
      Kosten → **?** – was steht im verdeckten Feld?

      {{bild:kap2_transformationsprozess-ohne-leistung|Input-Output-Prozess, Feld verdeckt}}
    antwort: |-
      **Leistung**

      {{bild:kap2_transformationsprozess|Transformationsprozess}}

  - typ: klausurfrage
    w: W06
    folien: [33]
    deckt: [f33.def, f33.input, f33.output, f33.geld]
    frage: |-
      **Wiederholungsfrage:** Was versteht man unter dem betrieblichen Transformationsprozess?
    antwort: |-
      Transformationsprozess bzw. Wertschöpfung: „Der Betrieb wandelt einen Input in einen Output um.“
      - **Input = Produktionsfaktoren:** Arbeitsleistungen, Potenzialfaktoren, Repetierfaktoren, Informationen
      - **Transformationsprozess / Produktion = Wertschöpfung**
      - **Output = Güter:** Halb- und Fertigfabrikate (Sach-/Dienstleistung)
      - Unterste Zeile: aus **Kosten** wird **Leistung** (*Deutung laut Lernzettel:* in Geldgrößen)

  - typ: klausurfrage
    w: W07
    folien: [34]
    deckt: [f34.skizze, f34.schritte, f34.zahlungen, f34.finanz]
    frage: |-
      **Wiederholungsfrage:** Skizzieren Sie schematisch den güter- und finanzwirtschaftlichen Umsatzprozess eines (produzierenden) Unternehmens.
    antwort: |-
      {{bild:kap2_umsatzprozess|Umsatzprozess}}

      Muss rein:
      - links **Beschaffungsmarkt**, rechts **Absatzmarkt**, unten **Kredit- und Kapitalmarkt**
      - oben **realgüterwirtschaftlicher Prozess:** Arbeitsleistungen, Potenzial-, Repetierfaktoren, Informationen → Transformationsprozess der Produktion → Halb- und Fertigfabrikate
      - unten **finanzwirtschaftlicher Prozess:** Aufwand/Kosten → Ertrag/Leistung; finanzielle Mittel
      - **Ausgaben** zum Beschaffungsmarkt, **Einnahmen** vom Absatzmarkt (Geld läuft gegen den Güterstrom)
      - Schritte **1** Beschaffung finanzieller Mittel · **2** Beschaffung von Produktionsfaktoren · **3** Kombination der Produktionsfaktoren · **4** Absatz der erstellten Güter · **5** Rückzahlung der finanziellen Mittel
      - Nummern im Schema: **1** Pfeil vom Kredit- und Kapitalmarkt ins Unternehmen · **2** Pfeil vom Beschaffungsmarkt · **3** Pfeil in den Transformationsprozess · **4** Pfeil zum Absatzmarkt · **5** Pfeil zum Kredit- und Kapitalmarkt

  - typ: maske
    folien: [34]
    deckt: [f34.schritte]
    frage: |-
      Umsatzprozess: Was bedeuten die Nummern **1 bis 5** (Legende verdeckt)?

      {{bild:kap2_umsatzprozess-ohne-schritte|Umsatzprozess, Legende verdeckt}}
    antwort: |-
      1. Beschaffung finanzieller Mittel
      2. Beschaffung von Produktionsfaktoren
      3. Kombination der Produktionsfaktoren
      4. Absatz der erstellten Güter
      5. Rückzahlung der finanziellen Mittel

  - typ: luecke
    folien: [34]
    deckt: [f34.schritte]
    frage: |-
      Umsatzprozess, **Schritt 1**: Was passiert – und an welchem Markt?
    antwort: |-
      **Beschaffung finanzieller Mittel** – am **Kredit- und Kapitalmarkt**.

  - typ: luecke
    folien: [34]
    deckt: [f34.schritte]
    frage: |-
      Umsatzprozess, **Schritt 2**: Was passiert – und an welchem Markt?
    antwort: |-
      **Beschaffung von Produktionsfaktoren** – am **Beschaffungsmarkt** (dafür fließen Ausgaben).

  - typ: luecke
    folien: [34]
    deckt: [f34.schritte]
    frage: |-
      Umsatzprozess, **Schritt 3**: Was passiert – und wo?
    antwort: |-
      **Kombination der Produktionsfaktoren** – im Unternehmen, im Transformationsprozess der Produktion.

  - typ: luecke
    folien: [34]
    deckt: [f34.schritte]
    frage: |-
      Umsatzprozess, **Schritt 4**: Was passiert – und an welchem Markt?
    antwort: |-
      **Absatz der erstellten Güter** – am **Absatzmarkt** (dafür fließen Einnahmen).

  - typ: luecke
    folien: [34]
    deckt: [f34.schritte]
    frage: |-
      Umsatzprozess, **Schritt 5**: Was passiert – und an welchem Markt?
    antwort: |-
      **Rückzahlung der finanziellen Mittel** – an den **Kredit- und Kapitalmarkt**.

  - typ: maske
    folien: [34]
    deckt: [f34.zahlungen]
    frage: |-
      Umsatzprozess: Welcher Zahlungsstrom fließt hier zum Beschaffungsmarkt (verdecktes Feld)?

      {{bild:kap2_umsatzprozess-ohne-ausgaben|Umsatzprozess, Feld links verdeckt}}
    antwort: |-
      **Ausgaben** – für die beschafften Produktionsfaktoren; Geld fließt gegen den Güterstrom.

      {{bild:kap2_umsatzprozess|Umsatzprozess}}

  - typ: maske
    folien: [34]
    deckt: [f34.zahlungen]
    frage: |-
      Umsatzprozess: Welcher Zahlungsstrom kommt hier vom Absatzmarkt (verdecktes Feld)?

      {{bild:kap2_umsatzprozess-ohne-einnahmen|Umsatzprozess, Feld rechts verdeckt}}
    antwort: |-
      **Einnahmen** – für die abgesetzten Güter.

      {{bild:kap2_umsatzprozess|Umsatzprozess}}

  - typ: maske
    folien: [34]
    deckt: [f34.finanz]
    frage: |-
      Umsatzprozess: Was steht im unteren Balken des finanzwirtschaftlichen Prozesses (verdeckt)?

      {{bild:kap2_umsatzprozess-ohne-finanzielle-mittel|Umsatzprozess, Balken verdeckt}}
    antwort: |-
      **Finanzielle Mittel** – sie kommen über Einnahmen herein und gehen über Ausgaben hinaus.

      {{bild:kap2_umsatzprozess|Umsatzprozess}}

  - typ: fakt
    folien: [34]
    deckt: [f34.finanz]
    frage: |-
      Umsatzprozess, finanzwirtschaftlicher Prozess, **oberer Balken**: Welche Begriffspaare stehen am Anfang und am Ende des Pfeils?
    antwort: |-
      **Aufwand/Kosten → Ertrag/Leistung**

  - typ: verwechslung
    folien: [34]
    deckt: [f34.zahlungen, f34.finanz]
    frage: |-
      Umsatzprozess: Wo stehen **Ausgaben/Einnahmen**, wo **Aufwand/Kosten → Ertrag/Leistung**?
    antwort: |-
      - **Ausgaben/Einnahmen** an der Grenze zu den Märkten (Ausgaben → Beschaffungsmarkt, Einnahmen ← Absatzmarkt)
      - **Aufwand/Kosten → Ertrag/Leistung** im Inneren, im finanzwirtschaftlichen Prozess

      *Hinweis (nicht auf F. 34): Die Begriffe nicht gleichsetzen – die Abgrenzung kommt in Kap. 6 (Rechnungswesen).*

  - typ: anwendung
    folien: [34]
    deckt: [f34.schritte]
    frage: |-
      Ein Fahrradhersteller nimmt bei seiner Bank einen **Kredit** auf. Welcher Schritt des Umsatzprozesses ist das?
    antwort: |-
      **Schritt 1:** Beschaffung finanzieller Mittel am Kredit- und Kapitalmarkt. (Die Tilgung später ist Schritt 5.)

  - typ: anwendung
    folien: [34]
    deckt: [f34.schritte, f34.zahlungen]
    frage: |-
      Der Fahrradhersteller kauft **Aluminiumrohre** ein. Welcher Schritt des Umsatzprozesses – und welcher Zahlungsstrom?
    antwort: |-
      **Schritt 2:** Beschaffung von Produktionsfaktoren am Beschaffungsmarkt → **Ausgaben**.

  - typ: anwendung
    folien: [34]
    deckt: [f34.schritte, f34.zahlungen]
    frage: |-
      Der Fahrradhersteller **verkauft** seine Räder an Händler. Welcher Schritt des Umsatzprozesses – und welcher Zahlungsstrom?
    antwort: |-
      **Schritt 4:** Absatz der erstellten Güter am Absatzmarkt → **Einnahmen**.

  - typ: definition
    folien: [35]
    deckt: [f35.def]
    frage: |-
      Was sind **Stakeholder**?
    antwort: |-
      **Anspruchsgruppen** eines Unternehmens: „Stakeholder tragen mehr oder weniger berechtigte Ansprüche an Unternehmen heran bzw. haben ein Interesse am Unternehmen“

  - typ: rueckwaerts
    folien: [35]
    deckt: [f35.def]
    frage: |-
      Wie nennt man Anspruchsgruppen, die mehr oder weniger berechtigte Ansprüche an ein Unternehmen herantragen?
    antwort: |-
      **Stakeholder**

  - typ: fakt
    folien: [35]
    deckt: [f35.interaktion]
    frage: |-
      Wann kommt es laut Skript zur Interaktion einer Vielzahl von Anspruchsgruppen?
    antwort: |-
      „Bei der Lösung betrieblicher Probleme“

  - typ: maske
    folien: [36]
    deckt: [f36.intern]
    frage: |-
      Nenne die fünf **internen** Stakeholder (verdeckt; die Interessen stehen als Hinweis daneben).

      {{bild:kap2_stakeholder-ohne-interne|Stakeholder-Tabelle, interne Gruppen verdeckt}}
    antwort: |-
      Eigentümer · Management · Mitarbeiter · Aufsichtsrat · Betriebsrat

      {{bild:kap2_stakeholder|Stakeholder}}

  - typ: maske
    folien: [36]
    deckt: [f36.extern]
    frage: |-
      Nenne die fünf **externen** Stakeholder der Auswahl (verdeckt; die Interessen stehen als Hinweis daneben).

      {{bild:kap2_stakeholder-ohne-externe|Stakeholder-Tabelle, externe Gruppen verdeckt}}
    antwort: |-
      FK-Geber · Lieferanten · Kunden · Konkurrenten · Staat und Gesellschaft

      {{bild:kap2_stakeholder|Stakeholder}}

  - typ: fakt
    folien: [36]
    deckt: [f36.interessen, f36.shareholder]
    frage: |-
      Stakeholder **Eigentümer**: Welche **drei** Interessen nennt die Stakeholder-Tabelle? (Wortlaut)
    antwort: |-
      „Einkommen, Gewinn, Wertsteigerung des Kapitals [Aktionäre = Shareholder]“ (intern)

  - typ: fakt
    folien: [36]
    deckt: [f36.interessen]
    frage: |-
      Stakeholder **Management**: Welche **fünf** Interessen nennt die Stakeholder-Tabelle? (Wortlaut)
    antwort: |-
      „Einkommen, Arbeitsplatz, Sicherheit, Macht, Prestige“ (intern)

  - typ: fakt
    folien: [36]
    deckt: [f36.interessen]
    frage: |-
      Stakeholder **Mitarbeiter**: Welche **vier** Interessen nennt die Stakeholder-Tabelle? (Wortlaut)
    antwort: |-
      „Einkommen, Arbeitsplatz, Sicherheit, zwischenmenschliche Kontakte“ (intern)

  - typ: fakt
    folien: [36]
    deckt: [f36.interessen]
    frage: |-
      Stakeholder **Aufsichtsrat**: Welche **drei** Interessen nennt die Stakeholder-Tabelle? (Wortlaut)
    antwort: |-
      „Kontrolle, Information, strategische Ausrichtung des Unternehmens“ (intern)

  - typ: fakt
    folien: [36]
    deckt: [f36.interessen]
    frage: |-
      Stakeholder **Betriebsrat**: Welche **vier** Interessen nennt die Stakeholder-Tabelle? (Wortlaut)
    antwort: |-
      „Kontrolle, Mitbestimmung, Interessenvertretung, Wiederwahl“ (intern)

  - typ: fakt
    folien: [36]
    deckt: [f36.interessen]
    frage: |-
      Stakeholder **FK-Geber** (Fremdkapitalgeber): Welche **drei** Interessen nennt die Stakeholder-Tabelle? (Wortlaut)
    antwort: |-
      „Sicherheit für Kapitaleinlagen, gute Verzinsung, Vermögenszuwachs“ (extern)

  - typ: fakt
    folien: [36]
    deckt: [f36.interessen]
    frage: |-
      Stakeholder **Lieferanten**: Welche **drei** Interessen nennt die Stakeholder-Tabelle? (Wortlaut)
    antwort: |-
      „Stabile Liefermöglichkeiten, günstige Konditionen, Zahlungsfähigkeit“ (extern)

  - typ: fakt
    folien: [36]
    deckt: [f36.interessen]
    frage: |-
      Stakeholder **Kunden**: Welche **drei** Interessen nennt die Stakeholder-Tabelle? (Wortlaut)
    antwort: |-
      „Gute Qualität u. Quantität, Service, günstige Konditionen etc.“ (extern)

  - typ: fakt
    folien: [36]
    deckt: [f36.interessen]
    frage: |-
      Stakeholder **Konkurrenten**: Welche **zwei** Interessen nennt die Stakeholder-Tabelle? (Wortlaut)
    antwort: |-
      „Einhaltung fairer Grundsätze und Spielregeln, Kooperation“ (extern)

  - typ: fakt
    folien: [36]
    deckt: [f36.interessen]
    frage: |-
      Stakeholder **Staat und Gesellschaft**: Nenne mindestens **vier** der sieben Interessen aus der Stakeholder-Tabelle.
    antwort: |-
      „Steuern, Sicherung der Arbeitsplätze, Sozialleistungen, positive Beiträge an die Infrastruktur, Einhaltung von Recht und Normen, Teilnahme an der politischen Willensbildung, Kultursponsoring etc.“ (extern)

  - typ: verwechslung
    folien: [36]
    deckt: [f36.shareholder]
    frage: |-
      **Stakeholder** vs. **Shareholder** – was ist der Unterschied?
    antwort: |-
      - **Stakeholder:** alle Anspruchsgruppen (intern und extern)
      - **Shareholder:** die Aktionäre = Eigentümer – nur **eine** Stakeholder-Gruppe (intern)

  - typ: anwendung
    folien: [36]
    deckt: [f36.interessen]
    frage: |-
      Ein Unternehmen erhöht die Löhne deutlich. Welche zwei Stakeholder-Gruppen haben hier laut ihren Interessen **gegensätzliche** Ziele?
    antwort: |-
      **Mitarbeiter** (Interesse: Einkommen) ↔ **Eigentümer** (Interesse: Gewinn, Wertsteigerung des Kapitals).

      *Vertretbar auch: Betriebsrat (Interessenvertretung) statt Mitarbeiter. Den Zielkonflikt nennt das Skript nicht ausdrücklich – abgeleitet aus den Interessen der Tabelle.*

  - typ: anwendung
    folien: [36]
    deckt: [f36.interessen, f36.extern]
    frage: |-
      Eine Bank prüft einen Kreditantrag des Unternehmens. Als welche Stakeholder-Gruppe tritt sie auf?
    antwort: |-
      **FK-Geber** (Fremdkapitalgeber) – externe Anspruchsgruppe.

  - typ: klausurfrage
    w: W08
    folien: [35, 36]
    deckt: [f35.def, f36.intern, f36.extern]
    frage: |-
      **Wiederholungsfrage:** Was sind Stakeholder? Nennen Sie mindestens vier Beispiele bezogen auf ein Unternehmen.
    antwort: |-
      Stakeholder sind **Anspruchsgruppen**: „Stakeholder tragen mehr oder weniger berechtigte Ansprüche an Unternehmen heran bzw. haben ein Interesse am Unternehmen“

      | intern | Interesse | extern | Interesse |
      |---|---|---|---|
      | Eigentümer | Gewinn, Wertsteigerung | FK-Geber | Sicherheit, Verzinsung |
      | Management | Einkommen, Macht, Prestige | Lieferanten | stabile Liefermöglichkeiten, Zahlungsfähigkeit |
      | Mitarbeiter | Einkommen, Arbeitsplatz | Kunden | Qualität, Service, Konditionen |
      | Aufsichtsrat | Kontrolle, Information | Konkurrenten | faire Spielregeln |
      | Betriebsrat | Mitbestimmung, Interessenvertretung | Staat und Gesellschaft | Steuern, Arbeitsplätze |

  # =====================================================================  2.3 Typologie
  - typ: klausurfrage
    w: W09
    folien: [38]
    deckt: [f38.kriterien]
