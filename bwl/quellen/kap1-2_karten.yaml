karten:
  # =====================================================================  Kapitel 1: Einleitung
  - typ: fakt
    folien: [6]
    deckt: [f06.wirt]
    frage: |-
      Von welchem althochdeutschen Wort leitet sich **„Wirtschaft“** ab, und was bedeutete **dieses Wort** ursprünglich?
    antwort: |-
      Vom althochdeutschen **„wirt“** – ursprünglich „Gastgeber“ oder „Hausherr“.
      Später auch für die Bewirtung und den Haushalt verwendet.

  - typ: fakt
    folien: [6]
    deckt: [f06.oekonomie]
    frage: |-
      Aus welchen zwei altgriechischen Wörtern setzt sich **„Ökonomie“** zusammen?
    antwort: |-
      - **oikos** = Haus, Haushalt
      - **nemein** = teilen, einteilen

      „Ökonomie“ wird synonym für „Wirtschaft“ verwendet.

  - typ: definition
    folien: [6]
    deckt: [f06.heute]
    frage: |-
      Was bezeichnet **„Wirtschaft“** heutzutage? (Definition von der Folie „Was ist Wirtschaft?“)
    antwort: |-
      „die Gesamtheit aller Einrichtungen, Personen und Abläufe, die mit der Produktion, Verteilung und dem Konsum von Gütern und Dienstleistungen verbunden sind“

  - typ: fakt
    folien: [6]
    deckt: [f06.entwicklung]
    frage: |-
      Welche Entwicklung hat der Begriff „Wirtschaft“ durchlaufen?
    antwort: |-
      Von der **Hauswirtschaft und Bewirtung** hin zur **Gesamtheit aller ökonomischen Aktivitäten**.

  - typ: definition
    folien: [7]
    deckt: [f07.bwl]
    frage: |-
      Was ist Betriebswirtschaftslehre – in einer Zeile (Untertitel der Folie „Was ist Betriebswirtschaftslehre?“)?
    antwort: |-
      „Lehre vom Wirtschaften in Betrieben / Unternehmen“

  - typ: definition
    folien: [7]
    deckt: [f07.notwendigkeit]
    frage: |-
      Worin besteht die **Notwendigkeit des Wirtschaftens**?
    antwort: |-
      „im Konflikt zwischen der Knappheit der Güter und den in der Tendenz unbegrenzten Bedürfnissen“

  - typ: formel
    folien: [7]
    deckt: [f07.effizienz]
    frage: |-
      Wie ist **Effizienz** definiert (Formel)?
    antwort: |-
      **Effizienz = Erfolg / Aufwand**

  - typ: fakt
    folien: [7]
    deckt: [f07.effizienz]
    frage: |-
      Wozu wird **Effizienz** im Umgang mit Gütern und Ressourcen gefordert?
    antwort: |-
      Um „größtmöglichen Erfolg mit begrenzt leistbarem Aufwand zu erreichen“.

  - typ: rueckwaerts
    folien: [7]
    deckt: [f07.effizienz]
    frage: |-
      Welche Größe ist definiert als **Erfolg / Aufwand**?
    antwort: |-
      **Effizienz**

      Nicht verwechseln mit Wirtschaftlichkeit = Ertrag / Aufwand (F. 48).

  - typ: fakt
    folien: [7]
    deckt: [f07.handeln]
    frage: |-
      Wodurch soll Wirtschaften die geforderte Effizienz sicherstellen?
    antwort: |-
      „durch planvolles, zielgerichtetes Handeln zur Bedarfsdeckung“

  - typ: aufzaehlung
    folien: [8]
    deckt: [f08.ressourcen]
    frage: |-
      Die Folie „Wirtschaften – Entscheidungen über knappe Ressourcen“ nennt zwei Gruppen. Welche **vier begrenzten Ressourcen** stehen in der zweiten Gruppe?
    antwort: |-
      - Materialressourcen
      - Kapazitäten
      - Personalressourcen
      - Finanzmittel

      Erste Gruppe: begrenzte Zeit, begrenztes Einkommen. Beide Listen enden mit „…“.
      *Deutung (Lernzettel): zweite Gruppe = betriebliche, erste = private Ressourcen.*

  - typ: aufzaehlung
    folien: [9]
    deckt: [f09.kompetenz]
    frage: |-
      Was umfasst **betriebswirtschaftliche Kompetenz**? (vier Verben)
    antwort: |-
      **Entscheidungsprozesse** verstehen, unterstützen, beeinflussen, durchführen.

  - typ: skizze
    folien: [11]
    deckt: [f11.skizze, f11.maerkte, f11.real, f11.finanz, f11.quer]
    frage: |-
      Skizziere den **Bezugsrahmen** der BWL: Unternehmen, Märkte und die beiden Prozesse.
    antwort: |-
      {{bild:kap1_bezugsrahmen|Bezugsrahmen}}

      - Unternehmen in der **Unternehmensumwelt**
      - links **Beschaffungsmarkt**, rechts **Absatzmarkt**, unten **Kredit- und Kapitalmarkt**
      - oben Personal · Management · Organisation
      - **realgüterwirtschaftlicher Prozess**: Materialwirtschaft → Produktion → Marketing
      - **finanzwirtschaftlicher Prozess**: Rechnungswesen, Investition, Finanzierung

