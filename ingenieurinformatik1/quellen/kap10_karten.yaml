karten:
  # ---------------------------------------------------------------- import
  - typ: code_ausgabe
    folien: [79]
    aufgaben: ["2.5"]
    deckt: [c10.import, c10.math]
    frage: |-
      Was gibt der Code aus?
      ```python
      import math
      print(math.sqrt(16))
      ```
    antwort: |-
      ```text
      4.0
      ```
      Funktionen eines Moduls ruft man mit `modul.funktion()` auf; `sqrt` liefert einen float.
    tests: [{p: 1, t: 1}]

  - typ: code_fehler
    aufgaben: ["2.5"]
    deckt: [c10.import]
    frage: |-
      Welche **Fehlerart** meldet Python, und was fehlt?
      ```python
      kante = math.sqrt(2.25)
      print(kante)
      ```
    antwort: |-
      Einen **NameError** (`name 'math' is not defined`; neuere Python-Versionen hängen einen Import-Hinweis an). Es fehlt `import math` vor der ersten Verwendung.
    tests: [{p: 1, abbruch: NameError}]

  - typ: begriff
    folien: [77, 78, 205]
    aufgaben: ["2.5"]
    deckt: [c10.import]
    frage: |-
      Was ist eine **Bibliothek** in Python?
    antwort: |-
      Eine fertige Sammlung von Funktionen für bestimmte Aufgaben (z. B. Mathematik, Zufall, Zeit, Diagramme) – wie ein Werkzeugkasten, den man ins eigene Programm holt, statt alles selbst zu schreiben. Eine Bibliothek kann aus mehreren **Modulen** bestehen: `pyplot` ist z. B. ein Modul der Bibliothek `matplotlib` (F. 205).

  - typ: code_luecke
    aufgaben: ["2.5"]
    deckt: [c10.import]
    frage: |-
      Ergänze die erste Zeile, damit `random.randint` verfügbar ist (zufällige Drehzahl `n`).
      ```python
      ___ random
      n = random.randint(1000, 3000)
      print(n >= 1000 and n <= 3000)
      ```
    antwort: |-
      `import`
      ```python
      import random
      n = random.randint(1000, 3000)
      print(n >= 1000 and n <= 3000)
      ```
      ```text
      True
      ```
    tests: [{p: 2, t: 1}]

  # ---------------------------------------------------------------- import as / from
  - typ: code_luecke
    folien: [205]
    aufgaben: ["2.1"]
    deckt: [c10.import_as]
    frage: |-
      Ergänze, sodass das Modul unter dem Kurznamen `plt` angesprochen werden kann.
      ```python
      import matplotlib.pyplot ___ plt
      ```
    antwort: |-
      `as`
      ```python
      import matplotlib.pyplot as plt
      ```
      Üblich sind auch `import numpy as np` und `import pandas as pd`.
    tests: [{p: 2}]

  - typ: unterschied
    aufgaben: ["4.3"]
    deckt: [c10.import_as]
    frage: |-
      Was ist der Unterschied zwischen `import math` und `from math import ceil`?
    antwort: |-
      - `import math`: Aufruf mit Modulnamen – `math.ceil(2.1)`.
      - `from math import ceil`: nur `ceil` wird geholt und direkt aufgerufen – `ceil(2.1)` (so z. B. `from IPython.display import clear_output`).

  - typ: code_fehler
    aufgaben: ["4.3"]
    deckt: [c10.import_as]
    frage: |-
      Welche **Fehlerart** meldet Python, und warum?
      ```python
      from math import ceil
      print(math.ceil(3.4))
      ```
    antwort: |-
      Einen **NameError** (`name 'math' is not defined`; neuere Python-Versionen hängen einen Hinweis an). `from math import ceil` holt nur den Namen `ceil`, nicht `math`. Richtig: `print(ceil(3.4))` → `4`.
    tests: [{p: 1, abbruch: NameError}]

  - typ: code_ausgabe
    aufgaben: ["2.5", "2.6"]
    deckt: [c10.math]
    frage: |-
      Was gibt der Code aus?
      ```python
      import math
      rollen = 2.1
      print(math.ceil(rollen))
      print(math.ceil(2.0))
      ```
    antwort: |-
      ```text
      3
      2
      ```
      `math.ceil` rundet auf die nächste **ganze Zahl auf** (2,1 Rollen Draht → 3 kaufen); ist der Wert schon ganz, bleibt er.
    tests: [{p: 1, t: 1}]

  - typ: code_schreiben
    aufgaben: ["2.5"]
    deckt: [c10.math]
    frage: |-
      Berechne die Fläche eines Kolbens mit `d = 80` mm (A = π · d² / 4) mit `math.pi` und gib sie mit einer Nachkommastelle aus.
    antwort: |-
      ```python
      import math
      d = 80
      flaeche = math.pi * d ** 2 / 4
      print(f"{flaeche:.1f} mm²")
      ```
      ```text
      5026.5 mm²
      ```
    tests: [{p: 1, t: 1}]

  - typ: unterschied
    folien: [75]
    aufgaben: ["2.6"]
    deckt: [c10.math]
    frage: |-
      Was ist der Unterschied zwischen `math.ceil(3520.4)` und `int(3520.4)`?
    antwort: |-
      - `math.ceil(3520.4)` → `3521`: rundet **auf** (z. B. Bestellmenge, die reichen muss).
      - `int(3520.4)` → `3520`: **schneidet** die Nachkommastellen ab.

  # ---------------------------------------------------------------- random
  - typ: begriff
    aufgaben: ["3.4"]
    deckt: [c10.random]
    frage: |-
      Welche Werte kann `random.randint(1, 6)` liefern?
    antwort: |-
      Die ganzen Zahlen **1 bis 6** – bei randint sind **beide** Grenzen eingeschlossen.

  - typ: unterschied
    aufgaben: ["3.4", "3.9"]
    deckt: [c10.random]
    frage: |-
      Was ist der Unterschied zwischen den Grenzen bei `random.randint(1, 6)` und `range(1, 6)`?
    antwort: |-
      - `randint(1, 6)`: 6 ist **möglich** (obere Grenze eingeschlossen).
      - `range(1, 6)`: endet bei 5 (obere Grenze **ausgeschlossen**).

  - typ: code_luecke
    aufgaben: ["3.4"]
    deckt: [c10.random]
    frage: |-
      Wähle für die Stichprobe zufällig eins von 12 Werkstücken aus (Nummern **1 bis 12**, beide möglich). Ergänze die Argumente.
      ```python
      import random
      nr = random.randint(___)
      print(nr)
      ```
    antwort: |-
      `1, 12`
      ```python
      import random
      nr = random.randint(1, 12)
      print(nr)
      ```
    tests: [{p: 2}]

  - typ: code_schreiben
    aufgaben: ["2.9"]
    deckt: [c10.random]
    frage: |-
      Simuliere **fünf** ganzzahlige Druckwerte zwischen 2 und 8 bar und sammle sie in einer Liste.
    antwort: |-
      ```python
      import random
      werte = []
      for i in range(5):
          werte.append(random.randint(2, 8))
      print(werte)
      ```
    tests: [{p: 1}]

  # ---------------------------------------------------------------- time.sleep
  - typ: begriff
    aufgaben: ["2.7"]
    deckt: [c10.sleep]
    frage: |-
      Was bewirkt `time.sleep(3)`?
    antwort: |-
      Das Programm hält an dieser Stelle **3 Sekunden** an und macht danach weiter (z. B. Prüfpause oder Takt zwischen Messungen).

  - typ: code_luecke
    aufgaben: ["2.9"]
    deckt: [c10.sleep]
    frage: |-
      Zwischen den Messungen soll eine halbe Sekunde Pause sein. Ergänze den Funktionsnamen.
      ```python
      import time
      for i in range(2):
          print("Messung", i + 1)
          time.___(0.5)
      ```
    antwort: |-
      `sleep`
      ```python
      import time
      for i in range(2):
          print("Messung", i + 1)
          time.sleep(0.5)
      ```
      ```text
      Messung 1
      Messung 2
      ```
    tests: [{p: 2, t: 1}]

  # ---------------------------------------------------------------- strftime
  - typ: code_ausgabe
    aufgaben: ["2.8", "5.5"]
    deckt: [c10.strftime]
    frage: |-
      Was gibt der Code aus? (Ergänzung: `datetime.datetime(…)` erzeugt hier einen festen Zeitpunkt statt der aktuellen Zeit.)
      ```python
      import datetime
      zeit = datetime.datetime(2026, 11, 9, 7, 5, 30)
      print(zeit.strftime("%H:%M Uhr, %d.%m."))
      ```
    antwort: |-
      ```text
      07:05 Uhr, 09.11.
      ```
      Alle Angaben werden zweistellig (mit führender Null) ausgegeben; Sekunden und Jahr fehlen, weil `%S` und `%Y` nicht im Format stehen. Alles andere im Format (`Uhr, ` und die Punkte) wird unverändert übernommen.
    tests: [{p: 1, t: 1}]

  - typ: begriff
    aufgaben: ["2.8", "5.5"]
    deckt: [c10.strftime]
    frage: |-
      Wofür stehen in einem strftime-Format `%d`, `%m`, `%Y`, `%H`, `%M` und `%S`?
    antwort: |-
      | Platzhalter | Bedeutung |
      |---|---|
      | `%d` | Tag (01–31) |
      | `%m` | Monat (01–12) |
      | `%Y` | Jahr, vierstellig |
      | `%H` | Stunde (00–23) |
      | `%M` | Minute |
      | `%S` | Sekunde |

  - typ: code_luecke
    aufgaben: ["2.9"]
    deckt: [c10.strftime]
    frage: |-
      Ergänze das Format für einen Zeitstempel im Dateinamen der Form `Jahr-Monat-Tag_StundeMinute` (z. B. `2026-10-28_1430`).
      ```python
      import time
      jetzt = time.localtime()
      zeit = time.strftime(___, jetzt)
      print(zeit)
      ```
    antwort: |-
      `"%Y-%m-%d_%H%M"`
      ```python
      import time
      jetzt = time.localtime()
      zeit = time.strftime("%Y-%m-%d_%H%M", jetzt)
      print(zeit)
      ```
    tests: [{p: 2}]

  - typ: code_fehler
    aufgaben: ["2.8"]
    deckt: [c10.strftime]
    frage: |-
      Gewünscht ist das Datum mit **vierstelligem** Jahr. Was gibt der Code aus, und was ist falsch? (Ergänzung: `datetime.datetime(…)` erzeugt hier einen festen Zeitpunkt.)
      ```python
      import datetime
      zeit = datetime.datetime(2026, 4, 15, 9, 0)
      print(zeit.strftime("%d.%m.%y"))
      ```
    antwort: |-
      ```text
      15.04.26
      ```
      Kleines `%y` steht für das zweistellige Jahr (so in Aufg. 2.8). Richtig: `%Y` → `15.04.2026`.
    tests: [{p: 1, t: 1}]

  # ---------------------------------------------------------------- datetime
  - typ: code_schreiben
    aufgaben: ["5.5"]
    deckt: [c10.datetime]
    frage: |-
      Gib eine Statuszeile im Format `Pumpe 2 aus (14:30)` mit der **aktuellen** Uhrzeit aus. Nutze `datetime`.
    antwort: |-
      ```python
      import datetime
      jetzt = datetime.datetime.now()
      uhrzeit = jetzt.strftime("%H:%M")
      print(f"Pumpe 2 aus ({uhrzeit})")
      ```
    tests: [{p: 1}]

  - typ: unterschied
    aufgaben: ["2.8", "5.5"]
    deckt: [c10.datetime, c10.strftime]
    frage: |-
      Was ist der Unterschied zwischen `time.strftime(format, time.localtime())` und `datetime.datetime.now().strftime(format)`?
    antwort: |-
      Beide liefern die aktuelle Zeit als formatierten Text.
      - `time`: strftime ist eine **Funktion** des Moduls, die Zeit wird als zweites Argument übergeben.
      - `datetime`: `now()` liefert ein Zeit**objekt**; strftime ist eine **Methode** dieses Objekts.

  - typ: code_luecke
    aufgaben: ["6.2"]
    deckt: [c10.datetime]
    frage: |-
      Ergänze den Aufruf, der den **aktuellen** Zeitpunkt liefert.
      ```python
      import datetime
      jetzt = datetime.datetime.___
      print(jetzt.strftime("%Y-%m-%d"))
      ```
    antwort: |-
      `now()` (Ergänzung: `today()` liefert hier dasselbe)
      ```python
      import datetime
      jetzt = datetime.datetime.now()
      print(jetzt.strftime("%Y-%m-%d"))
      ```
    tests: [{p: 2}]

  # ---------------------------------------------------------------- pip
  - typ: begriff
    aufgaben: ["2.5"]
    deckt: [c10.pip]
    frage: |-
      Wie installierst du direkt in einem Jupyter-Notebook eine Bibliothek, die nicht vorinstalliert ist (z. B. qrcode)?
    antwort: |-
      Mit `!pip install qrcode` in einer Code-Zelle (mit Anaconda alternativ `!conda install qrcode`). `math`, `random` und `time` sind schon vorinstalliert und brauchen nur `import`.

  - typ: unterschied
    aufgaben: ["2.5"]
    deckt: [c10.pip]
    frage: |-
      Was ist der Unterschied zwischen `pip install qrcode` und `import qrcode`?
    antwort: |-
      - `pip install`: lädt die Bibliothek herunter und installiert sie **einmalig** in der Python-Umgebung.
      - `import`: macht die installierte Bibliothek **im Programm** verfügbar – bei jedem Programmstart nötig.

  # ---------------------------------------------------------------- qrcode
  - typ: code_schreiben
    aufgaben: ["2.6"]
    deckt: [c10.qrcode]
    frage: |-
      Erzeuge im Notebook aus dem Text `"ID: 1042"` einen QR-Code und zeige ihn an.
    antwort: |-
      ```python
      import qrcode
      bild = qrcode.make("ID: 1042")
      display(bild)
      ```
      `display()` steht in Jupyter-Notebooks automatisch zur Verfügung.
    tests: [{p: 1, jupyter: true}]

  - typ: begriff
    aufgaben: ["2.6"]
    deckt: [c10.qrcode]
    frage: |-
      Was liefert `qrcode.make(text)`?
    antwort: |-
      Ein **Bild** des QR-Codes, der den Text enthält (im Notebook anzeigen mit `display(bild)`).
  - typ: code_luecke
    aufgaben: ["2.6", "2.8"]
    deckt: [c10.qrcode]
    frage: |-
      Der QR-Code soll den Text in **zwei Zeilen** enthalten. Ergänze die Lücke im String.
      ```python
      import qrcode
      nr = 3
      text = f"Maschine {nr}___Status: OK"
      bild = qrcode.make(text)
      print(text)
      ```
    antwort: |-
      `\n` (Zeilenumbruch im String; alternativ den Text in dreifachen Anführungszeichen über zwei Zeilen schreiben)
      ```python
      import qrcode
      nr = 3
      text = f"Maschine {nr}\nStatus: OK"
      bild = qrcode.make(text)
      print(text)
      ```
      ```text
      Maschine 3
      Status: OK
      ```
    tests: [{p: 2, t: 1}]
