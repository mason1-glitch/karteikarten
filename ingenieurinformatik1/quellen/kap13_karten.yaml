  # ---------------------------------------------------------------- Stil
  - typ: code_ausgabe
    folien: [206]
    aufgaben: ["2.1"]
    deckt: [c13.stil]
    frage: |-
      Wie sieht die gezeichnete Weg-Zeit-Linie aus?
      ```python
      import matplotlib.pyplot as plt
      t = [1, 2, 3, 4]  # Zeit in s
      s = [2, 4, 6, 8]  # Weg in m
      plt.plot(t, s, "r--o")
      plt.show()
      ```
    antwort: |-
      **Rot** (`r`), **gestrichelt** (`--`), mit **Kreis-Markern** (`o`) an den Messpunkten:
      {{bild:plot_formatstring|Rote gestrichelte Linie mit Kreismarkern}}
    tests: [{p: 1}]

  - typ: code_luecke
    folien: [206]
    deckt: [c13.stil]
    frage: |-
      Der Ausschuss pro Tag soll als grüne, **gestrichelte** Linie mit Kreis-Markern erscheinen. Ergänze den Linienstil.
      ```python
      import matplotlib.pyplot as plt
      tag = [1, 2, 3]
      ausschuss = [3, 5, 4]
      plt.plot(tag, ausschuss, color="green",
               linestyle=___, marker="o")
      plt.show()
      ```
    antwort: |-
      `"--"` (gleichwertig: `"dashed"`)
      ```python
      import matplotlib.pyplot as plt
      tag = [1, 2, 3]
      ausschuss = [3, 5, 4]
      plt.plot(tag, ausschuss, color="green",
               linestyle="--", marker="o")
      plt.show()
      ```
    tests: [{p: 2}]

  # ---------------------------------------------------------------- Beschriftung
  - typ: code_luecke
    folien: [205]
    aufgaben: ["2.1"]
    deckt: [c13.beschriftung]
    frage: |-
      Ergänze die Funktion, die die **x-Achse** beschriftet.
      ```python
      import matplotlib.pyplot as plt
      plt.plot([8, 9, 10], [72, 78, 81])
      plt.___("Uhrzeit (h)")
      plt.show()
      ```
    antwort: |-
      `xlabel` (die y-Achse entsprechend mit `ylabel`)
      ```python
      import matplotlib.pyplot as plt
      plt.plot([8, 9, 10], [72, 78, 81])
      plt.xlabel("Uhrzeit (h)")
      plt.show()
      ```
    tests: [{p: 2}]

  - typ: code_fehler
    folien: [205]
    deckt: [c13.beschriftung]
    frage: |-
      Was ist an der Beschriftung dieses Diagramms falsch?
      ```python
      import matplotlib.pyplot as plt
      zeit = [0, 10, 20]
      temp = [20, 35, 48]
      plt.plot(zeit, temp)
      plt.xlabel("Temperatur (°C)")
      plt.ylabel("Zeit (s)")
      plt.show()
      ```
    antwort: |-
      Die Achsen sind vertauscht beschriftet: Das **erste** Argument von `plt.plot` (`zeit`) liegt auf der x-Achse. Richtig: `plt.xlabel("Zeit (s)")` und `plt.ylabel("Temperatur (°C)")`.
    tests: [{p: 1}]

  - typ: code_schreiben
    folien: [205]
    aufgaben: ["2.1", "6.1"]
    deckt: [c13.beschriftung]
    frage: |-
      Zeichne die Punkte `[8, 9, 10]` / `[72, 78, 81]` als Linie mit Titel `Temperaturverlauf`, Achsenbeschriftungen `Uhrzeit (h)` und `Temperatur (°C)` sowie einem Gitternetz.
    antwort: |-
      ```python
      import matplotlib.pyplot as plt
      plt.plot([8, 9, 10], [72, 78, 81])
      plt.title("Temperaturverlauf")
      plt.xlabel("Uhrzeit (h)")
      plt.ylabel("Temperatur (°C)")
      plt.grid(True)
      plt.show()
      ```
    tests: [{p: 1}]

  # ---------------------------------------------------------------- Legende
  - typ: code_schreiben
    folien: [205]
    aufgaben: ["2.1"]
    deckt: [c13.legend]
    frage: |-
      Zeichne Soll- und Ist-Temperatur in **ein** Diagramm – `[60, 60, 60]` als „Soll“ und `[52, 58, 61]` als „Ist“ über `zeit = [0, 5, 10]` – und zeige eine Legende an.
    antwort: |-
