  # ---------------------------------------------------------------- Balken
  - typ: code_ausgabe
    folien: [207]
    aufgaben: ["6.5"]
    deckt: [c13.bar]
    frage: |-
      Welches Diagramm entsteht?
      ```python
      import matplotlib.pyplot as plt
      hallen = ["Halle 1", "Halle 2", "Halle 3"]
      verbrauch = [120, 85, 140]
      plt.bar(hallen, verbrauch)
      plt.title("Stromverbrauch (MWh)")
      plt.show()
      ```
    antwort: |-
      Ein **Balkendiagramm** mit drei Balken der Höhe 120, 85 und 140; die Kategorien (Hallen) stehen an der x-Achse.
      {{bild:plot_balken_hallen|Balkendiagramm Stromverbrauch je Halle}}
    tests: [{p: 1}]

  - typ: code_luecke
    folien: [207]
    aufgaben: ["6.1"]
    deckt: [c13.bar]
    frage: |-
      Die Stückzahlen der drei Schichten sollen als Diagramm mit **senkrechten Balken (Säulen)** erscheinen. Ergänze die Funktion.
      ```python
      import matplotlib.pyplot as plt
      schichten = ["Früh", "Spät", "Nacht"]
      stueck = [410, 385, 220]
      plt.___(schichten, stueck)
      plt.show()
      ```
    antwort: |-
      `bar` (Ergänzung: `barh` zeichnet waagerechte Balken)
      ```python
      import matplotlib.pyplot as plt
      schichten = ["Früh", "Spät", "Nacht"]
      stueck = [410, 385, 220]
      plt.bar(schichten, stueck)
      plt.show()
      ```
    tests: [{p: 2}]

  - typ: code_schreiben
    folien: [207]
    aufgaben: ["6.5"]
    deckt: [c13.bar]
    frage: |-
      `df` hat eine Spalte `Status` (z. B. „OK“, „Ausschuss“). Zeichne ein Balkendiagramm mit der **Anzahl der Teile je Status**.
    antwort: |-
      ```python
      import pandas as pd
      import matplotlib.pyplot as plt
      status = ["OK", "OK", "Ausschuss"]
      df = pd.DataFrame({"Status": status})
      anzahl = df["Status"].value_counts()
      plt.bar(anzahl.index, anzahl.values)
      plt.show()
      ```
      Zeile 3–4 erzeugen nur Beispieldaten. `value_counts()` zählt je Status; `index` = Status-Werte, `values` = Anzahlen.
    tests: [{p: 1}]

  # ---------------------------------------------------------------- Histogramm
  - typ: begriff
    folien: [207]
    aufgaben: ["6.5"]
    deckt: [c13.hist]
    frage: |-
      Was zeigt ein **Histogramm**, und was legt `bins` fest?
    antwort: |-
      Die **Häufigkeitsverteilung** von Messwerten: Der Wertebereich wird in Klassen eingeteilt, die Balkenhöhe zeigt, wie viele Werte in jede Klasse fallen. `bins` ist die Anzahl dieser Klassen (Balken).

