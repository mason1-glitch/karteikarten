  # ---------------------------------------------------------------- Streudiagramm
  - typ: unterschied
    folien: [205]
    aufgaben: ["6.5"]
    deckt: [c13.scatter]
    frage: |-
      Was ist der Unterschied zwischen `plt.plot(x, y)` und `plt.scatter(x, y)`?
    antwort: |-
      - `plot`: verbindet die Punkte zu einer **Linie** (Verlauf, z. B. über die Zeit).
      - `scatter`: zeichnet nur **einzelne Punkte** – geeignet, um den Zusammenhang zweier Messgrößen zu zeigen.

  - typ: code_schreiben
    aufgaben: ["6.5"]
    deckt: [c13.scatter]
    frage: |-
      Stelle `drehzahl = [1000, 2000, 3000]` (x) gegen `vibration = [0.8, 1.5, 2.9]` (y) als **Streudiagramm** mit Achsenbeschriftung dar.
    antwort: |-
      ```python
      import matplotlib.pyplot as plt
      drehzahl = [1000, 2000, 3000]
      vibration = [0.8, 1.5, 2.9]
      plt.scatter(drehzahl, vibration)
      plt.xlabel("Drehzahl (1/min)")
      plt.ylabel("Schwingung (mm/s)")
      plt.show()
      ```
    tests: [{p: 1}]

  # ---------------------------------------------------------------- Subplots
  - typ: code_schreiben
    aufgaben: ["6.5"]
    deckt: [c13.subplots]
    frage: |-
      Zeige ein Liniendiagramm und ein Balkendiagramm **nebeneinander** in einer Abbildung, jeweils mit eigenem Titel.
    antwort: |-
      ```python
      import matplotlib.pyplot as plt
      fig, (ax1, ax2) = plt.subplots(1, 2)
      ax1.plot([0, 5, 10], [20, 45, 60])
      ax1.set_title("Aufheizkurve")
      ax2.bar(["Ofen 1", "Ofen 2"], [850, 910])
      ax2.set_title("Höchsttemperatur")
      plt.tight_layout()
      plt.show()
      ```
      `subplots(1, 2)`: 1 Zeile, 2 Spalten; `tight_layout()` verhindert Überlappungen.
    tests: [{p: 1}]

  - typ: unterschied
    aufgaben: ["6.5"]
    deckt: [c13.subplots]
    frage: |-
      Was ist der Unterschied zwischen `plt.title("…")` und `ax1.set_title("…")`?
    antwort: |-
      - `plt.title`: beschriftet das **aktuelle** Diagramm.
      - `ax1.set_title`: beschriftet gezielt das Teildiagramm `ax1` aus `plt.subplots()`. Entsprechend `ax1.set_xlabel`, `ax1.set_ylabel`.

  # ---------------------------------------------------------------- savefig
  - typ: code_fehler
    folien: [208]
    aufgaben: ["6.5"]
    deckt: [c13.savefig]
    frage: |-
      Die gespeicherte Datei `stueckzahl.png` ist leer. Warum?
      ```python
      import matplotlib.pyplot as plt
      plt.bar(["Linie 1", "Linie 2"], [340, 410])
      plt.show()
      plt.savefig("stueckzahl.png")
      ```
    antwort: |-
      Nach `plt.show()` ist die Grafik geschlossen (F. 208); `savefig` speichert dann ein leeres Bild. Richtig: erst `plt.savefig(...)`, dann `plt.show()`.
    tests: [{p: 1}]

  - typ: code_luecke
    folien: [208]
    aufgaben: ["6.5"]
    deckt: [c13.savefig]
    frage: |-
      Das Diagramm soll mit **300 dpi** als PNG gespeichert werden. Ergänze den Parameter.
      ```python
      import matplotlib.pyplot as plt
      plt.hist([1, 2, 2, 3, 3, 3], bins=3)
      plt.savefig("verteilung.png", ___=300)
      plt.show()
      ```
    antwort: |-
      `dpi`
      ```python
      import matplotlib.pyplot as plt
      plt.hist([1, 2, 2, 3, 3, 3], bins=3)
      plt.savefig("verteilung.png", dpi=300)
      plt.show()
      ```
      Die Datei landet im **aktuellen Arbeitsordner** (in Jupyter meist der Ordner des Notebooks). Das Skript (F. 208) sagt „im Speicherort des Programmskripts“ – das stimmt nur, wenn das Programm aus seinem eigenen Ordner gestartet wird.
    tests: [{p: 2}]

  # ---------------------------------------------------------------- gleiche Länge
  - typ: code_fehler
    folien: [205]
    deckt: [c13.laenge]
    frage: |-
      Welche Fehlermeldung erscheint?
      ```python
      import matplotlib.pyplot as plt
      zeit = [0, 1, 2]
      temp = [20, 25]
      plt.plot(zeit, temp)
      ```
    antwort: |-
      ```text
      ValueError: x and y must have same first dimension, but have shapes (3,) and (2,)
      ```
      Zu jedem Zeitpunkt (x) gehört genau ein Temperaturwert (y) – beide Listen müssen gleich lang sein.
    tests: [{p: 1, t: 1}]

  - typ: begriff
    folien: [205]
    deckt: [c13.laenge]
    frage: |-
      Welche Bedingung müssen die Listen `x` und `y` bei `plt.plot(x, y)` erfüllen?
    antwort: |-
      Sie müssen **gleich viele** Werte haben: `len(x) == len(y)`.

  # ---------------------------------------------------------------- plotly
  - typ: code_luecke
    aufgaben: ["6.4"]
    deckt: [c13.plotly]
    frage: |-
      Ergänze die plotly-Funktion, die den Drehzahlverlauf als **Liniendiagramm** aus dem DataFrame zeichnet.
      ```python
      import pandas as pd
      import plotly.express as px
      df = pd.DataFrame({"Zeit": [0, 10, 20],
                         "Drehzahl": [0, 1500, 3000]})
      fig = px.___(df, x="Zeit", y="Drehzahl")
      fig.show()
      ```
    antwort: |-
      `line`
      ```python
      import pandas as pd
      import plotly.express as px
      df = pd.DataFrame({"Zeit": [0, 10, 20],
                         "Drehzahl": [0, 1500, 3000]})
      fig = px.line(df, x="Zeit", y="Drehzahl")
      fig.show()
      ```
      Bei plotly gibt man den DataFrame und die **Spaltennamen** an.
    tests: [{p: 2}]

  - typ: code_schreiben
    folien: [209]
    aufgaben: ["6.4"]
    deckt: [c13.plotly]
    frage: |-
      Lies `pruefstand.csv` (Spalten `Motor`, `Drehzahl`, `Drehmoment`, `Temperatur`) ein und erstelle einen **3D-Streuplot** (x = Drehzahl, y = Drehmoment, z = Temperatur), die Punkte **nach Motor eingefärbt**.
    antwort: |-
      ```python
      import pandas as pd
      import plotly.express as px
      df = pd.read_csv("pruefstand.csv")
      fig = px.scatter_3d(df, x="Drehzahl",
                          y="Drehmoment",
                          z="Temperatur",
                          color="Motor")
      fig.show()
      ```
    tests: [{p: 1, dateien: {"pruefstand.csv": "Motor,Drehzahl,Drehmoment,Temperatur\nM1,1500,120,65\nM2,3000,95,80\n"}}]

  - typ: unterschied
    folien: [204, 209]
    aufgaben: ["6.4", "6.5"]
    deckt: [c13.plotly]
    frage: |-
      Was ist der Unterschied zwischen Diagrammen aus **matplotlib** und aus **plotly express**?
    antwort: |-
      - matplotlib: der verbreitete Klassiker (F. 204) für Linie, Balken, Histogramm; Daten meist als Listen, im Notebook als **festes Bild**.
      - plotly express: **interaktive** Diagramme im Notebook (zoomen, drehen, Werte beim Überfahren), direkt aus einem DataFrame über Spaltennamen, z. B. 3D-Streuplots mit `px.scatter_3d`.

  - typ: begriff
    aufgaben: ["6.4"]
    deckt: [c13.plotly]
    frage: |-
      Wie änderst du bei einem fertigen plotly-Diagramm `fig` nachträglich den Titel?
    antwort: |-
      Mit `fig.update_layout(title="Neuer Titel")` – danach `fig.show()`.
