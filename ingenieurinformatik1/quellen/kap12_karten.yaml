inhalte:
  - {id: c12.csv, gewicht: 1, folie: "198", aufgaben: "6.3", text: "CSV-Format: ein Datensatz pro Zeile, Trennzeichen, Kopfzeile"}
  - {id: c12.read_csv, gewicht: 2, folie: "199–201", aufgaben: "6.3–6.5", text: "pd.read_csv() → DataFrame; Spaltennamen exakt (KeyError)"}
  - {id: c12.dataframe, gewicht: 2, folie: "200", aufgaben: "6.3, 6.4", text: "DataFrame aus Dictionary, Spalte df[\"Name\"], len(df), head()"}
  - {id: c12.filter, gewicht: 2, folie: "200", aufgaben: "6.3–6.5", text: "Zeilen filtern: df[df[\"Spalte\"] > wert]"}
  - {id: c12.sort, gewicht: 2, folie: "", aufgaben: "6.3, 6.4", text: "sort_values(by=…, ascending=…)"}
