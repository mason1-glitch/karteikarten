    antwort: |-
      - **Projektumsetzung** = Zulassung zum Kolloquium (**Ja/Nein**)
      - **Endnote** aus dem Abschlusskolloquium – als **Einzelnote**
      - Gefragt wird zu **deinem Quellcode**; deshalb muss im Code per **Kommentar** gekennzeichnet sein, welcher Anteil zu wem gehört.

  - typ: fakt
    quelle: "Laboraufgabe F. 2–3; Labor-Einführung"
    deckt: [l1.bewertung]
    frage: |-
      Bis wann und wohin wird das Programm abgegeben, und wann ist das Kolloquium?
    antwort: |-
      - Abgabe: **29.11.2026, 23:59**, Upload in den **Stud.IP-Gruppenordner**
      - Kolloquium: **KW49/KW50**, Pflichttermin (genauer Termin steht noch aus)
      - Eigene Planung: Code-Freeze Do 26.11., Upload Sa 28.11.

  - typ: aufzaehlung
    quelle: "Absprache mit dem Dozenten"
    deckt: [l1.dozent]
    frage: |-
      Welche **vier Punkte** hat der Dozent zur Laboraufgabe schon geklärt?
    antwort: |-
      1. Kleine **Ergänzungen** außerhalb des Stoffs sind erlaubt, **wenn du sie erklären kannst**.
      2. **Kommentarzeilen** werden im Kolloquium **nicht bewertet**.
      3. Die **600 Zeilen** sind nur ein **Richtwert**.
