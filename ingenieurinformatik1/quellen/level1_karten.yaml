  - typ: falle
    quelle: "Absprache mit dem Dozenten"
    deckt: [l1.dozent, l1.bewertung]
    frage: |-
      Dein Code steckt voller guter Kommentare. Was bringen sie dir im Kolloquium – und was nicht?
    antwort: |-
      Kommentare machen den Code lesbar und kennzeichnen deinen Anteil (Pflicht). **Bewertet werden sie nicht:** Punkte gibt es nur, wenn du den **Code selbst** erklären kannst – jede Zeile, jede Ergänzung, ohne vorzulesen.

  # ---------------------------------------------------------------- Aufbau und Schnittstelle
  - typ: begriff
    quelle: "Level-Konzept"
    deckt: [l1.aufbau]
    frage: |-
      Wie ist dein Level aufgebaut, und was bekommt `main.py` zurück?
    antwort: |-
      - Eine Funktion `level_dschungel_reflexe(spieler)` steuert den Ablauf.
      - Jede Station ist eine eigene Funktion (Lianen-Sprung, Hängebrücke, Affen-Echo, Schlangen-Zauberformel, Treibsand-Raster), dazu Hilfsfunktionen.
      - Rückgabe: **`True`** (geschafft) oder **`False`**; `main.py` entscheidet damit, ob es weitergeht.

  - typ: code_schreiben
    quelle: "Level-Konzept"
    folien: [171, 180]
    deckt: [l1.aufbau, l1.return]
    frage: |-
      Schreib das Gerüst der Level-Funktion: Sie bekommt `spieler`, ruft `lianen_sprung(spieler)` und `haengebruecke(spieler)` auf und gibt zurück, ob noch Leben übrig sind.
    antwort: |-
      ```python
      def level_dschungel_reflexe(spieler):
          """Spielt das Level; True = geschafft."""
          lianen_sprung(spieler)
          haengebruecke(spieler)
          return spieler["leben"] > 0
      ```
      Der Vergleich `> 0` ist schon ein `bool` – ein `if` mit `return True`/`return False` ist nicht nötig.
    tests: [{p: 1}]

  - typ: code_ausgabe
    folien: [182]
    deckt: [l1.spieler]
    frage: |-
      Was gibt der Code aus?
      ```python
      def leben_abziehen(spieler):
          spieler["leben"] -= 1

      spieler = {"name": "Max", "leben": 3}
      leben_abziehen(spieler)
      leben_abziehen(spieler)
      print(spieler["leben"])
      ```
    antwort: |-
      ```text
      1
      ```
      Die Funktion bekommt **dasselbe** Dictionary wie der Aufrufer; was sie darin ändert, sieht auch `main.py`. Ergänzung: Das Skript zeigt nur die Neuzuweisung (F. 182), nicht das Ändern eines Dictionarys.
    tests: [{p: 1, t: 1}]

  - typ: unterschied
    folien: [182]
    deckt: [l1.spieler, l1.global]
    frage: |-
      Warum bleibt hier `leben` bei 3, obwohl die Funktion 1 abzieht?
      ```python
      def leben_abziehen(leben):
          leben -= 1

      leben = 3
      leben_abziehen(leben)
      print(leben)
      ```
    antwort: |-
      ```text
      3
      ```
      Der Parameter `leben` ist eine **lokale** Variable der Funktion; `leben -= 1` weist ihr einen neuen Wert zu, die Variable außen bleibt unberührt (F. 182). Beim `spieler`-Dictionary wird dagegen der **Inhalt** des gemeinsamen Dictionarys geändert.
    tests: [{p: 1, t: 1}]

  - typ: begruenden
    folien: [183]
    quelle: "Level-Konzept"
    deckt: [l1.spieler, l1.global]
    frage: |-
      Warum übergibst du `spieler` als Parameter, statt in jeder Station `global spieler` zu schreiben?
    antwort: |-
      - Die **Schnittstelle** ist sichtbar: `level_dschungel_reflexe(spieler)` zeigt, womit das Level arbeitet.
      - Das Level lässt sich mit einem eigenen Test-Dictionary aufrufen.
      - `global` braucht man nur, um einer äußeren Variablen einen **neuen Wert zuzuweisen** (F. 183). Den Inhalt eines übergebenen Dictionarys darf die Funktion auch so ändern.

  - typ: code_ausgabe
    folien: [183]
    deckt: [l1.global]
    frage: |-
      Was gibt der Code aus?
      ```python
      punkte = 0

      def punkte_geben():
          global punkte
          punkte += 10

      punkte_geben()
      print(punkte)
      ```
    antwort: |-
      ```text
      10
      ```
      `global punkte` sagt: Gemeint ist die Variable außerhalb der Funktion – die Zuweisung wirkt auch dort.
    tests: [{p: 1, t: 1}]

  - typ: code_fehler
    folien: [182, 183]
    deckt: [l1.global]
    frage: |-
      Der Code bricht ab. Warum, und wie behebst du es?
      ```python
      punkte = 0

      def punkte_geben():
          punkte += 10

      punkte_geben()
      ```
    antwort: |-
      `punkte += 10` ist eine Zuweisung → `punkte` gilt in der Funktion als **lokal**, hat dort aber noch keinen Wert. Python meldet einen `UnboundLocalError` (Ergänzung: Name der Meldung nicht im Stoff).
      Lösung: `global punkte` als erste Zeile in die Funktion – oder `punkte` als Parameter übergeben und mit `return` zurückgeben.
    tests: [{p: 1, abbruch: UnboundLocalError}]

  # ---------------------------------------------------------------- Rückgabewerte
  - typ: code_ausgabe
    folien: [173]
    deckt: [l1.return]
    frage: |-
      Was gibt der Code aus?
      ```python
      def geschafft(leben):
          return leben > 0

      print(geschafft(2))
      print(geschafft(0))
      ```
    antwort: |-
      ```text
      True
      False
      ```
      Ein Vergleich liefert einen Wahrheitswert (`bool`); `return` gibt ihn direkt zurück.
    tests: [{p: 1, t: 1}]

  - typ: falle
    folien: [173, 180]
    deckt: [l1.return]
    frage: |-
      Was gibt der Code aus – und warum ist das für `main.py` gefährlich?
      ```python
      def station(leben):
          if leben > 0:
              return True

      print(station(1))
      print(station(0))
      ```
    antwort: |-
      ```text
      True
      None
      ```
      Wird kein `return` erreicht, liefert eine Funktion **`None`**. `if None:` verhält sich wie `False`, aber wer `== False` prüft, liegt daneben. Darum jeden Weg mit einem `return` beenden.
    tests: [{p: 1, t: 1}]

  - typ: code_luecke
    quelle: "Level-Konzept"
    folien: [112]
    deckt: [l1.return, l1.aufbau]
    frage: |-
      Ergänze `main.py`: Nur wenn das Level geschafft ist, soll die Ziffer erscheinen.
      ```python
      ___ level_dschungel_reflexe(spieler):
          print("Zweite Ziffer: 7")
      ___:
          print("Game over.")
      ```
    antwort: |-
      ```python
      if level_dschungel_reflexe(spieler):
          print("Zweite Ziffer: 7")
      else:
          print("Game over.")
      ```
      Der Rückgabewert `True`/`False` ist selbst die Bedingung – `== True` ist überflüssig.
    tests: [{p: 2, abbruch: NameError}]

  # ---------------------------------------------------------------- Definieren und aufrufen
  - typ: code_fehler
    folien: [175]
    deckt: [l1.definieren]
    frage: |-
      Welche Fehlermeldung kommt, und warum?
      ```python
      level_dschungel_reflexe({"leben": 3})

      def level_dschungel_reflexe(spieler):
          print("Los geht's!")
      ```
    antwort: |-
      `NameError: name 'level_dschungel_reflexe' is not defined` – eine Funktion muss **erst definiert, dann aufgerufen** werden (F. 175). Python liest die Datei von oben nach unten.
    tests: [{p: 1, abbruch: NameError}]

  - typ: code_ausgabe
    folien: [178]
    deckt: [l1.definieren]
    frage: |-
      Was gibt der Code aus?
      ```python
      def lianen_sprung():
          print("Sprung!")

      def haengebruecke():
          lianen_sprung()
          print("Brücke!")

      haengebruecke()
      ```
    antwort: |-
      ```text
      Sprung!
      Brücke!
      ```
      `def` definiert nur. Erst der Aufruf `haengebruecke()` springt in die Funktion, die wiederum `lianen_sprung()` aufruft; danach geht es hinter der Aufrufstelle weiter (F. 178). Innerhalb einer Funktion darf eine **später** definierte Funktion aufgerufen werden, solange sie beim Aufruf existiert.
    tests: [{p: 1, t: 1}]

  - typ: begriff
    folien: [172, 173, 174]
    deckt: [l1.begriffe]
    frage: |-
      Ordne aus deinem Level je ein Beispiel zu: **Prozedur, Funktion, Methode**.
    antwort: |-
      | Begriff | Merkmal | Beispiel |
      |---|---|---|
      | Prozedur | kein Rückgabewert (Python liefert dann `None`) | `raster_zeigen(raster)` |
      | Funktion | liefert mit `return` einen Wert | `reaktion_messen(0.8)` → Zeit |
      | Methode | gehört zu einem Objekt, Aufruf mit Punkt | `eintraege.append(…)`, `datei.write(…)` |

      Heute sagt man meist zu allem „Funktion“ (F. 172).

  - typ: code_luecke
    aufgaben: ["5.5"]
    deckt: [l1.begriffe]
    frage: |-
      Ergänze den einzeiligen Docstring an der richtigen Stelle.
      ```python
      def signal_zeigen():
          ___
          print("SPRING!")
      ```
    antwort: |-
      ```python
      def signal_zeigen():
          """Gibt das Sprungsignal aus."""
          print("SPRING!")
      ```
      Der Docstring ist die **erste Zeile im Funktionsrumpf** und beschreibt, was die Funktion tut – und, falls sie etwas zurückgibt, was.
    tests: [{p: 2}]

  # ---------------------------------------------------------------- Modul und Import
  - typ: begriff
    quelle: "Laborfolie IDE/venv F. 15"
    deckt: [l1.modul]
    frage: |-
      Was ist ein **Modul**, und wie ruft `main.py` dein Level auf, wenn es in `level_dschungel.py` steht?
    antwort: |-
      Ein Modul ist eine **Python-Datei, die in Skripte oder andere Module importiert werden kann**.
      ```python
      import level_dschungel

      spieler = {"name": "Max", "leben": 3}
      level_dschungel.level_dschungel_reflexe(spieler)
      ```
    tests: [{p: 1, dateien: {"level_dschungel.py": "def level_dschungel_reflexe(spieler):\n    return True\n"}}]

  - typ: code_ausgabe
    quelle: "Laborfolie IDE/venv F. 15"
    deckt: [l1.modul]
    frage: |-
      `level_dschungel.py`:
      ```python
      def level_dschungel_reflexe(spieler):
          return True

      print("Test: Level geladen")
      ```
      Was gibt `main.py` aus?
      ```python
      import level_dschungel

      print("Spiel startet")
      ```
    antwort: |-
      ```text
      Test: Level geladen
      Spiel startet
      ```
      `import` führt den Code auf oberster Ebene der Datei **sofort aus**. Testaufrufe gehören deshalb nicht dauerhaft in die Level-Datei. Ergänzung: `if __name__ == "__main__":` würde das lösen, ist aber nicht im Stoff.
    tests: [{p: 1}, {p: 2, t: 1, dateien: {"level_dschungel.py": "def level_dschungel_reflexe(spieler):\n    return True\n\nprint(\"Test: Level geladen\")\n"}}]

  # ---------------------------------------------------------------- Konventionen und Kennzeichnung
  - typ: code_fehler
    folien: [58]
    quelle: "Code-Leitfaden 2.1, 2.6"
    deckt: [l1.konventionen]
    frage: |-
      Der Code läuft. Welche **Code-Conventions** verletzt er?
      ```python
      def ZeitMessen(Zeitlimit):
          if(Zeitlimit<1): print("kurz")
          größte_Zeit=Zeitlimit*2
          return größte_Zeit
      ```
    antwort: |-
      - Namen: **snake_case** und klein (`zeit_messen`, `zeitlimit`), **keine Umlaute/ß** (`groesste_zeit`, F. 58)
      - Leerzeichen um Operatoren und `=`: `zeitlimit < 1`, `zeitlimit * 2`
      - Rumpf von `if` in eine **eigene, eingerückte Zeile**; Klammern um die Bedingung weglassen
    tests: [{p: 1}]

  - typ: code_schreiben
    aufgaben: ["2.1"]
    quelle: "Laboraufgabe F. 3"
    deckt: [l1.konventionen, l1.bewertung]
    frage: |-
      Schreib den Kopf deiner Level-Datei und die Kennzeichnung über einer Station so, dass klar ist, dass der Code von dir stammt.
    antwort: |-
      ```python
      # Programm: Escape-Room - Level 2 "Dschungel-Reflexe"
      # Autor: [Vorname Nachname]
      # Datum: 26.11.2026

      # === Station 2: Hängebrücke (Autor: [Name]) ===
      ```
      Kennzeichnung per Kommentar verlangt die Laboraufgabe (F. 3); der Kopf folgt Aufg. 2.1.
    tests: [{p: 1}]

  # ---------------------------------------------------------------- Grundstrukturen und PAP
  - typ: anwendung
    folien: [109]
    deckt: [l1.grundstrukturen]
    frage: |-
      Nenne die vier **Grundstrukturen** eines Programms mit je einem Beispiel aus deinem Level.
    antwort: |-
      | Grundstruktur | Beispiel |
      |---|---|
      | sequentiell | `start = time.time()` – Anweisungen nacheinander |
      | auswählend | `if reaktion < 0.1:` Fehlstart |
      | iterativ | `for runde in range(1, 4):` |
      | springend | Funktionsaufruf `reaktion_messen(0.8)`, `return`, `break` |

  - typ: begriff
    quelle: "Ergänzung: DIN 66001 (PAP-Folien KW43 nicht im Projekt)"
    deckt: [l1.grundstrukturen]
    frage: |-
      Welche Symbole hat ein **Programmablaufplan (PAP)**, und wofür steht jedes?
    antwort: |-
      Ergänzung (DIN 66001; mit den Laborfolien aus KW43 abgleichen):
      | Symbol | Bedeutung |
      |---|---|
      | Oval (abgerundet) | Start / Ende |
      | Rechteck | Anweisung, Berechnung |
      | Raute | Verzweigung (Ja/Nein) |
      | Parallelogramm | Ein-/Ausgabe |
      | Rechteck mit doppelten Seitenlinien | Unterprogramm (Funktionsaufruf) |
      | Pfeil | Ablaufrichtung |

  - typ: anwendung
    quelle: "Level-Konzept; Ergänzung: DIN 66001"
    deckt: [l1.grundstrukturen, l1.aufbau]
    frage: |-
      Erkläre den Ablauf der Reaktionsmessung anhand des PAP.
      {{bild:level_pap_reaktion|PAP der Funktion reaktion_messen}}
    antwort: |-
      1. Zufällige Wartezeit (`time.sleep`), dann Startzeit merken.
      2. Ein-/Ausgabe: „SPRING!“ zeigen, auf Enter warten.
      3. Reaktionszeit = jetzt − Start.
      4. Raute 1: unter 0,1 s → **Fehlstart**, Rückgabe `None`.
      5. Raute 2: über dem Zeitlimit → „zu langsam“, sonst „geschafft“.
      6. Rückgabe der Zeit, Ende.

  # ---------------------------------------------------------------- Nachträge aus dem Probe-Kolloquium
  - typ: falle
    folien: [119, 144]
    quelle: "Probe-Kolloquium"
    deckt: [l1.spieler]
    frage: |-
      Der Spieler darf das Level nach einem Misserfolg wiederholen. Was steht danach im Inventar – und wie verhinderst du das?
      ```python
      spieler = {"leben": 3, "inventar": []}
      for versuch in range(2):
          spieler["inventar"].append("Ziffer 7")
      print(spieler["inventar"])
      ```
    antwort: |-
      ```text
      ['Ziffer 7', 'Ziffer 7']
      ```
      Jeder Durchlauf hängt die Ziffer erneut an. Abhilfe: `if "Ziffer 7" not in spieler["inventar"]:` vor dem `append` (`not in`, F. 119). Ebenso: Leben nicht unter 0 fallen lassen und mit der Gruppe festlegen, ob Leben pro Level neu gelten.
    tests: [{p: 1, t: 1}]
