karten:
  # ---------------------------------------------------------------- Auftrag und Bewertung
  - typ: aufzaehlung
    quelle: "Laboraufgabe F. 2"
    deckt: [l1.pflicht]
    frage: |-
      Welche **drei Elemente** muss das Escape-Room-Programm laut Laboraufgabe enthalten, und welche **Wahl** kommt dazu?
    antwort: |-
      **Pflicht:**
      1. Ausnahmebehandlungen
      2. Kontrollstrukturen
      3. Funktionen

      **Dazu mindestens eines von:** Dictionaries, Rekursionen oder Sortieralgorithmen.

  - typ: anwendung
    quelle: "Level-Konzept"
    deckt: [l1.pflicht, l1.aufbau]
    frage: |-
      Zeig an **deinem Level**, wo jedes Pflicht- und Wahlelement steckt.
    antwort: |-
      | Element | Stelle im Level |
      |---|---|
      | Ausnahmebehandlung | Koordinaten im Treibsand-Raster (`ValueError`), Bestenliste laden (`FileNotFoundError`), Ton abspielen |
      | Kontrollstrukturen | Runden-Schleifen, Vergleich mit dem Zeitlimit, Abfrage der Leben |
      | Funktionen | eine je Station + Hilfsfunktionen |
      | Dictionary | Stationen-Einstellungen, Tierlaute, `spieler` |
      | Sortieralgorithmus | Bestenliste nach Reaktionszeit |

  - typ: fakt
