  - typ: code_luecke
    folien: [125]
    deckt: [c05.while]
    frage: |-
      Die Schleife soll laufen, **solange** die Temperatur kleiner als 25 ist. Ergänze den Operator.
      ```python
      temperatur = 20
      while temperatur ___ 25:
          temperatur += 2
      print(temperatur)
      ```
    antwort: |-
      `<`
      ```python
      temperatur = 20
      while temperatur < 25:
          temperatur += 2
      print(temperatur)
      ```
      ```text
      26
      ```
      20 → 22 → 24 → 26; erst bei 26 ist die Bedingung falsch.
    tests: [{p: 2, t: 1}]

  # ---------------------------------------------------------------- Endlosschleife
  - typ: code_fehler
    folien: [126]
    deckt: [c05.endlos]
    frage: |-
      Was passiert beim Ausführen, und welche Zeile fehlt?
      ```python
      zaehler = 0
      while zaehler < 5:
          print(zaehler)
      ```
    antwort: |-
      Eine **Endlosschleife**: Es wird immer wieder `0` ausgegeben, weil `zaehler` sich nie ändert und die Bedingung immer wahr bleibt. Im Rumpf fehlt das Hochzählen:
      ```python
      zaehler = 0
      while zaehler < 5:
          print(zaehler)
          zaehler += 1
      ```
    tests: [{p: 1, nicht_ausfuehren: "Endlosschleife (Absicht der Karte)"}, {p: 2}]

  - typ: begriff
    folien: [126]
    deckt: [c05.endlos]
    frage: |-
      Was ist eine **Endlosschleife**, und wodurch entsteht sie bei while typischerweise?
    antwort: |-
      Eine Schleife, die nie endet, weil ihre Bedingung immer wahr bleibt – meist, weil die Variable aus der Bedingung im Rumpf nicht verändert wird. (`while True:` ohne `break` ist absichtlich endlos.)

  - typ: code_fehler
    folien: [126]
    deckt: [c05.endlos]
    frage: |-
      Warum endet diese Schleife nie, und wie machst du sie sicher?
      ```python
      hub = 1
      while hub != 10:
          hub += 2
      ```
    antwort: |-
      `hub` nimmt nur ungerade Werte an (1, 3, 5, 7, 9, 11 …) und wird **nie genau** 10 – die Bedingung bleibt immer wahr. Sicherer ist ein Größenvergleich:
      ```python
      hub = 1
      while hub < 10:
          hub += 2
      print(hub)
      ```
      ```text
      11
      ```
    tests: [{p: 1, nicht_ausfuehren: "Endlosschleife (Absicht der Karte)"}, {p: 2, t: 1}]

  - typ: code_ausgabe
    aufgaben: ["3.7"]
    deckt: [c05.while_and]
    frage: |-
      Was gibt der Code aus?
      ```python
      messungen = 0
      stabil = False
      while not stabil and messungen < 3:
          messungen += 1
          if messungen == 2:
              stabil = True
      print(messungen, stabil)
      ```
    antwort: |-
      ```text
      2 True
      ```
      Nach dem 2. Durchlauf ist `not stabil` falsch – die ganze and-Bedingung ist falsch, die Schleife endet.
    tests: [{p: 1, t: 1}]

  - typ: code_luecke
    aufgaben: ["3.7"]
    deckt: [c05.while_and]
    frage: |-
      Die Schleife soll weiterlaufen, solange die PIN **nicht** `4711` ist **und** weniger als 3 Versuche gemacht wurden. Ergänze die Bedingung.
      ```python
      pin = ""
      versuche = 0
      while ___:
          pin = input()
          versuche += 1
      print(versuche)
      ```
    antwort: |-
      `pin != "4711" and versuche < 3`
      ```python
      pin = ""
      versuche = 0
      while pin != "4711" and versuche < 3:
          pin = input()
          versuche += 1
      print(versuche)
      ```
      Tippt der Nutzer `1111` und dann `4711`, erscheint:
      ```text
      2
      ```
    tests: [{p: 2, t: 1, eingabe: "1111\n4711\n"}]

  - typ: begriff
    aufgaben: ["3.7"]
    deckt: [c05.while_and]
    frage: |-
      Eine Tankfüllung läuft mit `while fuellstand < soll and messungen < 10:` – sie endet also beim Sollfüllstand **oder** nach 10 Messungen. Warum braucht man nach der Schleife noch ein `if`?
    antwort: |-
      Die Schleife verrät nicht, **welche** Bedingung sie beendet hat. Erst ein `if` danach (z. B. `if fuellstand >= soll:`) entscheidet, ob `Tank voll` oder `Abbruch nach 10 Messungen` gemeldet wird.

  # ---------------------------------------------------------------- Eingabe wiederholen
  - typ: code_ausgabe
    folien: [125]
    aufgaben: ["3.7"]
    deckt: [c05.while_eingabe]
    frage: |-
      Der Nutzer tippt nacheinander `WARN`, `FEHLER`, `OK`. Was gibt der Code aus?
      ```python
      status = ""
      while status != "OK":
          status = input()
          print("Meldung:", status)
      print("Anlage frei")
      ```
    antwort: |-
      ```text
      Meldung: WARN
      Meldung: FEHLER
      Meldung: OK
      Anlage frei
      ```
      Die Bedingung wird erst am Anfang des nächsten Durchlaufs geprüft – deshalb erscheint auch `Meldung: OK`.
    tests: [{p: 1, t: 1, eingabe: "WARN\nFEHLER\nOK\n"}]

  - typ: code_schreiben
    folien: [125]
    deckt: [c05.while_eingabe]
    frage: |-
      Schreib Code, der so lange eine Drehzahl (Ganzzahl) einliest, bis sie **größer als 0** ist, und sie dann ausgibt.
    antwort: |-
      ```python
      drehzahl = 0
      while drehzahl <= 0:
          drehzahl = int(input("Drehzahl > 0: "))
      print("OK:", drehzahl)
      ```
      Der Startwert `0` sorgt dafür, dass die Schleife mindestens einmal läuft.
    tests: [{p: 1, eingabe: "-5\n0\n1200\n"}]

  - typ: begriff
    folien: [125]
    aufgaben: ["3.7"]
    deckt: [c05.while_eingabe]
    frage: |-
      Warum steht vor `while status != "OK":` die Zeile `status = ""`?
    antwort: |-
      Die Variable muss beim ersten Prüfen der Bedingung schon existieren (sonst NameError). Der leere String ist sicher **ungleich** `"OK"` – die Bedingung ist also wahr, und die Schleife läuft mindestens einmal und fragt ab.

