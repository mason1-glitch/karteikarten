  - typ: code_fehler
    aufgaben: ["4.4"]
    deckt: [c05.flag]
    frage: |-
      `Ventil` ist in der Liste, trotzdem erscheint `False`. Warum?
      ```python
      teile = ["Ventil", "Lager"]
      gefunden = False
      for t in teile:
          if t == "Ventil":
              gefunden = True
          else:
              gefunden = False
      print(gefunden)
      ```
    antwort: |-
      ```text
      False
      ```
      Der else-Zweig überschreibt den Treffer beim nächsten Element (`Lager`) wieder mit `False`. Der else-Zweig muss weg – der Startwert `False` vor der Schleife genügt.
