      for w in werte:
          summe = 0
          summe += w
      print(summe)
      ```
    antwort: |-
      ```text
      5
      ```
      `summe = 0` steht im Rumpf und setzt die Summe bei jedem Durchlauf zurück. Der Startwert gehört **vor** die Schleife.
