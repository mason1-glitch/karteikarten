    antwort: |-
      ```python
      werte = [0.2, 0.7, 0.4, 0.9]
      anzahl = 0
      for w in werte:
          if w > 0.5:
              anzahl += 1
      print(anzahl)
      ```
      ```text
      2
      ```
    tests: [{p: 1, t: 1}]

  # ---------------------------------------------------------------- break
  - typ: code_ausgabe
    aufgaben: ["3.8"]
    deckt: [c05.break]
    frage: |-
      Was gibt der Code aus?
      ```python
      for wert in [21, 22, 99, 23]:
          if wert > 90:
              print("Grenzwert:", wert)
              break
          print(wert, "ok")
      ```
    antwort: |-
      ```text
      21 ok
      22 ok
      Grenzwert: 99
      ```
      `break` beendet die Schleife sofort – `23` wird nicht mehr geprüft.
    tests: [{p: 1, t: 1}]

  - typ: begriff
    aufgaben: ["3.8"]
    deckt: [c05.break]
    frage: |-
      Was bewirkt `break` in einer Schleife?
    antwort: |-
      Die Schleife wird **sofort komplett beendet**; das Programm macht mit der ersten Anweisung nach der Schleife weiter.

  - typ: code_schreiben
    aufgaben: ["3.8"]
    deckt: [c05.break]
    frage: |-
      Gib aus `werte = [80, 95, 120, 130]` den **ersten** Wert über 100 aus und brich die Suche danach ab.
    antwort: |-
      ```python
      werte = [80, 95, 120, 130]
      for w in werte:
          if w > 100:
              print(w)
              break
      ```
      ```text
      120
      ```
    tests: [{p: 1, t: 1}]

  # ---------------------------------------------------------------- continue
  - typ: code_ausgabe
    aufgaben: ["3.8"]
    deckt: [c05.continue]
    frage: |-
      Was gibt der Code aus?
      ```python
      for nr in [1, 2, 3, 4]:
          if nr % 2 == 0:
              continue
          print(nr)
      ```
    antwort: |-
      ```text
      1
      3
      ```
      Bei geraden Nummern springt `continue` direkt zum nächsten Durchlauf.
    tests: [{p: 1, t: 1}]

  - typ: unterschied
    aufgaben: ["3.8"]
    deckt: [c05.continue, c05.break]
    frage: |-
      Was ist der Unterschied zwischen `break` und `continue`?
    antwort: |-
      - `break`: beendet die **ganze** Schleife.
      - `continue`: überspringt nur den **Rest des aktuellen** Durchlaufs; die Schleife läuft mit dem nächsten Element weiter.

  - typ: code_luecke
    aufgaben: ["3.8"]
    deckt: [c05.continue]
    frage: |-
      Negative Messwerte sollen übersprungen werden, die Schleife soll aber weiterlaufen. Ergänze die Lücke.
      ```python
      for w in [3, -1, 4]:
          if w < 0:
              ___
          print(w)
      ```
    antwort: |-
      `continue`
      ```python
      for w in [3, -1, 4]:
