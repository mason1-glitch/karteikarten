  - typ: code_schreiben
    folien: [125]
    deckt: [c05.while]
    frage: |-
      Ein Tank mit 1000 l verliert pro Stunde 10 % seines Inhalts. Schreib eine while-Schleife, die ausgibt, nach wie vielen Stunden **weniger als 500 l** im Tank sind.
    antwort: |-
      ```python
      inhalt = 1000
