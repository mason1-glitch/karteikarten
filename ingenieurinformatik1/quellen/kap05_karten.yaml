karten:
  # ---------------------------------------------------------------- while
  - typ: code_ausgabe
    folien: [123, 125]
    deckt: [c05.while]
    frage: |-
      Was gibt der Code aus?
      ```python
      i = 0
      while i < 3:
          print(i)
          i += 1
      print("Ende", i)
      ```
    antwort: |-
      ```text
      0
      1
      2
      Ende 3
      ```
      Bei `i = 3` ist die Bedingung falsch; die Schleife endet, `i` behält den Wert 3.
    tests: [{p: 1, t: 1}]

  - typ: code_ausgabe
    aufgaben: ["3.10"]
    deckt: [c05.while, c05.trace]
    frage: |-
      Was gibt der Code aus?
      ```python
      wert = 54
      schritte = 0
