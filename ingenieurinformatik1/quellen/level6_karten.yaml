  - typ: code_fehler
    quelle: "Probe-Kolloquium; Labor KW45 (Vorgriff)"
    deckt: [l6.rekursion]
    frage: |-
      `countdown(3)` läuft. Was passiert bei `countdown(-1)`, und wie machst du die Funktion sicher?
      ```python
      def countdown(n):
          if n == 0:
              print("LOS!")
              return
          countdown(n - 1)

      countdown(-1)
      ```
    antwort: |-
      Von -1 aus wird 0 **nie erreicht** (-2, -3, …) → `RecursionError`. Sicher ist `if n <= 0:` – dann greift die Abbruchbedingung auch für negative Werte (und für 2,5 über 0,5 → -0,5).
    tests: [{p: 1, abbruch: RecursionError}]

  - typ: code_ausgabe
    aufgaben: ["3.8"]
    folien: [138]
    deckt: [l6.kaputt]
    frage: |-
      Was gibt der Code aus?
      ```python
      for zeile in ["Max;0.412\n", "5\n", "Lea;0.298\n"]:
          trenner = zeile.find(";")
          if trenner == -1:
              continue
          print(zeile[0:trenner])
      ```
    antwort: |-
      ```text
      Max
      Lea
      ```
      `continue` springt sofort zum **nächsten Durchlauf** – die Zeile ohne `;` wird übersprungen, die Schleife läuft weiter (anders als `break`, das sie beendet; Aufg. 3.8).
