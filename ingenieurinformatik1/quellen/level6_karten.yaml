      ```python
      zeit = 0.412
      datei = open("bestenliste.txt", "a")
      datei.write(zeit)
      datei.close()
      ```
    antwort: |-
      `TypeError`: `write()` nimmt **nur Strings**. Richtig z. B. `datei.write(str(zeit) + "\n")` oder `datei.write(f"{zeit:.3f}\n")`.
    tests: [{p: 1, abbruch: TypeError}]

