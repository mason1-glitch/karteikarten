      liste = sortieren(liste)
      print(liste)
      ```
    antwort: |-
      ```text
      None
      ```
      Die Funktion sortiert **die Liste selbst** und gibt nichts zurück → `None`. Mit `liste = sortieren(liste)` überschreibst du die sortierte Liste mit `None`. Richtig: nur `sortieren(liste)` aufrufen.
