  # ---------------------------------------------------------------- Lesen und Zerlegen
  - typ: code_ausgabe
    folien: [191]
    deckt: [l6.lesen]
    frage: |-
      `bestenliste.txt` enthält zwei Zeilen. Was gibt der Code aus, und warum sieht es so aus?
      ```python
      datei = open("bestenliste.txt", "r")
      for zeile in datei:
          print(zeile)
      datei.close()
      ```
    antwort: |-
      ```text
      Max;0.412

      Lea;0.298
      ```
      Jede gelesene Zeile **endet mit `\n`**, und `print()` setzt noch einen Umbruch dazu → Leerzeile dazwischen. Abhilfe: `print(zeile, end="")`.
    tests: [{p: 1, t: 1, dateien: {"bestenliste.txt": "Max;0.412\nLea;0.298\n"}}]

  - typ: unterschied
    folien: [190, 191]
    deckt: [l6.lesen]
    frage: |-
      Was liefern `datei.read()`, `datei.readlines()` und `for zeile in datei:`?
    antwort: |-
      | Aufruf | Ergebnis |
      |---|---|
      | `read()` | ganzer Inhalt als **ein** String |
      | `readlines()` | **Liste** aller Zeilen, jede mit `\n` |
      | `for zeile in datei:` | je Durchlauf **eine** Zeile (mit `\n`) |

      Für die Bestenliste passt die `for`-Schleife: Zeile für Zeile zerlegen.

  - typ: code_ausgabe
    folien: [137, 138]
    deckt: [l6.zerlegen]
    frage: |-
      Was gibt der Code aus?
      ```python
      zeile = "Lea;0.298\n"
      trenner = zeile.find(";")
      name = zeile[0:trenner]
      zeit = float(zeile[trenner + 1:])
      print(trenner, name, zeit)
      ```
    antwort: |-
      ```text
      3 Lea 0.298
      ```
      `find` liefert die Position des Trennzeichens. Name = alles **davor** (Ende ausschließlich), Zeit = alles **dahinter**. `float()` stört das `\n` am Ende nicht.
    tests: [{p: 1, t: 1}]

  - typ: code_luecke
    folien: [137, 138]
    deckt: [l6.zerlegen]
    frage: |-
      Ergänze die Indizes so, dass `name = "Ina"` und `zeit = 0.301` herauskommen.
      ```python
      zeile = "Ina;0.301\n"
      trenner = zeile.find(";")
      name = zeile[___:___]
      zeit = float(zeile[___:])
      ```
    antwort: |-
      ```python
      zeile = "Ina;0.301\n"
      trenner = zeile.find(";")
      name = zeile[0:trenner]
      zeit = float(zeile[trenner + 1:])
      print(name, zeit)
      ```
      Start einschließlich, Ende **aus**schließlich (F. 137); `+ 1` überspringt das `;` selbst.
    tests: [{p: 2}]

  - typ: unterschied
    folien: [138, 153]
    deckt: [l6.zerlegen]
    frage: |-
      Warum zerlegst du die Zeile mit `find` und Slicing und nicht mit `split(";")`?
    antwort: |-
      Beides funktioniert. `zeile.split(";")` liefert `['Lea', '0.298\n']`, steht im Stoff aber nur einmal (F. 153) – **Ergänzung**. `find` und Slicing sind im Skript ausführlich behandelt (F. 137–138) und Schritt für Schritt erklärbar. Im Kolloquium zählt, dass du jede Zeile erklären kannst.

  - typ: code_ausgabe
    quelle: "Level-Konzept; Labor KW46 (Vorgriff)"
    folien: [138]
    deckt: [l6.kaputt]
    frage: |-
      Was gibt der Code aus?
      ```python
      for zeile in ["Max;0.412\n", "Ole;schnell\n"]:
          trenner = zeile.find(";")
          try:
              print(float(zeile[trenner + 1:]))
          except ValueError:
              print("übersprungen:", zeile[0:trenner])
      ```
    antwort: |-
      ```text
      0.412
      übersprungen: Ole
      ```
      Eine von Hand verdorbene Zeile soll nicht das ganze Spiel abstürzen lassen: Der `ValueError` von `float("schnell")` wird abgefangen, die Zeile ausgelassen.
    tests: [{p: 1, t: 1}]

  - typ: begruenden
    quelle: "Level-Konzept"
    deckt: [l6.kaputt, l6.lesen]
    frage: |-
      Warum steht beim Laden das `try` um die **einzelne Zeile** und nicht um die ganze `for`-Schleife?
    antwort: |-
      Steht `try` um die ganze Schleife, **bricht** ein Fehler in Zeile 3 die Schleife ab – alle späteren Einträge gingen verloren. Um die einzelne Zeile gelegt, wird nur die kaputte Zeile übersprungen, die Schleife läuft weiter.

