      for name in ["Max", "Lea"]:
          datei = open("liste.txt", "w")
          datei.write(name + "\n")
          datei.close()
      datei = open("liste.txt", "r")
      print(datei.read())
      datei.close()
      ```
    antwort: |-
      ```text
      Lea
      ```
      `"w"` **überschreibt** bei jedem Öffnen den ganzen Inhalt (F. 193). Jede neue Runde würde die alte Bestenliste löschen – deshalb `"a"`.
