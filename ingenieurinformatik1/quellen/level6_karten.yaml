  - typ: unterschied
    folien: [189, 193]
    deckt: [l6.modi]
    frage: |-
      Vergleiche die Dateimodi `"r"`, `"w"` und `"a"`.
    antwort: |-
      | Modus | wofür | vorhandener Inhalt | Datei fehlt |
      |---|---|---|---|
      | `"r"` | lesen (Standard ohne Modus) | bleibt | `FileNotFoundError` |
      | `"w"` | schreiben | wird **gelöscht/überschrieben** | wird angelegt |
      | `"a"` | anhängen | bleibt, Neues ans Ende | wird angelegt |

