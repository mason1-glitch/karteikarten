    frage: |-
      Was gibt der Code aus? (`bestenliste.txt` gibt es noch nicht.)
      ```python
      datei = open("bestenliste.txt", "a")
      datei.write("Max;0.412\n")
      datei.write("Lea;0.298\n")
      datei.close()
      datei = open("bestenliste.txt", "r")
