  - typ: begruenden
    quelle: "Level-Konzept"
    deckt: [l6.eintraege, l6.tausch]
    frage: |-
      Warum speicherst du die Bestenliste als Liste von Dictionaries und nicht als zwei Listen `namen` und `zeiten`?
    antwort: |-
      Jeder Eintrag hält **Name und Zeit zusammen**. Beim Sortieren tauschst du ganze Einträge – bei zwei getrennten Listen müsstest du in beiden parallel tauschen; vergisst du eine, gehören Namen und Zeiten nicht mehr zusammen. Dazu sprechende Schlüssel statt Index 0/1.

  # ---------------------------------------------------------------- Bubble Sort
  - typ: begriff
    quelle: "Labor KW45 (Vorgriff)"
    deckt: [l6.bubble]
    frage: |-
      Wie funktioniert **Bubble Sort**?
    antwort: |-
      1. Von vorn nach hinten jeweils **zwei Nachbarn** vergleichen.
      2. Stehen sie falsch herum (`links > rechts`), **tauschen**.
      3. Nach einem Durchlauf steht das **größte** Element ganz hinten („steigt auf wie eine Blase“).
      4. Durchläufe wiederholen, bis keiner mehr tauscht. Nach spätestens n − 1 Durchläufen ist die Liste sortiert (mit Merker `getauscht` kommt noch ein Kontrolldurchlauf ohne Tausch dazu).

  - typ: trace
    quelle: "Labor KW45 (Vorgriff)"
    deckt: [l6.bubble]
    frage: |-
      Führe den **ersten Durchlauf** von Bubble Sort an `[0.41, 0.30, 0.66, 0.29]` aus. Wie sieht die Liste nach jedem Vergleich aus?
    antwort: |-
      {{bild:level_bubblesort|Ein Durchlauf Bubble Sort}}
      `j = 0`: 0,41 > 0,30 → tauschen · `j = 1`: 0,41 < 0,66 → bleibt · `j = 2`: 0,66 > 0,29 → tauschen.
      Ergebnis `[0.30, 0.41, 0.29, 0.66]` – die größte Zeit steht hinten.

  - typ: code_luecke
    quelle: "Labor KW45 (Vorgriff)"
    deckt: [l6.tausch]
    frage: |-
      Tausche die beiden Zeiten, wenn sie falsch herum stehen.
      ```python
      zeiten = [0.41, 0.30]
      if zeiten[0] > zeiten[1]:
          merker = ___
          zeiten[0] = ___
          zeiten[1] = ___
      print(zeiten)
      ```
    antwort: |-
      ```python
      zeiten = [0.41, 0.30]
      if zeiten[0] > zeiten[1]:
          merker = zeiten[0]
          zeiten[0] = zeiten[1]
          zeiten[1] = merker
      print(zeiten)
      ```
      ```text
      [0.3, 0.41]
      ```
      Der **Merker** hebt den ersten Wert auf, bevor er überschrieben wird – wie beim Umfüllen zweier Gläser mit einem dritten.
    tests: [{p: 2, t: 1}]

  - typ: code_fehler
    quelle: "Labor KW45 (Vorgriff)"
    deckt: [l6.tausch]
    frage: |-
      Das soll tauschen. Was kommt heraus, und warum?
      ```python
      zeiten = [0.41, 0.30]
      zeiten[0] = zeiten[1]
      zeiten[1] = zeiten[0]
      print(zeiten)
      ```
    antwort: |-
      ```text
      [0.3, 0.3]
      ```
      Nach der ersten Zeile ist 0,41 **überschrieben** und verloren; die zweite kopiert nur 0,3 zurück. Es fehlt die Merker-Variable. Ergänzung: `zeiten[0], zeiten[1] = zeiten[1], zeiten[0]` tauscht in einer Zeile.
    tests: [{p: 1, t: 1}]

  - typ: code_schreiben
    quelle: "Labor KW45 (Vorgriff)"
    deckt: [l6.bubble, l6.tausch]
    frage: |-
      Sortiere `zeiten = [0.41, 0.30, 0.66, 0.29]` aufsteigend mit Bubble Sort und gib die Liste aus.
    antwort: |-
      ```python
      zeiten = [0.41, 0.30, 0.66, 0.29]
      for durchlauf in range(len(zeiten) - 1):
          for j in range(len(zeiten) - 1 - durchlauf):
              if zeiten[j] > zeiten[j + 1]:
                  merker = zeiten[j]
                  zeiten[j] = zeiten[j + 1]
                  zeiten[j + 1] = merker
      print(zeiten)
      ```
      ```text
      [0.29, 0.3, 0.41, 0.66]
      ```
    tests: [{p: 1, t: 1}]

  - typ: begruenden
    quelle: "Labor KW45 (Vorgriff)"
    deckt: [l6.bubble]
    frage: |-
      Warum läuft die innere Schleife nur bis `len(zeiten) - 1 - durchlauf`?
    antwort: |-
      - **`- 1`**: verglichen wird `zeiten[j]` mit `zeiten[j + 1]`; beim letzten Index gäbe es keinen Nachbarn → `IndexError`.
      - **`- durchlauf`**: Nach jedem Durchlauf steht ein weiteres großes Element schon an seinem endgültigen Platz hinten; dort muss nicht mehr verglichen werden.

  - typ: code_fehler
    quelle: "Labor KW45 (Vorgriff)"
    deckt: [l6.bubble]
    frage: |-
      Der Code bricht ab. Warum?
      ```python
      zeiten = [0.41, 0.30, 0.66]
      for j in range(len(zeiten)):
          if zeiten[j] > zeiten[j + 1]:
              merker = zeiten[j]
              zeiten[j] = zeiten[j + 1]
              zeiten[j + 1] = merker
      ```
    antwort: |-
      Bei `j = 2` (letzter Index) greift `zeiten[j + 1]` auf Index 3 zu – den gibt es nicht: `IndexError: list index out of range`. Richtig: `range(len(zeiten) - 1)`.
    tests: [{p: 1, abbruch: IndexError}]

  - typ: code_ausgabe
    quelle: "Level-Konzept; Labor KW45 (Vorgriff)"
    deckt: [l6.tausch, l6.eintraege]
    frage: |-
      Was gibt der Code aus?
      ```python
      eintraege = [{"name": "Max", "zeit": 0.41},
                   {"name": "Lea", "zeit": 0.30}]
      if eintraege[0]["zeit"] > eintraege[1]["zeit"]:
          merker = eintraege[0]
          eintraege[0] = eintraege[1]
          eintraege[1] = merker
      print(eintraege[0]["name"], eintraege[0]["zeit"])
      ```
    antwort: |-
      ```text
      Lea 0.3
      ```
      Verglichen wird die **Zeit**, getauscht wird der **ganze Eintrag** – so bleibt der Name bei seiner Zeit.
    tests: [{p: 1, t: 1}]

  - typ: begruenden
    quelle: "Labor KW45 (Vorgriff)"
    deckt: [l6.aufwand]
    frage: |-
      Wozu dient in deiner Bestenliste-Sortierung der Merker `getauscht`?
    antwort: |-
      Wird in einem ganzen Durchlauf **nichts** getauscht, ist die Liste sortiert – weitere Durchläufe wären verschwendet. Die äußere `while getauscht:`-Schleife hört dann auf. Ist die Liste **schon sortiert**, reicht ein einziger Durchlauf. Aber: Ein kleiner Wert ganz hinten (neue Bestzeit, mit `"a"` angehängt) wandert pro Durchlauf nur **eine** Stelle nach vorn – dann braucht es fast alle Durchläufe.

  - typ: fakt
    quelle: "Labor KW45 (Vorgriff)"
    deckt: [l6.aufwand]
    frage: |-
      Wie viele Vergleiche braucht Bubble Sort ohne frühen Abbruch für n Einträge, und wie viele bei 10?
    antwort: |-
      (n − 1) + (n − 2) + … + 1 = **n · (n − 1) / 2**. Bei 10 Einträgen: 10 · 9 / 2 = **45** Vergleiche. Der Aufwand wächst quadratisch – für eine Bestenliste mit wenigen Einträgen ohne Bedeutung, für Millionen Daten zu langsam.

  # ---------------------------------------------------------------- sort() und Top 5
  - typ: code_ausgabe
    folien: [146, 147]
    deckt: [l6.sort]
    frage: |-
      Was gibt der Code aus?
      ```python
      def nach_zeit(eintrag):
          return eintrag["zeit"]

      liste = [{"name": "Max", "zeit": 0.41},
               {"name": "Lea", "zeit": 0.30}]
      liste.sort(key=nach_zeit)
      print(liste[0]["name"])
      ```
    antwort: |-
      ```text
      Lea
      ```
      `sort()` ruft für jedes Element die **key-Funktion** auf und sortiert nach ihrem Rückgabewert, aufsteigend (`reverse=False`) – wie `critFunc` in F. 147.
    tests: [{p: 1, t: 1}]

  - typ: begruenden
    folien: [146, 147]
    quelle: "Laboraufgabe F. 2"
    deckt: [l6.sort, l6.bubble]
    frage: |-
      Python hat `liste.sort()`. Warum sortierst du die Bestenliste trotzdem selbst?
    antwort: |-
      Die Laboraufgabe zählt **Sortieralgorithmen** als Wahlelement – `sort()` ist ein fertiger Aufruf, der Algorithmus dahinter bleibt unsichtbar. Mit eigenem Bubble Sort zeigst du Vergleichen, Tauschen und Schleifengrenzen und kannst jeden Schritt erklären. (In echter Software nähme man `sort()`.)

  - typ: code_ausgabe
    quelle: "Level-Konzept"
    folien: [152]
    deckt: [l6.top5]
    frage: |-
      Was gibt der Code aus?
      ```python
      namen = ["Lea", "Ina", "Max", "Ben", "Tom", "Kim"]
      for i in range(len(namen)):
          if i < 5:
              print(f"{i + 1}. {namen[i]}")
      ```
    antwort: |-
      ```text
      1. Lea
      2. Ina
      3. Max
      4. Ben
      5. Tom
      ```
      Index 0–4 sind die ersten fünf; die Platzierung für den Spieler ist `i + 1`. Hat die Liste weniger als 5 Einträge, läuft die Schleife eben kürzer – kein `IndexError`. Ergänzung: `namen[0:5]` (Slicing von Listen) ist nicht im Stoff.
    tests: [{p: 1, t: 1}]

  - typ: code_schreiben
    quelle: "Level-Konzept"
    deckt: [l6.top5, l6.bubble]
    frage: |-
      Kolloquium: „Ändere deine Sortierung so, dass die **langsamste** Zeit vorne steht.“ Was änderst du?
    antwort: |-
      Nur den Vergleich: `>` wird zu `<`.
      ```python
      zeiten = [0.41, 0.30, 0.66]
      for durchlauf in range(len(zeiten) - 1):
          for j in range(len(zeiten) - 1 - durchlauf):
              if zeiten[j] < zeiten[j + 1]:
                  merker = zeiten[j]
                  zeiten[j] = zeiten[j + 1]
                  zeiten[j + 1] = merker
      print(zeiten)
      ```
      ```text
      [0.66, 0.41, 0.3]
      ```
    tests: [{p: 1, t: 1}]

  # ---------------------------------------------------------------- Rekursion
  - typ: begriff
    quelle: "Labor KW45 (Vorgriff); Laborfolie IDE F. 3 (Thonny-Beispiel fact)"
    deckt: [l6.rekursion]
    frage: |-
      Was ist **Rekursion**, und welche zwei Teile braucht jede rekursive Funktion?
    antwort: |-
      Eine Funktion, die **sich selbst aufruft**.
      1. **Abbruchbedingung** (Basisfall): hier ruft sie sich nicht mehr auf, z. B. `if n == 0:`.
      2. **Schritt zum Abbruch hin**: der Selbstaufruf mit kleinerem Problem, z. B. `countdown(n - 1)`.

      Jeder Aufruf hat seine **eigenen lokalen Variablen** (Thonny zeigt sie als eigene Fenster).

  - typ: code_ausgabe
    quelle: "Labor KW45 (Vorgriff)"
    deckt: [l6.rekursion]
    frage: |-
      Was gibt der Code aus?
      ```python
      def countdown(n):
          if n == 0:
              print("LOS!")
              return
          print(n)
          countdown(n - 1)

      countdown(3)
      ```
    antwort: |-
      ```text
      3
      2
      1
      LOS!
      ```
      Aufrufkette: `countdown(3)` → `countdown(2)` → `countdown(1)` → `countdown(0)` – dort greift die Abbruchbedingung.
    tests: [{p: 1, t: 1}]

  - typ: code_fehler
    quelle: "Labor KW45 (Vorgriff)"
    deckt: [l6.rekursion]
    frage: |-
      Was passiert hier, und warum?
      ```python
      def countdown(n):
          print(n)
          countdown(n - 1)

      countdown(3)
      ```
    antwort: |-
      Es fehlt die **Abbruchbedingung**: Die Funktion ruft sich endlos auf (3, 2, 1, 0, -1, …), bis Python nach rund 1000 Aufrufen mit **`RecursionError`** abbricht.
    tests: [{p: 1, abbruch: RecursionError}]

  - typ: unterschied
    quelle: "Labor KW45 (Vorgriff)"
    folien: [128]
    deckt: [l6.rekursion]
    frage: |-
      Countdown als Schleife oder rekursiv – was spricht wofür?
    antwort: |-
      | Schleife | Rekursion |
      |---|---|
      | `for n in range(3, 0, -1): print(n)` | `countdown(n - 1)` ruft sich selbst |
      | einfacher, kein Aufrufstapel | zeigt das Wahlelement **Rekursion** |
      | keine Tiefenbegrenzung | bricht bei sehr großer Tiefe mit `RecursionError` ab |

      Im Level ist der rekursive Countdown optional – nimm ihn nur, wenn du die Aufrufkette erklären kannst.

