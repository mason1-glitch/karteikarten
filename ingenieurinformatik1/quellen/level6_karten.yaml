    antwort: |-
      ```python
      def bestenliste_speichern(name, zeit_s):
          """Hängt einen Eintrag an die Bestenliste an."""
          datei = open("bestenliste.txt", "a")
          datei.write(f"{name};{zeit_s:.3f}\n")
          datei.close()

      bestenliste_speichern("Max", 0.4127)
      ```
      Ein Eintrag pro Zeile, Trennzeichen `;` – so lässt er sich beim Laden wieder zerlegen.
