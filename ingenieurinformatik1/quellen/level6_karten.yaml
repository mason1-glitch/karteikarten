  - typ: falle
    folien: [137, 138]
    quelle: "Probe-Kolloquium"
    deckt: [l6.zerlegen, l6.kaputt]
    frage: |-
      In der Bestenliste steht eine Zeile **ohne** Semikolon: `5`. Was gibt der Code aus?
      ```python
      zeile = "5\n"
      trenner = zeile.find(";")
      print(trenner)
      print(zeile[0:trenner])
      print(float(zeile[trenner + 1:]))
      ```
    antwort: |-
      ```text
      -1
      5
      5.0
      ```
      `find` liefert **-1**, wenn das Zeichen fehlt. Dann schneidet `[0:-1]` das `\n` ab (Name „5“), und `[0:]` ist die ganze Zeile (Zeit 5,0) – kein Fehler, aber ein **stilles Falschergebnis**. Abhilfe: `if trenner == -1: continue` vor dem Zerlegen.
    tests: [{p: 1, t: 1}]

