      Ergänzung: Strings werden **Zeichen für Zeichen nach dem Zeichencode** verglichen; alle Großbuchstaben kommen vor allen Kleinbuchstaben. Bei „Ben“/„Bea“ entscheidet das dritte Zeichen (`n` nach `a`).
