  - typ: begriff
    folien: [105]
    deckt: [c03.vergleich]
    frage: |-
      Mit welchem Operator prüfst du in Python auf **Ungleichheit**?
    antwort: |-
      `!=` (z. B. `eingabe != passwort`). Die im Skript zusätzlich genannte Schreibweise `<>` gibt es in Python 3 nicht.

  # ---------------------------------------------------------------- = vs ==
  - typ: unterschied
    folien: [113]
    deckt: [c03.zuweisung_vergleich]
    frage: |-
      Was ist der Unterschied zwischen `a = 5` und `a == 5`?
    antwort: |-
      - `a = 5`: **Zuweisung** – `a` bekommt den Wert 5.
      - `a == 5`: **Vergleich** – prüft, ob `a` gleich 5 ist, und liefert `True` oder `False`.

  - typ: code_fehler
    folien: [113]
    deckt: [c03.zuweisung_vergleich]
    frage: |-
      Der Code bricht schon beim Start ab. Welche Fehlerart meldet Python, und wo liegt der Fehler?
      ```python
      status = "aktiv"
      if status = "aktiv":
          print("Maschine läuft")
      ```
    antwort: |-
      Einen **SyntaxError** (der genaue Meldungstext hängt von der Python-Version ab). In der Bedingung steht `=` (Zuweisung) statt `==` (Vergleich). Achtung: Das Skript (F. 105) nennt bei „Gleichheit“ zusätzlich „(oder =)“ – in Python ist `=` aber immer eine Zuweisung:
      ```python
      status = "aktiv"
      if status == "aktiv":
          print("Maschine läuft")
      ```
    tests: [{p: 1, abbruch: SyntaxError}, {p: 2}]

  - typ: code_ausgabe
    folien: [113]
    deckt: [c03.zuweisung_vergleich]
    frage: |-
      Was gibt der Code aus?
      ```python
      stufe = 3
      ok = stufe == 3
      print(ok)
      ```
    antwort: |-
      ```text
      True
      ```
      Erst wird `stufe == 3` ausgewertet (True), dann wird das Ergebnis `ok` zugewiesen.
    tests: [{p: 1, t: 1}]

  # ---------------------------------------------------------------- and / or / not
  - typ: code_ausgabe
    folien: [106]
    deckt: [c03.logisch]
    frage: |-
      Was gibt der Code aus?
      ```python
      temperatur = 70
      druck = 9
      print(temperatur > 80 or druck > 8)
      print(temperatur > 80 and druck > 8)
      ```
    antwort: |-
      ```text
      True
      False
      ```
      `or`: eine wahre Bedingung genügt. `and`: beide müssen wahr sein.
    tests: [{p: 1, t: 1}]

  - typ: code_ausgabe
    folien: [106]
    deckt: [c03.logisch]
    frage: |-
      Was gibt der Code aus?
      ```python
      gefunden = False
      print(not gefunden)
      print(not 3 > 2)
      ```
    antwort: |-
      ```text
      True
      False
      ```
      `not` kehrt den Wahrheitswert um; der Vergleich `3 > 2` wird zuerst ausgewertet.
    tests: [{p: 1, t: 1}]

  - typ: code_schreiben
    folien: [106]
    aufgaben: ["3.1"]
    deckt: [c03.logisch]
    frage: |-
      Schreib Code, der `Freigabe` ausgibt, wenn die Temperatur `t` zwischen 20 und 30 °C liegt (beide Grenzen eingeschlossen), sonst `Gesperrt`. Beispiel: `t = 25`.
    antwort: |-
      ```python
      t = 25
      if t >= 20 and t <= 30:
          print("Freigabe")
      else:
          print("Gesperrt")
      ```
      ```text
      Freigabe
      ```
    tests: [{p: 1, t: 1}]

  - typ: unterschied
    folien: [106]
    deckt: [c03.logisch]
    frage: |-
      Was ist der Unterschied zwischen `and` und `or`?
    antwort: |-
      - `A and B` ist nur `True`, wenn **beide** Operanden `True` sind.
      - `A or B` ist `True`, wenn **mindestens einer** `True` ist.

  - typ: code_fehler
    folien: [106]
    deckt: [c03.logisch]
    frage: |-
      Der Code bricht beim Start ab. Welche Fehlerart meldet Python, und was ist falsch?
      ```python
      druck = 3
      temp = 40
      if druck > 0 && temp > 0:
          print("Sensoren liefern Werte")
      ```
    antwort: |-
      Einen **SyntaxError**: `&&` gibt es in Python nicht. Das Skript (F. 106) nennt „and (oder &&)“ – das ist die Schreibweise anderer Sprachen; in Python gilt nur `and`:
      ```python
      druck = 3
      temp = 40
      if druck > 0 and temp > 0:
          print("Sensoren liefern Werte")
      ```
    tests: [{p: 1, abbruch: SyntaxError}, {p: 2}]

  # ---------------------------------------------------------------- Rangfolge Arithmetik
  - typ: code_ausgabe
    folien: [119]
    aufgaben: ["3.2"]
    deckt: [c03.rang_arith]
    frage: |-
      Was gibt der Code aus?
      ```python
      punkte = 3 * 2 ** 3 // 4
      print(punkte)
      ```
    antwort: |-
      ```text
      6
      ```
      Zuerst `2 ** 3 = 8`, dann `*` und `//` von links nach rechts: `3 * 8 = 24`, `24 // 4 = 6`.
    tests: [{p: 1, t: 1}]

  - typ: code_ausgabe
    folien: [119]
    aufgaben: ["3.2"]
    deckt: [c03.rang_arith]
    frage: |-
      Was gibt der Code aus?
      ```python
      teile = 12
      print(teile + 3 % 4 - 1)
      ```
    antwort: |-
      ```text
      14
      ```
      `%` bindet stärker als `+` und `-`: `3 % 4 = 3`, dann `12 + 3 - 1`. Wer `(teile + 3) % 4 - 1` meint, muss Klammern setzen (Ergebnis dann 2).
    tests: [{p: 1, t: 1}]

  - typ: code_fehler
    folien: [119]
    deckt: [c03.rang_arith]
    frage: |-
      Der Mittelwert von zwei Messungen soll `15.0` sein. Was gibt der Code aus, und wie korrigierst du ihn?
      ```python
      a = 10
      b = 20
      mittel = a + b / 2
      print(mittel)
      ```
    antwort: |-
      ```text
      20.0
      ```
      Punkt vor Strich: Es wird nur `b` halbiert. Mit Klammern:
      ```python
      a = 10
      b = 20
      mittel = (a + b) / 2
      print(mittel)
      ```
      ```text
      15.0
      ```
    tests: [{p: 1, t: 1}, {p: 2, t: 2}]

  - typ: begriff
    folien: [119]
    deckt: [c03.rang_arith]
    frage: |-
      In welcher Reihenfolge wertet Python `**`, `*`/`/`/`//`/`%` und `+`/`-` aus?
    antwort: |-
      Zuerst `**`, dann `*`, `/`, `//`, `%` (untereinander von links nach rechts), zuletzt `+` und `-`. Eine andere Reihenfolge erzwingt man mit **Klammern**.

  # ---------------------------------------------------------------- Rangfolge logisch
  - typ: code_ausgabe
    folien: [119]
    aufgaben: ["3.2"]
    deckt: [c03.rang_logisch]
    frage: |-
      Was gibt der Code aus?
      ```python
      print(False and False or True)
      print(False and (False or True))
      ```
    antwort: |-
      ```text
      True
      False
      ```
      `and` wird vor `or` ausgewertet: `(False and False) or True`. Die Klammern in Zeile 2 ändern die Reihenfolge.
    tests: [{p: 1, t: 1}]

  - typ: code_fehler
    folien: [119]
    aufgaben: ["3.2"]
    deckt: [c03.rang_logisch]
    frage: |-
      Alarm soll nur kommen, wenn (Druck > 8 **oder** Temperatur > 90) **und** die Anlage läuft. Die Anlage steht – trotzdem erscheint `Alarm`. Warum?
      ```python
      druck = 9
      temp = 50
      laeuft = False
      if druck > 8 or temp > 90 and laeuft:
          print("Alarm")
      ```
    antwort: |-
      ```text
      Alarm
      ```
      `and` bindet stärker als `or`; Python rechnet `druck > 8 or (temp > 90 and laeuft)`. Korrektur mit Klammern:
      ```python
      druck = 9
      temp = 50
      laeuft = False
      if (druck > 8 or temp > 90) and laeuft:
          print("Alarm")
      ```
    tests: [{p: 1, t: 1}, {p: 2}]

  - typ: begriff
    folien: [119]
    deckt: [c03.rang_logisch]
    frage: |-
      In welcher Reihenfolge werden in einer Bedingung Rechenoperatoren, Vergleiche, `not`, `and` und `or` ausgewertet?
    antwort: |-
      Rechenoperatoren → Vergleiche → `not` → `and` → `or`. Im Zweifel Klammern setzen.

  # ---------------------------------------------------------------- Kurzschluss
  - typ: begriff
    aufgaben: ["3.2"]
    deckt: [c03.kurzschluss]
    frage: |-
      Was bedeutet **Kurzschlussauswertung** (short-circuit) bei `A or B`?
    antwort: |-
      Ist `A` schon `True`, steht das Ergebnis fest – `B` wird gar nicht mehr ausgewertet. Bei `A and B` gilt das Gleiche, wenn `A` `False` ist.

  - typ: code_ausgabe
    aufgaben: ["3.2"]
    deckt: [c03.kurzschluss]
    frage: |-
      Was gibt der Code aus?
      ```python
      divisor = 0
      print(divisor == 0 or 10 / divisor > 1)
      ```
    antwort: |-
      ```text
      True
      ```
      Kein ZeroDivisionError: Der linke Teil ist schon `True`, deshalb wird `10 / divisor` nicht berechnet.
    tests: [{p: 1, t: 1}]

  # ---------------------------------------------------------------- erweiterte Zuweisung
  - typ: code_ausgabe
    folien: [117]
    aufgaben: ["3.10"]
    deckt: [c03.erweitert]
    frage: |-
      Was gibt der Code aus?
      ```python
      stueck = 10
      stueck += 5
      stueck *= 2
      stueck -= 1
      print(stueck)
      ```
    antwort: |-
      ```text
      29
      ```
      10 → 15 → 30 → 29.
