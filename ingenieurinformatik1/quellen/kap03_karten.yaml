  # ---------------------------------------------------------------- Binär
  - typ: begriff
    folien: [90]
    aufgaben: ["5.4"]
    deckt: [c03.binaer]
    frage: |-
      Wie rechnest du eine Dezimalzahl in eine Binärzahl um? Zeig es an 22.
    antwort: |-
      Fortgesetzt durch 2 teilen und die Reste notieren, dann die Reste **von unten nach oben** lesen:
      22 : 2 = 11 Rest 0 · 11 : 2 = 5 Rest 1 · 5 : 2 = 2 Rest 1 · 2 : 2 = 1 Rest 0 · 1 : 2 = 0 Rest 1 → **10110**

  - typ: code_ausgabe
    folien: [90]
    aufgaben: ["5.4"]
    deckt: [c03.binaer]
    frage: |-
      Was gibt der Code aus?
      ```python
      zahl = 6
      ziffern = []
      while zahl > 0:
          ziffern.insert(0, zahl % 2)
          zahl = zahl // 2
      print(ziffern)
      ```
    antwort: |-
      ```text
      [1, 1, 0]
      ```
      Reste: 6 % 2 = 0, 3 % 2 = 1, 1 % 2 = 1. `insert(0, …)` setzt jede neue Ziffer vorne ein – so stehen sie gleich in der richtigen Reihenfolge (6 = 110₂).
    tests: [{p: 1, t: 1}]

