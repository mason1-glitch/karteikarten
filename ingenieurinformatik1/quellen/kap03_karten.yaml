      print(laenge // 2)
      ```
    antwort: |-
      ```text
      3.0
      ```
      Ist ein Operand ein float, liefert auch `//` einen float – nur ohne Nachkommaanteil.
    tests: [{p: 1, t: 1}]

  - typ: code_luecke
    folien: [104]
    deckt: [c03.ganzzahl, c03.modulo]
    frage: |-
      Ergänze die Operatoren, sodass `2 h 15 min` ausgegeben wird.
      ```python
      minuten = 135
      print(minuten ___ 60, "h", minuten ___ 60, "min")
      ```
    antwort: |-
      Erst `//` (volle Stunden), dann `%` (Restminuten):
      ```python
      minuten = 135
      print(minuten // 60, "h", minuten % 60, "min")
      ```
      ```text
      2 h 15 min
      ```
    tests: [{p: 2, t: 1}]

