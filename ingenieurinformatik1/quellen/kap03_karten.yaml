  # ---------------------------------------------------------------- Arithmetik
  - typ: code_ausgabe
    folien: [104]
    aufgaben: ["3.1"]
    deckt: [c03.arith]
    frage: |-
      Was gibt der Code aus?
      ```python
      print(23 / 4)
      print(23 // 4)
      print(23 % 4)
      ```
    antwort: |-
      ```text
      5.75
      5
      3
      ```
      `/` Division (float), `//` ganzzahliger Anteil, `%` Rest.
    tests: [{p: 1, t: 1}]

  - typ: unterschied
    folien: [104]
    aufgaben: ["2.2", "3.1"]
    deckt: [c03.arith, c03.ganzzahl]
    frage: |-
      Was ist der Unterschied zwischen `/` und `//`?
    antwort: |-
      - `/`: normale Division, Ergebnis immer float (`7 / 2` → `3.5`).
      - `//`: Ganzzahldivision, das Ergebnis wird **abgerundet**: `7 // 2` → `3`, aber `-7 // 2` → `-4`. Bei zwei int ist das Ergebnis int.

  - typ: code_schreiben
    folien: [104]
    aufgaben: ["3.9"]
    deckt: [c03.arith, c03.ganzzahl, c03.modulo]
    frage: |-
      47 Lagerbolzen sollen in Kisten zu je 12 Stück. Schreib Code, der ausgibt, wie viele **volle Kisten** es gibt und wie viele **Bolzen übrig** bleiben.
    antwort: |-
      ```python
      teile = 47
      kisten = teile // 12
      rest = teile % 12
      print(kisten, "Kisten,", rest, "übrig")
      ```
      ```text
      3 Kisten, 11 übrig
      ```
    tests: [{p: 1, t: 1}]

  # ---------------------------------------------------------------- //
  - typ: code_ausgabe
    folien: [104]
    deckt: [c03.ganzzahl]
    frage: |-
      Was gibt der Code aus?
      ```python
      print(-7 // 2)
      ```
    antwort: |-
      ```text
      -4
      ```
      `//` rundet **ab** (Richtung minus unendlich). Bei positiven Zahlen wirkt das wie Abschneiden (so beschreibt es das Skript), bei negativen nicht: -3.5 → -4.
    tests: [{p: 1, t: 1}]

  - typ: code_ausgabe
