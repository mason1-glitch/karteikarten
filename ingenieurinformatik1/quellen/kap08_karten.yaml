karten:
  # ---------------------------------------------------------------- np.array
  - typ: code_ausgabe
    folien: [162]
    deckt: [c08.array]
    frage: |-
      Was gibt der Code aus?
      ```python
      import numpy as np
      a = np.array([1, 2, 3])
      print(a)
      ```
    antwort: |-
      ```text
      [1 2 3]
      ```
      Mit `print()` wird ein NumPy-Array **ohne Kommas** ausgegeben – so unterscheidet man es auf einen Blick von einer Liste.
    tests: [{p: 1, t: 1}]

  - typ: code_ausgabe
    folien: [162]
    deckt: [c08.array]
    frage: |-
      Was gibt der Code aus?
      ```python
      import numpy as np
      b = np.array([[1, 2], [3, 4]])
      print(b)
      ```
    antwort: |-
      ```text
      [[1 2]
       [3 4]]
      ```
      Eine verschachtelte Liste wird zum 2D-Array (Matrix), jede Zeile in einer eigenen Ausgabezeile.
    tests: [{p: 1, t: 1}]

  - typ: begriff
    folien: [158, 162]
    aufgaben: ["4.6"]
    deckt: [c08.array]
    frage: |-
      Wie importiert man NumPy üblicherweise, und wie wird aus der Liste `[1.2, 1.4]` ein Array?
    antwort: |-
      `import numpy as np`, dann `np.array([1.2, 1.4])`.

  - typ: code_fehler
    folien: [162]
    deckt: [c08.array]
    frage: |-
      Welche Fehlermeldung erscheint, und was fehlt?
      ```python
      a = np.array([1, 2, 3])
      print(a)
      ```
    antwort: |-
      ```text
      NameError: name 'np' is not defined
      ```
      Der Import fehlt: `import numpy as np` vor der ersten Verwendung.
    tests: [{p: 1, t: 1}]

  # ---------------------------------------------------------------- zeros / full
  - typ: code_ausgabe
    folien: [163]
    aufgaben: ["4.6"]
    deckt: [c08.erzeugen]
    frage: |-
      Was gibt der Code aus?
      ```python
      import numpy as np
      print(np.full((2, 3), 7))
      ```
    antwort: |-
      ```text
      [[7 7 7]
       [7 7 7]]
      ```
      `(2, 3)` = 2 Zeilen, 3 Spalten, alle mit 7 gefüllt.
    tests: [{p: 1, t: 1}]

  - typ: code_luecke
    folien: [163]
    deckt: [c08.erzeugen]
    frage: |-
      Ergänze, sodass ein Array mit 2 Zeilen und 3 Spalten aus **Nullen** entsteht.
      ```python
      import numpy as np
      a = np.___((2, 3))
      print(a)
      ```
    antwort: |-
      `zeros`
      ```python
      import numpy as np
      a = np.zeros((2, 3))
      print(a)
      ```
      ```text
      [[0. 0. 0.]
       [0. 0. 0.]]
      ```
      `0.` bedeutet 0.0 – np.zeros erzeugt Gleitkommazahlen. Mit `np.ones` entstehen Einsen.
    tests: [{p: 2, t: 1}]

  # ---------------------------------------------------------------- Zugriff
  - typ: code_ausgabe
    folien: [164]
    aufgaben: ["4.6"]
    deckt: [c08.zugriff]
    frage: |-
      Was gibt der Code aus?
      ```python
      import numpy as np
      d = np.array([[1, 2, 3], [4, 5, 6]])
      print(d[1, 2])
      print(d[0, :])
      print(d[:, 1])
      ```
    antwort: |-
      ```text
      6
      [1 2 3]
      [2 5]
      ```
      `[Zeile, Spalte]`; ein `:` steht für „alle“.
    tests: [{p: 1, t: 1}]

  - typ: code_luecke
    folien: [164]
    deckt: [c08.zugriff]
    frage: |-
      Ergänze, sodass die **dritte Spalte** ausgegeben wird (`[3 6]`).
      ```python
      import numpy as np
      d = np.array([[1, 2, 3], [4, 5, 6]])
      print(d[___])
      ```
    antwort: |-
      `:, 2`
      ```python
      import numpy as np
      d = np.array([[1, 2, 3], [4, 5, 6]])
      print(d[:, 2])
      ```
      ```text
      [3 6]
      ```
      Achtung: Im Skript (F. 164) steht über `d[:,2]` der Kommentar „die erste“ Spalte – gemeint ist die dritte (Index 2).
    tests: [{p: 2, t: 1}]

  - typ: unterschied
    folien: [164]
    deckt: [c08.zugriff]
    frage: |-
      Was ist der Unterschied zwischen `d[1, :]` und `d[:, 1]`?
    antwort: |-
      - `d[1, :]`: die ganze **Zeile** mit Index 1
      - `d[:, 1]`: die ganze **Spalte** mit Index 1

  # ---------------------------------------------------------------- Zeile/Spalte setzen
  - typ: code_ausgabe
    folien: [165]
    aufgaben: ["4.6"]
    deckt: [c08.zuweisen]
    frage: |-
      Was gibt der Code aus?
      ```python
      import numpy as np
      t = np.full((2, 3), 15)
      t[0, :] = 40
      print(t)
      ```
    antwort: |-
      ```text
      [[40 40 40]
       [15 15 15]]
      ```
      Ein einzelner Wert wird auf die ganze Zeile verteilt (Broadcasting).
    tests: [{p: 1, t: 1}]

  - typ: code_schreiben
    folien: [165]
    deckt: [c08.zuweisen]
    frage: |-
      Erzeuge ein 3×3-Array aus Nullen und setze die **erste Spalte** auf 1 – mit einer einzigen Zuweisung. Gib das Array aus.
    antwort: |-
      ```python
      import numpy as np
      a = np.zeros((3, 3))
      a[:, 0] = 1
      print(a)
      ```
      ```text
      [[1. 0. 0.]
       [1. 0. 0.]
       [1. 0. 0.]]
      ```
    tests: [{p: 1, t: 1}]

  # ---------------------------------------------------------------- Rechnen
  - typ: code_ausgabe
    folien: [166]
    aufgaben: ["4.6"]
    deckt: [c08.rechnen]
    frage: |-
      Was gibt der Code aus?
      ```python
      import numpy as np
      laengen = np.array([1.5, 2.0, 2.5])  # in m
      print(laengen * 1000)
      print(laengen + 0.25)
      ```
    antwort: |-
      ```text
      [1500. 2000. 2500.]
      [1.75 2.25 2.75]
      ```
      Die Rechnung wird auf **jedes** Element angewendet – ohne Schleife (hier m → mm bzw. + 0,25 m Zugabe).
    tests: [{p: 1, t: 1}]

  - typ: code_ausgabe
    folien: [166]
    aufgaben: ["4.6"]
    deckt: [c08.rechnen]
    frage: |-
      Was gibt der Code aus?
      ```python
      import numpy as np
      ist = np.array([21, 19, 24])
      soll = np.array([20, 20, 20])
      print(ist - soll)
      ```
    antwort: |-
      ```text
      [ 1 -1  4]
      ```
      Elementweise Differenz; NumPy richtet die Zahlen mit Leerzeichen aus.
    tests: [{p: 1, t: 1}]

  - typ: code_fehler
    folien: [166]
    deckt: [c08.rechnen]
    frage: |-
      Welche Fehlermeldung erscheint?
      ```python
      import numpy as np
      a = np.array([1, 2])
      b = np.array([1, 2, 3])
      print(a + b)
      ```
    antwort: |-
      ```text
      ValueError: operands could not be broadcast together with shapes (2,) (3,)
      ```
      Die Formen (2,) und (3,) passen nicht zusammen: Elementweise Rechnung braucht hier gleich lange Arrays (oder einen einzelnen Wert).
      Ergänzung: NumPy kann nach bestimmten Regeln auch verschiedene Formen kombinieren (Broadcasting), z. B. Matrix + Zeile.
    tests: [{p: 1, t: 1}]

  # ---------------------------------------------------------------- Array vs. Liste
  - typ: code_ausgabe
    folien: [159, 166]
    deckt: [c08.vergleich_liste]
    frage: |-
      Was gibt der Code aus?
      ```python
      import numpy as np
      liste = [1, 2]
      arr = np.array([1, 2])
      print(liste * 2)
      print(arr * 2)
      ```
    antwort: |-
      ```text
      [1, 2, 1, 2]
      [2 4]
      ```
      Beim Array wird jedes Element **multipliziert** (F. 166). Ergänzung: Bei einer Liste **wiederholt** `* 2` den Inhalt.
    tests: [{p: 1, t: 1}]

  - typ: unterschied
    folien: [159, 160, 161]
    deckt: [c08.vergleich_liste]
    frage: |-
      Warum rechnet man laut Skript mit NumPy-Arrays statt mit Listen, obwohl Listen flexibler sind?
    antwort: |-
      - **Geschwindigkeit:** Rechnungen mit Arrays sind um Größenordnungen schneller (Skript-Beispiel: 1 Tag statt 3 Jahre).
      - Array: alle Elemente haben **denselben Datentyp** → Typinformation nur einmal gespeichert, Werte liegen direkt im Speicherblock.
      - Liste: speichert zu jedem Element den Typ und nur Verweise (Zeiger) auf die Elemente; nicht direkt auf GPUs verarbeitbar.
