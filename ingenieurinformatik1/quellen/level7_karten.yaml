inhalte:
  - {id: l7.escape, gewicht: 3, folie: "52–54", text: "Escape-Sequenzen \\n, \\t, \\r, \\b; \\r zurück an den Zeilenanfang (Countdown in einer Zeile)", konstrukte: [esc:\r, esc:\t, esc:\b]}
  - {id: l7.ascii, gewicht: 3, folie: "60, 69", text: "ASCII-Bilder: Backslash verdoppeln (\\\\), Anführungszeichen \\\", mehrzeilige Strings mit \"\"\"", konstrukte: ["esc:\\\\", "esc:\\\""]}
