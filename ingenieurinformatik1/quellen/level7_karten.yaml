  - {id: l7.ton, gewicht: 3, quelle: "Ergänzung; Level-Konzept", text: "Ton: \\a, winsound (nur Windows), Pakete; mit try/except ImportError/RuntimeError ohne Ton weiterspielen", konstrukte: [esc:\a, modul:winsound, call:winsound.Beep, except:ImportError, except:RuntimeError, kw:pass]}
