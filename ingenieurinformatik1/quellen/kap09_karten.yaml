karten:
  # ---------------------------------------------------------------- def
  - typ: code_ausgabe
    folien: [171]
    deckt: [c09.def]
    frage: |-
      Was gibt der Code aus?
      ```python
      def begruessung(name):
          print("Hallo", name)

      begruessung("Team")
      begruessung("Labor")
      ```
    antwort: |-
      ```text
      Hallo Team
      Hallo Labor
      ```
      Die Funktion wird einmal definiert und zweimal mit verschiedenen Werten aufgerufen.
    tests: [{p: 1, t: 1}]

  - typ: code_fehler
    folien: [171]
    deckt: [c09.def]
    frage: |-
      Der Code bricht beim Start ab. Welche Fehlerart meldet Python, und was fehlt?
      ```python
      def leistung(spannung, strom)
          return spannung * strom
      ```
    antwort: |-
      Einen **SyntaxError**: Nach der schließenden Klammer fehlt der **Doppelpunkt**.
      ```python
      def leistung(spannung, strom):
          return spannung * strom
      ```
    tests: [{p: 1, abbruch: SyntaxError}, {p: 2}]

  - typ: code_schreiben
    folien: [171, 180]
    aufgaben: ["5.3"]
    deckt: [c09.def, c09.return]
    frage: |-
      Schreib eine Funktion `kreisflaeche(d)`, die für den Durchmesser `d` die Fläche A = π · d² / 4 **zurückgibt** (`math.pi`). Gib das Ergebnis für `d = 2` mit zwei Nachkommastellen aus.
    antwort: |-
      ```python
      import math

      def kreisflaeche(d):
          return math.pi * d ** 2 / 4

      print(f"{kreisflaeche(2):.2f}")
      ```
      ```text
      3.14
      ```
    tests: [{p: 1, t: 1}]

  - typ: begriff
    folien: [171]
    deckt: [c09.def]
    frage: |-
      Aus welchen Teilen besteht die erste Zeile einer Funktionsdefinition, und was folgt darunter?
    antwort: |-
      Schlüsselwort `def`, Funktionsname, runde Klammern mit der Parameterliste (darf leer sein, die Klammern **nicht** weglassen) und ein Doppelpunkt. Darunter folgt eingerückt der Funktionsrumpf (Code-Suite).

  # ---------------------------------------------------------------- Aufruf / Ablauf
  - typ: code_ausgabe
    folien: [178]
    aufgaben: ["5.2"]
    deckt: [c09.aufruf]
    frage: |-
      Was gibt der Code aus?
      ```python
      def kalibrieren():
          print("Kalibrierung")

      print("Start")
      kalibrieren()
      print("Messung")
      ```
    antwort: |-
      ```text
      Start
      Kalibrierung
      Messung
      ```
      Beim Aufruf springt das Programm in die Funktion und danach zurück hinter die Aufrufstelle.
    tests: [{p: 1, t: 1}]

  - typ: code_ausgabe
    folien: [178]
    aufgaben: ["5.2"]
    deckt: [c09.aufruf]
    frage: |-
      Was gibt der Code aus?
      ```python
      def starten():
          print("Motor startet")

      print("Programm fertig")
      ```
    antwort: |-
      ```text
      Programm fertig
      ```
      Eine Funktion wird durch `def` nur **definiert**; ihr Rumpf läuft erst, wenn sie aufgerufen wird.
    tests: [{p: 1, t: 1}]

  - typ: code_ausgabe
    folien: [178]
    aufgaben: ["5.2"]
    deckt: [c09.aufruf, c09.trace]
    frage: |-
      Was gibt der Code aus?
      ```python
      def quadrat(x):
          print("in quadrat")
          return x * x

      print("vorher")
      y = quadrat(3)
      print("nachher", y)
      ```
    antwort: |-
      ```text
      vorher
      in quadrat
      nachher 9
      ```
    tests: [{p: 1, t: 1}]

  - typ: begriff
    folien: [178]
    aufgaben: ["5.2"]
    deckt: [c09.aufruf]
    frage: |-
      Was passiert im Programmablauf, wenn eine Funktion aufgerufen wird?
    antwort: |-
      Das Programm springt in die Funktion, führt ihren Rumpf aus und springt dann zurück zur Aufrufstelle, wo es mit dem Rückgabewert weitermacht.

  # ---------------------------------------------------------------- return
  - typ: code_ausgabe
    folien: [180]
    deckt: [c09.return]
    frage: |-
      Was gibt der Code aus?
      ```python
      def volumen(l, b, h):
          return l * b * h

      v = volumen(2, 3, 4)
      print(v / 2)
      ```
    antwort: |-
      ```text
      12.0
      ```
      Der Rückgabewert 24 wird in `v` gespeichert und weiterverarbeitet.
    tests: [{p: 1, t: 1}]

  - typ: code_ausgabe
    folien: [180]
    deckt: [c09.return]
    frage: |-
      Was gibt der Code aus?
      ```python
      def pruefe(wert):
          if wert < 0:
              return "negativ"
          return "ok"

      print(pruefe(-2))
      print(pruefe(5))
      ```
    antwort: |-
      ```text
      negativ
      ok
      ```
      `return` beendet die Funktion sofort – bei -2 wird die letzte Zeile nicht mehr erreicht.
    tests: [{p: 1, t: 1}]

  - typ: code_luecke
    folien: [180]
    aufgaben: ["5.5"]
    deckt: [c09.return]
    frage: |-
      Die Funktion soll das Drehmoment M = F · r (in N·m) **zurückgeben**. Ergänze das Schlüsselwort.
      ```python
      def drehmoment(kraft, hebel):
          ___ kraft * hebel

      print(drehmoment(200, 0.25))
      ```
    antwort: |-
      `return`
      ```python
      def drehmoment(kraft, hebel):
          return kraft * hebel

      print(drehmoment(200, 0.25))
      ```
      ```text
      50.0
      ```
    tests: [{p: 2, t: 1}]

  - typ: begriff
    folien: [173, 180]
    deckt: [c09.return]
    frage: |-
      Was bewirkt `return wert` in einer Funktion?
    antwort: |-
      Die Funktion endet und liefert `wert` an die Aufrufstelle zurück. Dort kann man ihn speichern (`x = f()`) oder direkt weiterverwenden.

  # ---------------------------------------------------------------- print vs return
  - typ: code_ausgabe
    aufgaben: ["5.3"]
    deckt: [c09.print_return]
    frage: |-
      Was gibt der Code aus?
      ```python
      def flaeche(breite, hoehe):
          print(breite * hoehe)

      a = flaeche(4, 5)
      print("Fläche:", a)
      ```
    antwort: |-
      ```text
      20
      Fläche: None
      ```
      Die Funktion **gibt aus**, gibt aber nichts **zurück** – ohne `return` ist der Rückgabewert `None`.
    tests: [{p: 1, t: 1}]

  - typ: code_fehler
    aufgaben: ["5.3"]
    deckt: [c09.print_return]
    frage: |-
      Was erscheint auf dem Bildschirm, und wie korrigierst du die Funktion?
      ```python
      def flaeche(b, h):
          print(b * h)

      gesamt = flaeche(2, 3) + flaeche(4, 5)
      ```
    antwort: |-
      Zuerst die beiden Ausgaben, dann die letzte Zeile der Fehlermeldung:
      ```text
      6
      20
      TypeError: unsupported operand type(s) for +: 'NoneType' and 'NoneType'
      ```
      Beide Aufrufe liefern `None`. Mit `return b * h` statt `print(b * h)` ergibt `gesamt` 26.
    tests: [{p: 1, t: 1}]

  - typ: unterschied
    aufgaben: ["5.3"]
    deckt: [c09.print_return]
    frage: |-
      Was ist der Unterschied zwischen `print(ergebnis)` und `return ergebnis` in einer Funktion?
    antwort: |-
      - `print()`: zeigt den Wert auf dem Bildschirm; die Funktion liefert trotzdem `None`.
      - `return`: gibt den Wert an den Aufrufer zurück, der damit weiterrechnen kann; auf dem Bildschirm erscheint nichts.
      Ergänzung: In Jupyter zeigt eine Zelle, deren **letzte Zeile** ein Funktionsaufruf ist, den Rückgabewert trotzdem als `Out[…]` an.

  - typ: code_ausgabe
    aufgaben: ["5.3"]
    deckt: [c09.print_return]
    frage: |-
      Was gibt der Code aus?
      ```python
      def druck(kraft, flaeche):
          if flaeche == 0:
              return None
          return kraft / flaeche

      print(druck(600, 0))
      print(druck(600, 400))
      ```
    antwort: |-
      ```text
      None
      1.5
      ```
      `None` steht für *kein Ergebnis*. Bei Fläche 0 gibt es keinen sinnvollen Druck; der Aufrufer prüft das mit `if p is not None:`.
    tests: [{p: 1, t: 1}]

  # ---------------------------------------------------------------- Parameter
  - typ: code_ausgabe
    folien: [176]
    aufgaben: ["5.1"]
    deckt: [c09.parameter]
    frage: |-
      Was gibt der Code aus?
      ```python
      def bewegen(richtung, tempo):
          print(richtung, "mit", tempo)

      bewegen(50, "links")
      ```
    antwort: |-
      ```text
      50 mit links
      ```
      Die Werte werden nach der **Reihenfolge** zugeordnet: `richtung = 50`, `tempo = "links"`.
    tests: [{p: 1, t: 1}]

  - typ: begriff
    folien: [176]
    deckt: [c09.parameter]
    frage: |-
      Was legt die Parameterliste in der def-Zeile fest, und was muss beim Aufruf übereinstimmen?
    antwort: |-
      Sie legt Namen und **Reihenfolge** der Werte fest, die die Funktion erwartet. Beim Aufruf müssen Anzahl und Reihenfolge der übergebenen Werte dazu passen (bei Übergabe ohne Parameternamen).

  - typ: code_schreiben
    folien: [176]
    deckt: [c09.parameter, c09.return]
    frage: |-
      Schreib eine Funktion `spannung(kraft, flaeche)`, die σ = F / A zurückgibt, und gib das Ergebnis für F = 500 N und A = 25 mm² aus.
    antwort: |-
      ```python
      def spannung(kraft, flaeche):
          return kraft / flaeche

      print(spannung(500, 25), "N/mm²")
      ```
      ```text
      20.0 N/mm²
      ```
    tests: [{p: 1, t: 1}]

  # ---------------------------------------------------------------- TypeError Argumente
  - typ: code_fehler
    folien: [176]
    aufgaben: ["5.1"]
    deckt: [c09.typeerror]
    frage: |-
      Welche Fehlermeldung erscheint?
      ```python
      def ventil(nr, zustand):
          print("Ventil", nr, zustand)

      ventil(3)
      ```
    antwort: |-
      ```text
      TypeError: ventil() missing 1 required positional argument: 'zustand'
      ```
      Zwei Parameter, aber nur ein Wert beim Aufruf. Richtig z. B.: `ventil(3, "offen")`.
    tests: [{p: 1, t: 1}]

  - typ: begriff
    folien: [176]
    aufgaben: ["5.1"]
    deckt: [c09.typeerror]
    frage: |-
      Was bedeutet diese Fehlermeldung?
      ```text
      TypeError: ventil() takes 2 positional arguments but 3 were given
      ```
    antwort: |-
      `ventil` ist mit **zwei** Parametern definiert, wurde aber mit **drei** Werten aufgerufen. Aufruf und Parameterliste passen nicht zusammen.

  # ---------------------------------------------------------------- NameError
  - typ: code_fehler
    folien: [175]
    aufgaben: ["5.1"]
    deckt: [c09.nameerror]
    frage: |-
      Welche Fehlermeldung erscheint, und wie behebst du sie?
      ```python
      starten()

      def starten():
          print("Start")
      ```
    antwort: |-
      ```text
      NameError: name 'starten' is not defined
      ```
      Die Funktion wird aufgerufen, bevor sie definiert ist. Die Definition muss **vor** dem Aufruf stehen.
    tests: [{p: 1, t: 1}]

  - typ: code_ausgabe
    folien: [175]
    deckt: [c09.nameerror]
    frage: |-
      Was gibt der Code aus?
      ```python
      def pruefen():
          messen()

      def messen():
          print("Messung läuft")

      pruefen()
      ```
    antwort: |-
      ```text
      Messung läuft
      ```
      Kein Fehler: Entscheidend ist, dass `messen` **beim Aufruf** von `pruefen()` schon definiert ist – und das ist sie, weil `pruefen()` erst in der letzten Zeile aufgerufen wird.
    tests: [{p: 1, t: 1}]

  - typ: begriff
    folien: [175]
    deckt: [c09.nameerror]
    frage: |-
      Welche Reihenfolge von Definition und Aufruf schreibt Python bei Funktionen vor, und welcher Fehler entsteht sonst?
    antwort: |-
      Erst definieren, dann aufrufen. Ruft man eine Funktion auf, bevor `def` ausgeführt wurde, entsteht ein **NameError**.

  # ---------------------------------------------------------------- mehrere Rückgabewerte
  - typ: code_ausgabe
    aufgaben: ["5.2", "5.6"]
    deckt: [c09.mehrere]
    frage: |-
      Was gibt der Code aus?
      ```python
      def zerlege(sekunden):
          return sekunden // 60, sekunden % 60

      m, s = zerlege(200)
      print(m, "min", s, "s")
      ```
    antwort: |-
      ```text
      3 min 20 s
      ```
      `return a, b` gibt zwei Werte zurück (als Tupel); links vom `=` werden sie auf zwei Variablen verteilt.
    tests: [{p: 1, t: 1}]

  - typ: code_luecke
    aufgaben: ["5.2"]
    deckt: [c09.mehrere]
    frage: |-
      Die Funktion liefert untere und obere Grenze eines Messbereichs. Ergänze die linke Seite, sodass beide Werte in eigenen Variablen landen.
      ```python
      def grenzen():
          return 18, 24

      ___ = grenzen()
      print(oben - unten)
      ```
    antwort: |-
      `unten, oben`
      ```python
      def grenzen():
          return 18, 24

      unten, oben = grenzen()
      print(oben - unten)
      ```
      ```text
      6
      ```
    tests: [{p: 2, t: 1}]

  - typ: code_schreiben
    aufgaben: ["5.6"]
    deckt: [c09.mehrere, c09.kopie]
    frage: |-
      Schreib eine Funktion `tausche(x, y)`, die beide Werte vertauscht **zurückgibt**, und vertausche damit `links = 3` und `rechts = 8`.
    antwort: |-
      ```python
      def tausche(x, y):
          return y, x

      links = 3
      rechts = 8
      links, rechts = tausche(links, rechts)
      print(links, rechts)
      ```
      ```text
      8 3
      ```
    tests: [{p: 1, t: 1}]

  # ---------------------------------------------------------------- lokal
  - typ: code_ausgabe
    folien: [182]
    aufgaben: ["5.6"]
    deckt: [c09.lokal]
    frage: |-
      Was gibt der Code aus?
      ```python
      def kalibrieren():
          offset = 5
          print("innen:", offset)

      offset = 0
      kalibrieren()
      print("außen:", offset)
      ```
    antwort: |-
      ```text
      innen: 5
      außen: 0
      ```
      `offset = 5` erzeugt in der Funktion eine **eigene, lokale** Variable; die äußere bleibt 0.
    tests: [{p: 1, t: 1}]

  - typ: code_fehler
    folien: [182]
    deckt: [c09.lokal]
    frage: |-
      Welche Fehlermeldung erscheint?
      ```python
      def messen():
          wert = 42

      messen()
      print(wert)
      ```
    antwort: |-
      ```text
      NameError: name 'wert' is not defined
      ```
      `wert` ist lokal und existiert nur während des Funktionsaufrufs. Lösung: `return wert` und `wert = messen()`.
    tests: [{p: 1, t: 1}]

  - typ: begriff
    folien: [182]
    deckt: [c09.lokal]
    frage: |-
      Was ist eine **lokale** Variable?
    antwort: |-
      Eine Variable, die innerhalb einer Funktion entsteht (auch jeder Parameter). Sie gilt nur dort und nur während des Aufrufs; außerhalb ist sie unbekannt.

  # ---------------------------------------------------------------- global
  - typ: code_ausgabe
    folien: [183]
    aufgaben: ["5.6"]
    deckt: [c09.global]
    frage: |-
      Was gibt der Code aus?
      ```python
      ausschuss = 5
      def melden():
          global ausschuss
          ausschuss += 1

      melden()
      melden()
      print(ausschuss)
      ```
    antwort: |-
      ```text
      7
      ```
      Durch `global` greift die Funktion auf die äußere Variable zu und verändert sie.
    tests: [{p: 1, t: 1}]

  - typ: begriff
    folien: [183]
    aufgaben: ["5.6"]
    deckt: [c09.global]
    frage: |-
      Warum sollte man `global` sparsam einsetzen, und was ist die bessere Alternative?
    antwort: |-
      Mit `global` ist schwer nachzuvollziehen, wo eine Variable ihren Wert ändert. Besser: Werte als **Parameter** übergeben und das Ergebnis mit **return** zurückgeben.

  # ---------------------------------------------------------------- Parameterübergabe
  - typ: code_ausgabe
    aufgaben: ["5.6"]
    deckt: [c09.kopie]
    frage: |-
      Was gibt der Code aus?
      ```python
      def in_mm(laenge):
          laenge = laenge * 10
          return laenge

      mass = 12
      in_mm(mass)
      print(mass)
      ```
    antwort: |-
      ```text
      12
      ```
      Die Funktion ändert nur ihren Parameter `laenge`. Der Rückgabewert wird nicht gespeichert – richtig wäre `mass = in_mm(mass)`.
    tests: [{p: 1, t: 1}]

  - typ: code_fehler
    aufgaben: ["5.6"]
    deckt: [c09.kopie]
    frage: |-
      Die Werte sollen getauscht werden. Was gibt der Code aus, und warum klappt es nicht?
      ```python
      def tausche(x, y):
          x, y = y, x

      a = 1
      b = 2
      tausche(a, b)
      print(a, b)
      ```
    antwort: |-
      ```text
      1 2
      ```
      `x` und `y` sind lokale Variablen der Funktion; das Vertauschen wirkt nicht auf `a` und `b`. Lösung: `return y, x` und `a, b = tausche(a, b)`.
    tests: [{p: 1, t: 1}]

  - typ: begriff
    folien: [182]
    aufgaben: ["5.6"]
    deckt: [c09.kopie]
    frage: |-
      Warum ändert `wert = wert * 2` in einer Funktion nicht die Variable, die der Aufrufer übergeben hat?
    antwort: |-
      Der Parameter `wert` ist eine **eigene lokale Variable**, die beim Aufruf den übergebenen Wert bekommt. Eine neue Zuweisung ändert nur diese lokale Variable.

  - typ: code_ausgabe
    aufgaben: ["5.6"]
    deckt: [c09.kopie]
    frage: |-
      **Ergänzung** (nicht im Skript): Was gibt der Code aus?
      ```python
      def anfuegen(liste):
          liste.append(99)

      werte = [1, 2]
      anfuegen(werte)
      print(werte)
      ```
    antwort: |-
      ```text
      [1, 2, 99]
      ```
      Ergänzung: Hier wird der Parameter nicht neu zugewiesen, sondern die **übergebene Liste selbst** verändert – das ist auch außen sichtbar.
    tests: [{p: 1, t: 1}]

  # ---------------------------------------------------------------- Prozedur / Funktion / Methode
  - typ: unterschied
    folien: [172, 173, 174]
    deckt: [c09.begriffe]
    frage: |-
      Was ist der Unterschied zwischen einer **Prozedur**, einer **Funktion** und einer **Methode**?
    antwort: |-
      - Prozedur: Unterprogramm **ohne** Rückgabewert (F. 172).
      - Funktion: Unterprogramm **mit** Rückgabewert (F. 173); heute nennt man meist beides „Funktion“.
      - Methode (Ergänzung, das Skript definiert den Begriff nicht): Funktion, die zu einem Objekt wie einer Liste oder einem String gehört, z. B. `teile.append("B")`. `math.sqrt()` ist keine Methode, sondern eine Funktion des Moduls `math`.

  - typ: begriff
    folien: [174]
    deckt: [c09.begriffe]
    frage: |-
      Ordne zu (wie in der Übung F. 174): Ist `melden`, `doppelt` bzw. `append` eine Prozedur, eine Funktion oder eine Methode?
      ```python
      def melden(text):
          print(text)

      def doppelt(x):
          return 2 * x

      teile = ["A"]
      teile.append("B")
      ```
    antwort: |-
      - `melden`: Prozedur (kein Rückgabewert)
      - `doppelt`: Funktion (liefert einen Wert zurück)
      - `append`: Methode – gehört zur Liste `teile` und wird mit Punkt aufgerufen (Ergänzung: das Skript definiert „Methode“ nicht)
    tests: [{p: 1}]

  # ---------------------------------------------------------------- Modularisierung
  - typ: begriff
    folien: [170]
    deckt: [c09.modular]
    frage: |-
      Welche Vorteile nennt das Skript für Funktionen?
    antwort: |-
      - Programmteile, die mehrmals gebraucht werden, schreibt man nur **einmal**.
      - Sie lassen sich in anderen Programmen **wiederverwenden**.
      - Komplexe Programme werden durch den **modularen** Aufbau übersichtlicher.

  - typ: code_schreiben
    folien: [170]
    aufgaben: ["5.3"]
    deckt: [c09.modular]
    frage: |-
      Fasse die doppelte Berechnung des Übersetzungsverhältnisses i = z₂ / z₁ (Zähnezahlen) in eine Funktion `uebersetzung(z2, z1)` zusammen, sodass dieselbe Ausgabe entsteht.
      ```python
      i1 = 48 / 16
      print(f"i = {i1:.2f}")
      i2 = 60 / 24
      print(f"i = {i2:.2f}")
      ```
    antwort: |-
      ```python
      def uebersetzung(z2, z1):
          return z2 / z1

      print(f"i = {uebersetzung(48, 16):.2f}")
      print(f"i = {uebersetzung(60, 24):.2f}")
      ```
      ```text
      i = 3.00
      i = 2.50
      ```
    tests: [{p: 1, t: 1}, {p: 2, t: 1}]

  # ---------------------------------------------------------------- Ablauf verfolgen
  - typ: begriff
    folien: [177, 178]
    aufgaben: ["5.2"]
    deckt: [c09.trace]
    frage: |-
      Wie machst du sichtbar, in welcher Reihenfolge ein Programm mit Funktionen tatsächlich abläuft?
    antwort: |-
      Mit **Trace-Ausgaben**: `print()` am Anfang und Ende jeder Funktion (z. B. `">>> berechne gestartet"`). Alternativ im **Debugger** Zeile für Zeile durchgehen.

  - typ: code_ausgabe
    aufgaben: ["5.2"]
    deckt: [c09.trace]
    frage: |-
      Was gibt der Code mit der Trace-Ausgabe aus?
      ```python
      def messen(nr):
          print(">>> messen Sensor", nr)
          return 20.0

      summe = 0
      for nr in [1, 2]:
          summe += messen(nr)
      print("Summe:", summe)
      ```
    antwort: |-
      ```text
      >>> messen Sensor 1
      >>> messen Sensor 2
      Summe: 40.0
      ```
      Die Trace-Zeile erscheint bei **jedem** Aufruf – so sieht man, wie oft und mit welchem Wert die Funktion läuft.
    tests: [{p: 1, t: 1}]
