  # ---------------------------------------------------------------- dynamische Typisierung
  - typ: code_ausgabe
    folien: [71]
    deckt: [c02.dynamisch]
    frage: |-
      Was gibt der Code aus?
      ```python
      wert = 25
      wert = "25"
      print(type(wert))
      ```
    antwort: |-
      ```text
      <class 'str'>
      ```
      Der Datentyp einer Variablen richtet sich nach dem zuletzt zugewiesenen Wert.
    tests: [{p: 1, t: 1}]

  - typ: unterschied
    folien: [70, 71]
    deckt: [c02.dynamisch]
    frage: |-
      Was ist laut Skript der Unterschied zwischen Variablen in C++ und in Python?
    antwort: |-
      - C++: Variable wird vorher **deklariert und typisiert**, z. B. `int zaehler = 0;` – der Typ steht fest.
      - Python: Der Typ wird **implizit** durch den zugewiesenen Wert festgelegt und kann sich bei jeder neuen Zuweisung ändern.

  # ---------------------------------------------------------------- / liefert float
  - typ: code_ausgabe
    folien: [104]
    aufgaben: ["2.2"]
    deckt: [c02.division_float]
    frage: |-
      Was gibt der Code aus?
      ```python
      a = 4
      b = 2
      print(a / b)
      ```
    antwort: |-
      ```text
      2.0
      ```
      Achtung: Die Operatortabelle im Skript (F. 104) schreibt vereinfacht „c erhält den Wert 2“ – Python liefert bei `/` aber immer einen float.
    tests: [{p: 1, t: 1}]

  - typ: code_fehler
    aufgaben: ["2.2"]
    deckt: [c02.division_float]
    frage: |-
      Welche Fehlermeldung erscheint, und wie behebst du sie?
      ```python
      leistung = 900 / 2
      balken = leistung // 100
      print("#" * balken)
      ```
    antwort: |-
      ```text
      TypeError: can't multiply sequence by non-int of type 'float'
      ```
      `900 / 2` ist `450.0`, damit ist auch `balken` ein float (`4.0`), und ein String lässt sich nur mit einem int vervielfachen. Korrektur mit Ganzzahldivision:
      ```python
      leistung = 900 // 2
      balken = leistung // 100
      print("#" * balken)
      ```
      ```text
      ####
      ```
    tests: [{p: 1, t: 1}, {p: 2, t: 2}]

  - typ: begriff
    aufgaben: ["2.2"]
    deckt: [c02.division_float, c02.mischtyp]
    frage: |-
      Warum liefert `12 * 3` einen int, `12 / 3` aber einen float – obwohl beide Ergebnisse ganzzahlig sind?
    antwort: |-
      Python legt den Ergebnistyp nach **Operator und Operandentypen** fest, nicht nach dem konkreten Ergebnis: Ein Produkt zweier int ist immer ganzzahlig → int. Eine Division kann einen Rest haben (`7 / 2 = 3.5`), deshalb liefert `/` grundsätzlich float (`12 / 3` → `4.0`).

  # ---------------------------------------------------------------- Mischtypen
  - typ: code_ausgabe
    folien: [74]
    aufgaben: ["2.2"]
    deckt: [c02.mischtyp]
    frage: |-
      Was gibt der Code aus?
      ```python
      print(3 * 2)
      print(3 * 2.0)
      ```
    antwort: |-
      ```text
      6
      6.0
      ```
      Ist ein Operand ein float, ist auch das Ergebnis ein float.
    tests: [{p: 1, t: 1}]

  - typ: begriff
    folien: [74]
    deckt: [c02.mischtyp]
    frage: |-
      Was versteht man unter **impliziter** Typumwandlung?
    antwort: |-
      Python ändert den Datentyp **automatisch**, ohne dass man eine Umwandlungsfunktion aufruft – z. B. wird bei `2 + 0.5` die 2 als float verrechnet, das Ergebnis ist ein float. (Das Skript, F. 74, zählt auch die Neuzuweisung eines Werts anderen Typs dazu; genau genommen bekommt die Variable dann nur einen neuen Wert.)

  - typ: code_ausgabe
    folien: [75]
    aufgaben: ["1.2"]
    deckt: [c02.int_conv]
    frage: |-
      Was gibt der Code aus?
      ```python
      laenge1 = "1250"
      laenge2 = "380"
      print(int(laenge1) + int(laenge2))
      ```
    antwort: |-
      ```text
      1630
      ```
      Erst umwandeln, dann addieren. Ohne `int()` käme `1250380` heraus.
    tests: [{p: 1, t: 1}]

  - typ: code_ausgabe
    folien: [75]
    deckt: [c02.int_conv]
    frage: |-
      Was gibt der Code aus?
      ```python
      print(int(-3.7))
      ```
    antwort: |-
      ```text
      -3
      ```
      `int()` schneidet ab, also Richtung 0 – nicht abrunden auf −4.
    tests: [{p: 1, t: 1}]

  - typ: code_luecke
    folien: [75]
    aufgaben: ["2.4"]
    deckt: [c02.int_conv]
    frage: |-
      Ergänze die Lücke, sodass die Nachkommastellen **abgeschnitten** werden (Ergebnis `18`).
      ```python
      laenge = 18.7
      laenge_ganz = ___(laenge)
      print(laenge_ganz)
      ```
    antwort: |-
      `int`
      ```python
      laenge = 18.7
      laenge_ganz = int(laenge)
      print(laenge_ganz)
      ```
      ```text
      18
      ```
      `round()` würde hier auf 19 runden – abgeschnitten wird nur mit `int()`.
    tests: [{p: 2, t: 1}]

  # ---------------------------------------------------------------- float()
  - typ: code_ausgabe
    folien: [75]
    aufgaben: ["2.4"]
    deckt: [c02.float_conv]
    frage: |-
      Was gibt der Code aus?
      ```python
      luftdruck = "1013.25"
      wert = float(luftdruck)
      print(wert + 1)
      ```
    antwort: |-
      ```text
