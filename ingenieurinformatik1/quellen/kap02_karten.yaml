  - typ: code_schreiben
    folien: [67, 68]
    aufgaben: ["2.3"]
    deckt: [c02.datentypen]
    frage: |-
      Lege für eine Pumpe drei Variablen mit passendem Datentyp an: Inventarnummer **7731** (Ganzzahl), Förderhöhe **12 m** (als Kommazahl), Bezeichnung **Kreiselpumpe P3**.
    antwort: |-
      ```python
      inventar_nr = 7731
      foerderhoehe_m = 12.0
      bezeichnung = "Kreiselpumpe P3"
      ```
      `12.0` statt `12`, damit es ein float ist; Text steht in Anführungszeichen.
    tests: [{p: 1}]

  - typ: unterschied
    folien: [64, 67, 68]
    deckt: [c02.datentypen]
    frage: |-
      Was ist der Unterschied zwischen `5`, `5.0` und `"5"`?
    antwort: |-
      - `5`: int (Ganzzahl)
      - `5.0`: float (Gleitkommazahl)
      - `"5"`: str (Text) – damit kann man nicht rechnen, `+` verkettet nur.

  - typ: begriff
    folien: [64]
    deckt: [c02.datentypen]
    frage: |-
      Welche drei Arten von Daten unterscheidet die elektronische Datenverarbeitung laut Skript?
    antwort: |-
      - Boolesche Daten (wahr/falsch, 1/0) → `bool`
      - Numerische Daten (Zahlen) → `int`, `float`
      - Alphanumerische Daten (Text) → `str`

