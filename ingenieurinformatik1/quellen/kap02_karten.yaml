      ```
    tests: [{p: 1, t: 1}]

  - typ: code_fehler
    folien: [67, 75]
    aufgaben: ["2.4"]
    deckt: [c02.float_conv, c02.valueerror]
    frage: |-
      Welche Fehlermeldung erscheint, und wie lautet die Korrektur?
      ```python
      wert = float("72,4")
      print(wert)
      ```
    antwort: |-
      ```text
