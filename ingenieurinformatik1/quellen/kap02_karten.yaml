  # ---------------------------------------------------------------- str()
  - typ: code_ausgabe
    folien: [75]
    deckt: [c02.str_conv]
    frage: |-
      Was gibt der Code aus?
      ```python
      print(str(25) + str(4))
      ```
    antwort: |-
      ```text
      254
      ```
      Nach `str()` sind es Texte – `+` verkettet sie.
    tests: [{p: 1, t: 1}]

  - typ: code_luecke
    folien: [135]
    deckt: [c02.str_conv]
    frage: |-
      Ergänze die Lücke, sodass `Prüfjahr: 2026` ausgegeben wird.
      ```python
      pruefjahr = 2026
      print("Prüfjahr: " + ___(pruefjahr))
      ```
    antwort: |-
      `str`
      ```python
      pruefjahr = 2026
      print("Prüfjahr: " + str(pruefjahr))
      ```
      ```text
      Prüfjahr: 2026
      ```
    tests: [{p: 2, t: 1}]

  - typ: begriff
    folien: [75, 135]
    deckt: [c02.str_conv]
    frage: |-
      Wozu braucht man `str()` typischerweise?
    antwort: |-
      Um eine Zahl in Text umzuwandeln, damit man sie mit `+` an einen anderen String hängen kann (z. B. `"ID: " + str(1042)`).

  # ---------------------------------------------------------------- ValueError
  - typ: code_fehler
    folien: [75]
    deckt: [c02.valueerror, c02.int_conv]
    frage: |-
      Welche Fehlermeldung erscheint, und wie kommst du trotzdem zur Ganzzahl `72`?
      ```python
      print(int("72.4"))
      ```
    antwort: |-
      ```text
      ValueError: invalid literal for int() with base 10: '72.4'
      ```
      `int()` kann einen Text mit Dezimalpunkt nicht direkt umwandeln. Erst `float`, dann `int`:
      ```python
      print(int(float("72.4")))
      ```
      ```text
      72
      ```
    tests: [{p: 1, t: 1}, {p: 2, t: 2}]

  - typ: begriff
    folien: [75]
    deckt: [c02.valueerror]
    frage: |-
      Was bedeutet die Fehlermeldung?
      ```text
      ValueError: invalid literal for int() with base 10: 'abc'
      ```
    antwort: |-
      Der Text `'abc'` lässt sich nicht als ganze Zahl lesen – der **Wert** passt nicht zur Umwandlung mit `int()` (meist eine falsche Eingabe bei `int(input())`).

  # ---------------------------------------------------------------- Rundungsfehler
  - typ: code_ausgabe
    folien: [67, 97]
    aufgaben: ["2.4"]
    deckt: [c02.rundung]
    frage: |-
      Was gibt der Code aus?
      ```python
      soll_mm = 25.0
      ist_mm = 24.9
      print(soll_mm - ist_mm)
      ```
    antwort: |-
      ```text
      0.10000000000000142
      ```
      Gleitkommazahlen werden binär mit begrenzter Stellenzahl gespeichert – es entstehen kleine Rundungsfehler. Für die Anzeige hilft eine Formatangabe wie `f"{wert:.2f}"`.
    tests: [{p: 1, t: 1}]

  - typ: code_ausgabe
    folien: [67, 97]
    deckt: [c02.rundung]
    frage: |-
      Was gibt der Code aus?
      ```python
      print(0.1 + 0.2)
      ```
    antwort: |-
      ```text
      0.30000000000000004
      ```
    tests: [{p: 1, t: 1}]

  - typ: begriff
    folien: [67, 97]
    deckt: [c02.rundung]
    frage: |-
      Warum ergibt `0.1 + 0.2 == 0.3` in Python `False`?
    antwort: |-
      float-Werte haben nur begrenzt viele Stellen; 0.1 und 0.2 lassen sich im Binärsystem nicht exakt darstellen. Die Summe ist `0.30000000000000004` – also nicht genau 0.3 (Rundungsfehler).

