  # ---------------------------------------------------------------- dynamische Typisierung
  - typ: code_ausgabe
    folien: [71]
    deckt: [c02.dynamisch]
    frage: |-
      Was gibt der Code aus?
      ```python
      wert = 25
      wert = "25"
      print(type(wert))
      ```
    antwort: |-
      ```text
      <class 'str'>
      ```
      Der Datentyp einer Variablen richtet sich nach dem zuletzt zugewiesenen Wert.
    tests: [{p: 1, t: 1}]

  - typ: unterschied
    folien: [70, 71]
    deckt: [c02.dynamisch]
    frage: |-
      Was ist laut Skript der Unterschied zwischen Variablen in C++ und in Python?
    antwort: |-
      - C++: Variable wird vorher **deklariert und typisiert**, z. B. `int zaehler = 0;` – der Typ steht fest.
      - Python: Der Typ wird **implizit** durch den zugewiesenen Wert festgelegt und kann sich bei jeder neuen Zuweisung ändern.

  # ---------------------------------------------------------------- / liefert float
  - typ: code_ausgabe
    aufgaben: ["2.2"]
    deckt: [c02.division_float]
    frage: |-
      Was gibt der Code aus?
      ```python
      drehzahl = 1500
      print(drehzahl / 2)
      ```
    antwort: |-
      ```text
      750.0
      ```
      `/` liefert immer einen float – auch wenn die Division aufgeht.
    tests: [{p: 1, t: 1}]

  - typ: code_ausgabe
    folien: [104]
    aufgaben: ["2.2"]
    deckt: [c02.division_float]
    frage: |-
      Was gibt der Code aus?
      ```python
      a = 4
      b = 2
      print(a / b)
      ```
    antwort: |-
      ```text
      2.0
      ```
      Achtung: Die Operatortabelle im Skript (F. 104) schreibt vereinfacht „c erhält den Wert 2“ – Python liefert bei `/` aber immer einen float.
    tests: [{p: 1, t: 1}]

  - typ: code_fehler
    aufgaben: ["2.2"]
    deckt: [c02.division_float]
    frage: |-
      Welche Fehlermeldung erscheint, und wie behebst du sie?
      ```python
      drehzahl = 1500 / 2
      balken = drehzahl // 100
      print("#" * balken)
      ```
    antwort: |-
      ```text
      TypeError: can't multiply sequence by non-int of type 'float'
      ```
      `1500 / 2` ist `750.0`, damit ist auch `balken` ein float (`7.0`), und ein String lässt sich nur mit einem int vervielfachen. Korrektur mit Ganzzahldivision:
      ```python
      drehzahl = 1500 // 2
      balken = drehzahl // 100
      print("#" * balken)
      ```
      ```text
      #######
      ```
    tests: [{p: 1, t: 1}, {p: 2, t: 2}]

  - typ: begriff
    aufgaben: ["2.2"]
    deckt: [c02.division_float, c02.mischtyp]
    frage: |-
      Warum liefert `1500 * 2` einen int, `1500 / 2` aber einen float?
    antwort: |-
      Das Produkt zweier Ganzzahlen ist immer ganzzahlig – Python bleibt bei int. Eine Division kann einen Rest ergeben (`5 / 2 = 2.5`), deshalb liefert `/` grundsätzlich float.

