karten:
  # ---------------------------------------------------------------- Variable
  - typ: begriff
    folien: [49, 70]
    deckt: [c02.variable]
    frage: |-
      Was ist eine **Variable** (laut Skript)?
    antwort: |-
      Eine Stelle im Hauptspeicher, die man über einen Namen (Bezeichner) ansprechen kann. Man speichert darin einen Wert und ruft ihn später über den Namen wieder ab.

  - typ: begriff
    folien: [71]
    deckt: [c02.variable]
    frage: |-
      Was bezeichnet man als **Initialisierung** einer Variablen?
    antwort: |-
      Die **erstmalige** Wertzuweisung, z. B. `zaehler = 0`.

  - typ: code_ausgabe
    folien: [49]
    deckt: [c02.variable]
    frage: |-
      Was gibt der Code aus?
      ```python
      druck = 2
      druck = druck + 3
      druck = druck * 2
      print(druck)
      ```
    antwort: |-
      ```text
      10
      ```
      Rechts vom `=` wird zuerst mit dem alten Wert gerechnet: 2 → 5 → 10.
    tests: [{p: 1, t: 1}]

  - typ: code_ausgabe
    folien: [70, 71]
    deckt: [c02.variable]
    frage: |-
      Was gibt der Code aus?
      ```python
      soll = 5
      ist = soll
      soll = 7
      print(ist)
      ```
    antwort: |-
      ```text
      5
      ```
      `ist = soll` übernimmt den Wert, den `soll` in diesem Moment hat. Die spätere Zuweisung an `soll` ändert `ist` nicht.
    tests: [{p: 1, t: 1}]

  - typ: code_fehler
    folien: [49]
    deckt: [c02.variable]
    frage: |-
      Welche Fehlermeldung erscheint, und warum?
      ```python
      print(temperatur)
      temperatur = 20
      ```
    antwort: |-
      ```text
      NameError: name 'temperatur' is not defined
      ```
      Python arbeitet von oben nach unten. In Zeile 1 existiert `temperatur` noch nicht – erst zuweisen, dann verwenden.
    tests: [{p: 1, t: 1}]

  # ---------------------------------------------------------------- Bezeichner
  - typ: begriff
    folien: [58, 62]
    deckt: [c02.bezeichner]
    frage: |-
      Welche dieser Bezeichner sind in Python **ungültig**, und warum?
      `max_temp`, `2te_messung`, `_zaehler`, `druck bar`, `for`
    antwort: |-
      - `2te_messung`: beginnt mit einer Ziffer (erlaubt sind Buchstabe oder `_`).
      - `druck bar`: enthält ein Leerzeichen.
      - `for`: reserviertes Schlüsselwort.

      `max_temp` und `_zaehler` sind gültig.

  - typ: unterschied
    folien: [58]
    deckt: [c02.bezeichner]
    frage: |-
      Was ist der Unterschied zwischen den Bezeichnern `Ergebnis`, `ERGEBNIS` und `ergebnis`?
    antwort: |-
      Es sind **drei verschiedene** Variablen: Python unterscheidet Groß- und Kleinschreibung (case-sensitiv).

  - typ: begriff
    folien: [62]
    deckt: [c02.bezeichner]
    frage: |-
      Was sind **reservierte Schlüsselwörter**?
    antwort: |-
      Wörter mit fester Bedeutung in Python, die man nicht als Bezeichner verwenden darf – z. B. `if`, `for`, `def`, `return`, `while`, `True`.

