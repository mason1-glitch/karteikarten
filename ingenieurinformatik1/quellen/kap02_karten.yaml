  - typ: begriff
    folien: [74]
    deckt: [c02.mischtyp]
    frage: |-
      Was versteht man unter **impliziter** Typumwandlung?
    antwort: |-
      Python ändert den Datentyp **automatisch**, ohne dass man eine Umwandlungsfunktion aufruft – z. B. wird bei `int + float` das Ergebnis ein float, oder eine Variable bekommt bei neuer Zuweisung einen anderen Typ.

  - typ: code_ausgabe
    folien: [74]
    deckt: [c02.mischtyp]
    frage: |-
      Was gibt der Code aus?
      ```python
      summe = 0
      summe = summe + 2.5
      print(summe, type(summe))
      ```
    antwort: |-
      ```text
      2.5 <class 'float'>
      ```
    tests: [{p: 1, t: 1}]

  # ---------------------------------------------------------------- int()
  - typ: code_ausgabe
    folien: [75]
    aufgaben: ["2.4"]
    deckt: [c02.int_conv]
    frage: |-
      Was gibt der Code aus?
      ```python
      temperatur = 72.9
      print(int(temperatur))
      ```
    antwort: |-
      ```text
      72
      ```
      `int()` **schneidet** die Nachkommastellen ab, es rundet nicht.
    tests: [{p: 1, t: 1}]

  - typ: code_ausgabe
    folien: [75]
    aufgaben: ["1.2"]
    deckt: [c02.int_conv]
    frage: |-
      Was gibt der Code aus?
      ```python
      kreis1 = "230"
      kreis2 = "120"
      print(int(kreis1) + int(kreis2))
      ```
    antwort: |-
      ```text
      350
      ```
      Erst umwandeln, dann addieren. Ohne `int()` käme `230120` heraus.
    tests: [{p: 1, t: 1}]

  - typ: code_ausgabe
    folien: [75]
    deckt: [c02.int_conv]
    frage: |-
      Was gibt der Code aus?
      ```python
      print(int(-3.7))
      ```
    antwort: |-
      ```text
      -3
      ```
      `int()` schneidet ab, also Richtung 0 – nicht abrunden auf −4.
    tests: [{p: 1, t: 1}]

  - typ: code_luecke
    folien: [75]
    aufgaben: ["2.4"]
    deckt: [c02.int_conv]
    frage: |-
      Ergänze die Lücke, sodass aus dem Messwert die Ganzzahl `72` wird.
      ```python
      temperatur = 72.4
      temperatur_ganz = ___(temperatur)
      print(temperatur_ganz)
      ```
    antwort: |-
      `int`
      ```python
      temperatur = 72.4
      temperatur_ganz = int(temperatur)
      print(temperatur_ganz)
      ```
      ```text
      72
      ```
    tests: [{p: 2, t: 1}]

  # ---------------------------------------------------------------- float()
  - typ: code_ausgabe
    folien: [75]
    aufgaben: ["2.4"]
    deckt: [c02.float_conv]
    frage: |-
      Was gibt der Code aus?
      ```python
      sensor = "72.4"
      wert = float(sensor)
      print(wert + 1)
      ```
    antwort: |-
      ```text
      73.4
      ```
    tests: [{p: 1, t: 1}]

  - typ: code_fehler
    folien: [67, 75]
    aufgaben: ["2.4"]
    deckt: [c02.float_conv, c02.valueerror]
    frage: |-
      Welche Fehlermeldung erscheint, und wie lautet die Korrektur?
      ```python
      wert = float("72,4")
      print(wert)
      ```
    antwort: |-
      ```text
      ValueError: could not convert string to float: '72,4'
      ```
      Python verwendet den **Punkt** als Dezimaltrennzeichen:
      ```python
      wert = float("72.4")
      print(wert)
      ```
    tests: [{p: 1, t: 1}, {p: 2}]

  - typ: code_ausgabe
    folien: [75]
    deckt: [c02.float_conv]
    frage: |-
      Was gibt der Code aus?
      ```python
      print(float(3))
      ```
    antwort: |-
      ```text
      3.0
      ```
    tests: [{p: 1, t: 1}]

  - typ: code_schreiben
    folien: [75]
    aufgaben: ["2.4"]
    deckt: [c02.float_conv]
    frage: |-
      Der Sensor liefert `sensor_wert = "85.25"` (Text, in °C). Schreib Code, der die Temperatur in °F ausgibt (F = C · 9/5 + 32).
    antwort: |-
      ```python
      sensor_wert = "85.25"
      celsius = float(sensor_wert)
      fahrenheit = celsius * 9 / 5 + 32
      print(fahrenheit)
      ```
      ```text
      185.45
      ```
    tests: [{p: 1, t: 1}]

  # ---------------------------------------------------------------- str()
  - typ: code_ausgabe
    folien: [75]
    deckt: [c02.str_conv]
    frage: |-
      Was gibt der Code aus?
      ```python
      print(str(25) + str(4))
      ```
    antwort: |-
      ```text
      254
      ```
      Nach `str()` sind es Texte – `+` verkettet sie.
    tests: [{p: 1, t: 1}]

  - typ: code_luecke
    folien: [135]
    deckt: [c02.str_conv]
    frage: |-
      Ergänze die Lücke, sodass `Baujahr: 2019` ausgegeben wird.
      ```python
      baujahr = 2019
      print("Baujahr: " + ___(baujahr))
      ```
    antwort: |-
      `str`
      ```python
      baujahr = 2019
      print("Baujahr: " + str(baujahr))
      ```
      ```text
      Baujahr: 2019
      ```
    tests: [{p: 2, t: 1}]

  - typ: begriff
    folien: [75, 135]
    deckt: [c02.str_conv]
    frage: |-
      Wozu braucht man `str()` typischerweise?
    antwort: |-
      Um eine Zahl in Text umzuwandeln, damit man sie mit `+` an einen anderen String hängen kann (z. B. `"ID: " + str(1042)`).

  # ---------------------------------------------------------------- ValueError
  - typ: code_fehler
    folien: [75]
    deckt: [c02.valueerror, c02.int_conv]
    frage: |-
      Welche Fehlermeldung erscheint, und wie kommst du trotzdem zur Ganzzahl `72`?
      ```python
      print(int("72.4"))
      ```
    antwort: |-
      ```text
      ValueError: invalid literal for int() with base 10: '72.4'
      ```
      `int()` kann einen Text mit Dezimalpunkt nicht direkt umwandeln. Erst `float`, dann `int`:
      ```python
      print(int(float("72.4")))
      ```
      ```text
      72
      ```
    tests: [{p: 1, t: 1}, {p: 2, t: 2}]

  - typ: begriff
    folien: [75]
    deckt: [c02.valueerror]
    frage: |-
      Was bedeutet die Fehlermeldung?
      ```text
      ValueError: invalid literal for int() with base 10: 'abc'
      ```
    antwort: |-
      Der Text `'abc'` lässt sich nicht als ganze Zahl lesen – der **Wert** passt nicht zur Umwandlung mit `int()` (meist eine falsche Eingabe bei `int(input())`).

  # ---------------------------------------------------------------- Rundungsfehler
  - typ: code_ausgabe
    folien: [67, 97]
    aufgaben: ["2.4"]
    deckt: [c02.rundung]
    frage: |-
      Was gibt der Code aus?
      ```python
      grenzwert = 85.0
      temperatur = 72.4
      print(grenzwert - temperatur)
      ```
    antwort: |-
      ```text
      12.599999999999994
      ```
      Gleitkommazahlen werden binär mit begrenzter Stellenzahl gespeichert – es entstehen kleine Rundungsfehler. Für die Anzeige hilft `f"{wert:.1f}"`.
    tests: [{p: 1, t: 1}]

  - typ: code_ausgabe
    folien: [67, 97]
    deckt: [c02.rundung]
    frage: |-
      Was gibt der Code aus?
      ```python
      print(0.1 + 0.2)
      ```
    antwort: |-
      ```text
      0.30000000000000004
      ```
    tests: [{p: 1, t: 1}]

  - typ: begriff
    folien: [67, 97]
    deckt: [c02.rundung]
    frage: |-
      Warum ergibt `0.1 + 0.2 == 0.3` in Python `False`?
    antwort: |-
      float-Werte haben nur begrenzt viele Stellen; 0.1 und 0.2 lassen sich im Binärsystem nicht exakt darstellen. Die Summe ist `0.30000000000000004` – also nicht genau 0.3 (Rundungsfehler).

  # ---------------------------------------------------------------- bool
  - typ: code_ausgabe
    folien: [66, 112]
    deckt: [c02.bool]
    frage: |-
      Was gibt der Code aus?
      ```python
      temperatur = 92
      alarm = temperatur > 85
      print(alarm, type(alarm))
      ```
    antwort: |-
      ```text
      True <class 'bool'>
      ```
      Ein Vergleich liefert einen Wahrheitswert, den man in einer Variablen speichern kann.
    tests: [{p: 1, t: 1}]

  - typ: begriff
    folien: [66]
    deckt: [c02.bool]
    frage: |-
      Welche Werte kann der Datentyp `bool` annehmen, und wie schreibt man sie in Python?
    antwort: |-
      Nur `True` (wahr) und `False` (falsch) – mit großem Anfangsbuchstaben.

  - typ: code_luecke
    folien: [66]
    deckt: [c02.bool]
    frage: |-
      Die Variable `fehler` soll den Wahrheitswert **falsch** bekommen. Ergänze die Lücke.
      ```python
      fehler = ___
      print(fehler)
      ```
    antwort: |-
      `False` (ohne Anführungszeichen, großes F)
      ```python
