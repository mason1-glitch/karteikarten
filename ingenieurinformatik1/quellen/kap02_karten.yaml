      ```
    tests: [{p: 1, t: 1}]

  - typ: code_schreiben
    folien: [75]
    aufgaben: ["2.4"]
    deckt: [c02.float_conv]
    frage: |-
      Ein Drucksensor liefert `druck_text = "2.5"` (Text, in bar). Schreib Code, der den Druck in kPa ausgibt (1 bar = 100 kPa).
    antwort: |-
      ```python
      druck_text = "2.5"
      druck_bar = float(druck_text)
