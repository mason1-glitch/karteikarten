  # ---------------------------------------------------------------- Index-Umrechnung
  - typ: code_fehler
    aufgaben: ["4.3"]
    deckt: [c07.umrechnung]
    frage: |-
      Der Nutzer möchte in **Reihe 2, Spalte 1** einlagern (er zählt ab 1). Welche Fehlermeldung erscheint, und was fehlt?
      ```python
      lager = [["-", "-"], ["-", "-"]]
      reihe = 2
      spalte = 1
      lager[reihe][spalte] = "Kolben"
      ```
    antwort: |-
      ```text
      IndexError: list index out of range
      ```
      Python zählt ab 0 – es gibt nur die Zeilen 0 und 1. Richtig: `lager[reihe - 1][spalte - 1] = "Kolben"`.
    tests: [{p: 1, t: 1}]

  - typ: code_ausgabe
    aufgaben: ["4.5"]
    deckt: [c07.umrechnung]
    frage: |-
      Was gibt der Code aus?
      ```python
      lager = [["A", "B"], ["C", "D"]]
      reihe = 1
      spalte = 2
      print(lager[reihe - 1][spalte - 1])
      ```
    antwort: |-
      ```text
      B
      ```
      Reihe 1, Spalte 2 (vom Nutzer gezählt) entspricht `lager[0][1]`.
    tests: [{p: 1, t: 1}]

  - typ: begriff
    aufgaben: ["4.3", "4.5"]
    deckt: [c07.umrechnung]
    frage: |-
      Warum schreibt man bei Benutzereingaben `lager[reihe - 1][spalte - 1]`?
    antwort: |-
      Menschen zählen Reihen und Spalten ab **1**, Python-Indizes beginnen bei **0**. Das `- 1` rechnet die Eingabe in den Index um (bei der Ausgabe umgekehrt `+ 1`).

  # ---------------------------------------------------------------- Tupel
  - typ: unterschied
    folien: [155]
    deckt: [c07.tupel]
    frage: |-
      Was ist der Unterschied zwischen einer **Liste** und einem **Tupel**?
    antwort: |-
      - Liste `[…]`: veränderbar (Elemente ändern, anfügen, löschen), dynamisch.
      - Tupel `(…)`: **unveränderbar**, runde Klammern; dafür performanter.

  - typ: code_fehler
    folien: [155]
    deckt: [c07.tupel]
    frage: |-
      Welche Fehlermeldung erscheint?
      ```python
      abmessungen = (120, 80, 40)
      abmessungen[0] = 125
      ```
    antwort: |-
      ```text
      TypeError: 'tuple' object does not support item assignment
      ```
      Tupel sind unveränderbar. Soll sich der Inhalt ändern, eine Liste verwenden.
    tests: [{p: 1, t: 1}]

  - typ: code_ausgabe
    folien: [155]
    aufgaben: ["5.6"]
    deckt: [c07.tupel]
    frage: |-
      Was gibt der Code aus?
      ```python
      punkt = (3.5, 7.0)
      x, y = punkt
      print(y)
      ```
    antwort: |-
      ```text
      7.0
      ```
      Ein Tupel lässt sich auf mehrere Variablen verteilen (entpacken) – so nimmt man z. B. mehrere Rückgabewerte einer Funktion entgegen.
    tests: [{p: 1, t: 1}]

  # ---------------------------------------------------------------- Referenz / Kopie
  - typ: code_ausgabe
    folien: [161]
    aufgaben: ["4.6"]
    deckt: [c07.referenz]
    frage: |-
      Was gibt der Code aus?
      ```python
      soll = [20, 20, 20]
      backup = soll
      backup[0] = 99
      print(soll)
      ```
    antwort: |-
      ```text
      [99, 20, 20]
      ```
      `backup = soll` kopiert die Liste nicht – beide Namen zeigen auf **dieselbe** Liste.
    tests: [{p: 1, t: 1}]

  - typ: code_luecke
    aufgaben: ["4.6"]
    deckt: [c07.referenz]
    frage: |-
      `backup` soll eine **unabhängige** Kopie sein, damit `soll` unverändert bleibt. Ergänze die Lücke.
      ```python
      soll = [20, 20, 20]
      backup = soll.___
      backup[0] = 99
      print(soll)
      ```
    antwort: |-
      `copy()`
      ```python
      soll = [20, 20, 20]
      backup = soll.copy()
      backup[0] = 99
      print(soll)
      ```
      ```text
      [20, 20, 20]
      ```
    tests: [{p: 2, t: 1}]
