  - typ: unterschied
    folien: [143, 152]
    deckt: [c07.durchlaufen]
    frage: |-
      Was ist der Unterschied zwischen `for x in liste:` und `for i in range(len(liste)):`?
    antwort: |-
      - `for x in liste`: `x` ist direkt das **Element** – einfach, aber man kennt die Position nicht.
      - `for i in range(len(liste))`: `i` ist der **Index** – nötig, wenn man die Position ausgeben oder `liste[i]` ändern will.

  - typ: code_fehler
    folien: [143]
    deckt: [c07.durchlaufen]
    frage: |-
      Alle Werte sollen verzehnfacht werden. Was gibt der Code aus, und wie korrigierst du ihn?
      ```python
      werte = [1, 2, 3]
      for w in werte:
          w = w * 10
      print(werte)
      ```
    antwort: |-
      ```text
      [1, 2, 3]
      ```
      `w` ist nur eine Variable mit dem Wert des Elements; eine neue Zuweisung ändert die Liste nicht. Über den Index schreiben:
      ```python
      werte = [1, 2, 3]
      for i in range(len(werte)):
          werte[i] = werte[i] * 10
      print(werte)
      ```
      ```text
      [10, 20, 30]
      ```
    tests: [{p: 1, t: 1}, {p: 2, t: 2}]

  - typ: code_schreiben
    folien: [148]
    deckt: [c07.durchlaufen]
    frage: |-
      Schreib eine Funktion `fahrenheit(c)` (F = C · 9/5 + 32) und gib damit für jede Temperatur in `temp = [18.0, 20.0]` eine Zeile `18.0 C: 64.4 F` aus.
    antwort: |-
      ```python
      def fahrenheit(c):
          return c * 9 / 5 + 32

      temp = [18.0, 20.0]
      for t in temp:
          print(t, "C:", fahrenheit(t), "F")
      ```
      ```text
      18.0 C: 64.4 F
      20.0 C: 68.0 F
      ```
    tests: [{p: 1, t: 1}]

