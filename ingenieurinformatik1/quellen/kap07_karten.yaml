      Wie ist eine zweidimensionale Liste aufgebaut, und was bedeuten die Indizes in `matrix[i][j]`?
    antwort: |-
      Eine Liste, deren Elemente selbst Listen sind (jede innere Liste = eine Zeile). `i` wählt die Zeile, `j` die Spalte in dieser Zeile.

