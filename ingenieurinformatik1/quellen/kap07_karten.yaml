  - typ: code_schreiben
    folien: [152]
    aufgaben: ["4.4"]
    deckt: [c07.verschachtelt]
    frage: |-
      Suche in `lager = [["A", "-"], ["-", "B"]]` das Teil `"B"` und gib seine Position **ab 1 gezählt** aus (`Reihe 2 Spalte 2`).
    antwort: |-
      ```python
      lager = [["A", "-"], ["-", "B"]]
      for i in range(len(lager)):
          for j in range(len(lager[i])):
              if lager[i][j] == "B":
                  print("Reihe", i + 1, "Spalte", j + 1)
      ```
      ```text
      Reihe 2 Spalte 2
      ```
    tests: [{p: 1, t: 1}]

